<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure CBT Portal</title>

<style>
body{margin:0;font-family:Segoe UI;background:#020617;color:#e5e7eb}
.hidden{display:none}
button,input,textarea{
  width:100%;padding:10px;margin:6px 0;
  border-radius:6px;border:1px solid #334155;
  background:#020617;color:white
}
button{background:#0ea5e9;font-weight:bold}
button.danger{background:#dc2626}
.card{
  max-width:900px;margin:20px auto;padding:20px;
  border:1px solid #334155;border-radius:12px;
  background:#0f172a
}
.topbar{
  background:#1e293b;padding:10px;text-align:center;font-weight:bold
}
</style>
</head>

<body oncontextmenu="return false">

<div class="topbar">
  SECURE CBT |
  Time: <span id="timer">--</span> |
  Violations: <span id="vCount">0</span>/2
</div>

<div id="loginBox" class="card">
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="adminBox" class="card hidden">
  <h2>Admin – Exam Creator</h2>

  <input id="examTitle" placeholder="Exam Title">
  <input id="examDuration" placeholder="Duration (minutes)">

  <textarea id="examQuestions" rows="8" placeholder="
1. Voltage is measured in _____.
a) Ampere
b) Volt
c) Ohm
d) Watt
"></textarea>

  <textarea id="examAnswers" rows="3" placeholder="1b"></textarea>

  <button onclick="previewExam()">Preview</button>
  <div id="preview"></div>

  <button onclick="publishExam()">Publish</button>
  <button class="danger" onclick="logout()">Logout</button>
</div>

<div id="studentBox" class="card hidden">
  <h3 id="qNo"></h3>
  <pre id="question"></pre>
  <div id="options"></div>
  <button onclick="prevQ()">Previous</button>
  <button onclick="nextQ()">Next</button>
  <button class="danger" onclick="submitExam()">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  databaseURL: "https://focus-dashboard-5965a-default-rtdb.firebaseio.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.appspot.com",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const ADMIN_EMAIL = "admin@study.com";

let exam = null;
let qIndex = 0;
let answers = {};
let timerInt = null;
let violations = 0;

/* ---------- LOGIN ---------- */
window.login = async () => {
  const user = await signInWithEmailAndPassword(auth,email.value,password.value);
  loginBox.classList.add("hidden");

  if (user.user.email === ADMIN_EMAIL) {
    adminBox.classList.remove("hidden");
  } else {
    startStudent();
  }
};

/* ---------- ADMIN ---------- */
window.previewExam = () => {
  preview.innerHTML = "Preview OK (basic check passed)";
};

window.publishExam = async () => {
  const blocks = examQuestions.value.trim().split(/\n\s*\n/);
  const questions = blocks.map(b => {
    const id = b.match(/^(\d+)/)?.[1];
    const opts = [...b.matchAll(/[a-d]\)\s*(.*)/gi)].map(o=>o[1]);
    return { id, text: b, options: opts };
  });

  const key = {};
  examAnswers.value.split(/\s+/).forEach(x=>{
    const m=x.match(/(\d)([a-d])/i);
    if(m) key[m[1]]=m[2];
  });

  await set(push(ref(db,"CBT/EXAMS")),{
    title: examTitle.value,
    duration: +examDuration.value,
    questions,
    answerKey: key,
    active: true
  });

  alert("Exam Published");
  location.reload();
};

/* ---------- STUDENT ---------- */
async function startStudent() {
  studentBox.classList.remove("hidden");
  document.documentElement.requestFullscreen?.();

  const snap = await get(ref(db,"CBT/EXAMS"));
  if (!snap.exists()) {
    alert("No active exam");
    return;
  }

  exam = Object.values(snap.val()).find(e=>e.active);
  if (!exam) {
    alert("No active exam found");
    return;
  }

  startTimer(exam.duration * 60);
  renderQ();

  document.addEventListener("visibilitychange",()=>violate());
  window.addEventListener("blur",()=>violate());
}

function violate() {
  violations++;
  vCount.innerText = violations;
  if (violations >= 2) submitExam();
}

function startTimer(sec) {
  timerInt = setInterval(()=>{
    timer.innerText = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
    if (--sec < 0) submitExam();
  },1000);
}

function renderQ() {
  const q = exam.questions[qIndex];
  qNo.innerText = "Question " + q.id;
  question.innerText = q.text;
  options.innerHTML = "";

  q.options.forEach((o,i)=>{
    const c = String.fromCharCode(97+i);
    options.innerHTML += `
      <label>
        <input type="radio" name="opt"
        ${answers[q.id]===c?"checked":""}
        onchange="answers['${q.id}']='${c}'">
        ${c}) ${o}
      </label><br>`;
  });
}

window.nextQ = () => { if (qIndex < exam.questions.length-1){ qIndex++; renderQ(); }};
window.prevQ = () => { if (qIndex > 0){ qIndex--; renderQ(); }};

window.submitExam = async () => {
  clearInterval(timerInt);
  let score = 0;
  Object.keys(exam.answerKey).forEach(k=>{
    if (answers[k] === exam.answerKey[k]) score++;
  });

  await set(push(ref(db,"CBT/RESULTS")),{
    score,
    total: Object.keys(exam.answerKey).length,
    time: Date.now()
  });

  alert("Submitted. Score: " + score);
  location.reload();
};

window.logout = () => signOut(auth).then(()=>location.reload());
</script>

</body>
</html>
