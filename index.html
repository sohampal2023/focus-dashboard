<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#020617);color:#e5e7eb}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.sidebar{padding:20px;display:flex;flex-direction:column;gap:18px;border-right:1px solid #1e293b}
.sidebar h2{text-align:center;color:#38bdf8;margin:0}
.status{padding:16px;border-radius:16px;border:2px solid #334155;text-align:center;font-weight:700;background:#020617}
.nav button{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid #1e293b;background:#020617;color:#e5e7eb;font-weight:600;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.main{padding:25px;overflow:auto}
.card{background:#020617;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:20px}
.hidden{display:none}
.task{display:flex;gap:10px;margin:10px 0}
.progress{height:18px;border-radius:10px;overflow:hidden;border:1px solid #1e293b}
.bar{height:100%;font-size:11px;font-weight:700;text-align:center}
.EXCELLENT{background:#22c55e}
.GOOD{background:#84cc16}
.AVERAGE{background:#facc15}
.POOR{background:#ef4444}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #334155;padding:6px;text-align:left}
th{background:#020617}
input.nextTask{width:100%;padding:8px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#020617;color:#e5e7eb}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="statusBox" class="status">Status: Logged out</div>

  <div id="idleBox" class="status hidden">
    Idle Timer: <b><span id="idleTime">30:00</span></b><br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <div class="nav">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
    <button id="dayEndBtn" onclick="openDayEnd()" disabled>Day End</button>
  </div>
</div>

<div class="main">

  <!-- TASKS -->
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
    <hr>
    <h4>Extra Work (Bonus)</h4>
    <div id="extraList"></div>
    <button onclick="addExtraTask()">+ Add Extra Work</button>
  </div>

  <!-- LOG TABLE -->
  <div id="logBox" class="card hidden">
    <h3>Login / Logout Log</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Login Time</th>
          <th>Logout Time</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody id="logTable"></tbody>
    </table>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
</div>
</div>

<script>
let UID=null;
let idleTimer=null;
let idleRemaining=1800;

const K_TASKS="TASKS";
const K_EXTRA="EXTRA_TASKS";
const K_NEXT="NEXT_TASKS";
const K_LOGS="LOGS";
const BONUS=5;
const key=k=>UID+"_"+k;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

/* LOGIN */
function login(){
  UID=prompt("Email");
  if(!UID)return;

  reportBox.classList.add("hidden");
  reportBox.innerHTML="";

  statusBox.innerText="Status: Logged in";
  loginBtn.disabled=true;
  bioBtn.disabled=false;
  dayEndBtn.disabled=false;

  idleBox.classList.remove("hidden");
  startIdle();

  const logs=JSON.parse(localStorage.getItem(key(K_LOGS))||"[]");
  logs.push({login:new Date().toLocaleString(),logout:"—",reason:"—"});
  localStorage.setItem(key(K_LOGS),JSON.stringify(logs));

  mergeTasks();
  loadTasks();
  renderLogs();
}

/* TASK MERGE */
function mergeTasks(){
  const prev=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const next=JSON.parse(localStorage.getItem(key(K_NEXT))||"[]");

  const merged=[
    ...prev,
    ...next.map(n=>({name:n,done:false}))
  ];

  if(!merged.length){
    merged.push(
      {name:"Study core subject",done:false},
      {name:"Revise notes",done:false},
      {name:"Practice questions",done:false}
    );
  }

  localStorage.setItem(key(K_TASKS),JSON.stringify(merged));
  localStorage.removeItem(key(K_NEXT));
  localStorage.setItem(key(K_EXTRA),"[]");

  tasksBox.classList.remove("hidden");
}

/* TASK UI */
function loadTasks(){
  taskList.innerHTML="";
  extraList.innerHTML="";

  const tasks=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");

  tasks.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      if(!confirm("Confirm task status change?")){
        cb.checked=!cb.checked;return;
      }
      t.done=cb.checked;
      localStorage.setItem(key(K_TASKS),JSON.stringify(tasks));
    };
    taskList.append(cb," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=e.done;
    cb.onchange=()=>{
      if(!confirm("Confirm extra work completion?")){
        cb.checked=!cb.checked;return;
      }
      e.done=cb.checked;
      localStorage.setItem(key(K_EXTRA),JSON.stringify(extras));
    };
    extraList.append(cb," "+e.name,document.createElement("br"));
  });
}

/* LOG TABLE */
function renderLogs(){
  logBox.classList.remove("hidden");
  logTable.innerHTML="";

  const logs=JSON.parse(localStorage.getItem(key(K_LOGS))||"[]");
  logs.forEach((l,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${i+1}</td><td>${l.login}</td><td>${l.logout}</td><td>${l.reason}</td>`;
    logTable.appendChild(tr);
  });
}

/* EXTRA WORK */
function addExtraTask(){
  const name=prompt("Extra work?");
  if(!name)return;
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");
  extras.push({name,done:false});
  localStorage.setItem(key(K_EXTRA),JSON.stringify(extras));
  loadTasks();
}

/* IDLE */
function startIdle(){
  clearInterval(idleTimer);
  idleRemaining=1800;
  idleTime.innerText=fmt(idleRemaining);
  idleTimer=setInterval(()=>{
    idleRemaining--;
    idleTime.innerText=fmt(idleRemaining);
    if(idleRemaining<=0) location.reload();
  },1000);
}
function resetIdle(){startIdle()}

/* DAY END */
function openDayEnd(){
  let html="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    html+=`<input class="nextTask" placeholder="Next Day Task ${i+1}">`;
  }
  html+=`<br><button onclick="confirmDayEnd()">Submit</button>`;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
}

function confirmDayEnd(){
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");

  const next=[...document.querySelectorAll(".nextTask")]
    .map(i=>i.value.trim()).filter(v=>v);
  if(next.length) localStorage.setItem(key(K_NEXT),JSON.stringify(next));

  const tasks=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");

  const undone=tasks.filter(t=>!t.done);
  localStorage.setItem(key(K_TASKS),JSON.stringify(undone));

  const doneCount=tasks.length-undone.length;
  const base=Math.round(doneCount/tasks.length*100);
  const bonus=extras.filter(e=>e.done).length*BONUS;
  const final=Math.min(100,base+bonus);

  const grade=final>=80?"EXCELLENT":final>=60?"GOOD":final>=40?"AVERAGE":"POOR";

  reportBox.innerHTML=`
    <h3>Report Card</h3>
    Done: ${doneCount}/${tasks.length}<br>
    Extra Done: ${extras.filter(e=>e.done).length}<br><br>
    <div class="progress">
      <div class="bar ${grade}" style="width:${final}%">${final}%</div>
    </div>
    Grade: <b>${grade}</b>
  `;
  reportBox.classList.remove("hidden");

  tasksBox.classList.add("hidden");
  dayEndBox.classList.add("hidden");

  bioBtn.disabled=true;
  dayEndBtn.disabled=true;
  loginBtn.disabled=false;

  statusBox.innerText="Status: Day End Completed";
}

/* BIO BREAK (ADD REASON) */
function bioBreak(){
  const reason=prompt("Reason for Bio Break?");
  if(!reason)return;

  const logs=JSON.parse(localStorage.getItem(key(K_LOGS))||"[]");
  if(logs.length){
    logs[logs.length-1].logout=new Date().toLocaleString();
    logs[logs.length-1].reason=reason;
    localStorage.setItem(key(K_LOGS),JSON.stringify(logs));
  }
  location.reload();
}
</script>
</body>
</html>
