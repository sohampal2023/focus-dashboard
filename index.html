<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Focus Dashboard</h1>
    <p>Your personal study focus system is running.</p>

    <p class="status" id="statusText">Status: Logged out</p>

    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Daily Focus Report</h3>

    <label>Productive Time (HH : MM : SS)</label><br>
    <input type="number" id="ph" placeholder="HH" min="0"> :
    <input type="number" id="pm" placeholder="MM" min="0" max="59"> :
    <input type="number" id="ps" placeholder="SS" min="0" max="59">
    <br><br>

    <label>Distracting Time (HH : MM : SS)</label><br>
    <input type="number" id="dh" placeholder="HH" min="0"> :
    <input type="number" id="dm" placeholder="MM" min="0" max="59"> :
    <input type="number" id="ds" placeholder="SS" min="0" max="59">
    <br><br>

    <label>Total Time (HH : MM : SS)</label><br>
    <input type="number" id="th" placeholder="HH" min="0"> :
    <input type="number" id="tm" placeholder="MM" min="0" max="59"> :
    <input type="number" id="ts" placeholder="SS" min="0" max="59">
    <br><br>

    <label>Upload Proof (2–4 screenshots)</label><br>
    <input type="file" id="proof" accept="image/*" multiple>
    <br><br>

    <button onclick="submitReport()">Submit Report</button>

    <p id="result"></p>
  </div>

  <script>
    function login() {
      document.getElementById("statusText").innerText = "Status: Logged in";
    }

    function logout() {
      document.getElementById("statusText").innerText = "Status: Logged out";
    }

    function toSeconds(h, m, s) {
      return (h * 3600) + (m * 60) + s;
    }

    function submitReport() {
      const ph = +document.getElementById("ph").value;
      const pm = +document.getElementById("pm").value;
      const ps = +document.getElementById("ps").value;

      const dh = +document.getElementById("dh").value;
      const dm = +document.getElementById("dm").value;
      const ds = +document.getElementById("ds").value;

      const th = +document.getElementById("th").value;
      const tm = +document.getElementById("tm").value;
      const ts = +document.getElementById("ts").value;

      const files = document.getElementById("proof").files;

      if (!files || files.length < 2 || files.length > 4) {
        document.getElementById("result").innerText =
          "ABSENT: Upload 2 to 4 proof screenshots.";
        return;
      }

      const productive = toSeconds(ph, pm, ps);
      const distracting = toSeconds(dh, dm, ds);
      const total = toSeconds(th, tm, ts);

      if (productive + distracting > total) {
        document.getElementById("result").innerText =
          "Invalid time values.";
        return;
      }

      const productivity = ((productive / total) * 100).toFixed(1);

      document.getElementById("result").innerText =
        "PRESENT ✔  | Productivity: " + productivity + "%";
    }
  </script>
</body>
</html>
