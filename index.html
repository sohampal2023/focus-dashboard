<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,system-ui,sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  border-right:1px solid #1e293b;
}
.status{
  padding:20px;
  border:2px solid #334155;
  border-radius:14px;
  font-weight:700;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:12px;
  margin:6px 0;
  background:#020617;
  color:#fff;
  border:1px solid #334155;
  cursor:pointer;
}
.main{
  padding:20px;
}
.task{
  display:flex;
  gap:10px;
  margin:8px 0;
}
.hidden{display:none}

/* POPUP */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
}
.popup{
  background:#020617;
  border:2px solid #38bdf8;
  padding:25px;
  border-radius:16px;
  width:320px;
  text-align:center;
}
.popup button{
  width:auto;
  padding:10px 18px;
  margin:10px;
}
</style>
</head>

<body>

<div class="app">
  <div class="sidebar">
    <h3>FOCUS SYSTEM</h3>
    <div id="status" class="status">Status: Logged out</div>
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="dayEnd()">Day End</button>
  </div>

  <div class="main">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
    <input id="newTask" placeholder="Next day task">
    <button onclick="addTask()">Add Task</button>
    <div id="reportBox" class="hidden"></div>
  </div>
</div>

<!-- Focus Popup -->
<div id="focusOverlay" class="overlay hidden">
  <div class="popup">
    <h3>Focus Check</h3>
    <p>Studying or distracted?</p>
    <button onclick="focusResponse(true)">Studying</button>
    <button onclick="focusResponse(false)">Distracted</button>
    <p style="font-size:12px">No response in 1 minute → idle mark</p>
  </div>
</div>

<!-- Firebase (STABLE COMPAT SDK) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a"
});
const auth = firebase.auth();
const db = firebase.firestore();

/* ================= STATE ================= */
let uid = null;
let sessionId = null;
let tasks = [];
let popupMiss = 0;
let score = 100;
let popupTimer = null;
let loggedIn = false;

/* ================= HELPERS ================= */
const statusBox = document.getElementById("status");
const taskList = document.getElementById("taskList");

/* ================= LOGIN ================= */
async function login(){
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;

  const res = await auth.signInWithEmailAndPassword(email, pass);
  uid = res.user.uid;
  loggedIn = true;

  statusBox.innerText = "Status: Logged in";
  await createOrLoadSession();
  startFocusCycle();
}

/* ================= SESSION ================= */
async function createOrLoadSession(){
  const snap = await db.collection("daily_sessions")
    .where("uid","==",uid)
    .where("status","==","ACTIVE")
    .get();

  if(snap.empty){
    const ref = await db.collection("daily_sessions").add({
      uid,
      loginAt: firebase.firestore.FieldValue.serverTimestamp(),
      status:"ACTIVE",
      popupMiss:0,
      score:100
    });
    sessionId = ref.id;
    tasks = [];
  }else{
    sessionId = snap.docs[0].id;
    const t = await db.collection("daily_tasks")
      .where("sessionId","==",sessionId).get();
    tasks = t.empty ? [] : t.docs[0].data().tasks;
  }
  renderTasks();
}

/* ================= TASKS ================= */
function renderTasks(){
  taskList.innerHTML="";
  tasks.forEach((t,i)=>{
    const cb = document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task completed?")){
        tasks[i].done=true;
        saveTasks();
      }else cb.checked=false;
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb,t.name);
    taskList.appendChild(d);
  });
}

async function saveTasks(){
  const snap = await db.collection("daily_tasks")
    .where("sessionId","==",sessionId).get();

  if(snap.empty){
    await db.collection("daily_tasks").add({uid,sessionId,tasks});
  }else{
    await snap.docs[0].ref.update({tasks});
  }
  renderTasks();
}

function addTask(){
  const v=document.getElementById("newTask").value.trim();
  if(!v) return;
  tasks.push({name:v,done:false});
  saveTasks();
  document.getElementById("newTask").value="";
}

/* ================= FOCUS POPUP ================= */
function startFocusCycle(){
  if(!loggedIn) return;

  popupTimer=setTimeout(()=>{
    showPopup();
  },30000); // test: 30s
}

function showPopup(){
  if(!loggedIn) return;
  document.getElementById("focusOverlay").classList.remove("hidden");

  popupTimer=setTimeout(()=>{
    popupMiss++;
    score -= 2;
    hidePopup();
    if(popupMiss>=3){
      alert("3 idle misses. Auto logout.");
      bioBreak();
    }else{
      startFocusCycle();
    }
  },60000);
}

function hidePopup(){
  clearTimeout(popupTimer);
  document.getElementById("focusOverlay").classList.add("hidden");
}

function focusResponse(ok){
  hidePopup();
  if(!ok){
    popupMiss++;
    score -= 2;
    if(popupMiss>=3){
      alert("3 idle misses. Auto logout.");
      bioBreak();
      return;
    }
  }
  startFocusCycle();
}

/* ================= BIO BREAK ================= */
async function bioBreak(){
  hidePopup();
  loggedIn=false;
  await auth.signOut();
  statusBox.innerText="Status: Bio Break";
}

/* ================= DAY END ================= */
async function dayEnd(){
  if(!loggedIn) return;

  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;

  await db.collection("daily_sessions").doc(sessionId).update({
    status:"CLOSED",
    popupMiss,
    score,
    dayEndAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("reportBox").innerHTML=
    `<h3>Report Card</h3>
     Tasks: ${done}/${total}<br>
     Completion: ${pct}%<br>
     Score: ${score}%`;

  document.getElementById("reportBox").classList.remove("hidden");
  bioBreak();
}

/* ================= EXPOSE (CRITICAL FIX) ================= */
window.login=login;
window.bioBreak=bioBreak;
window.dayEnd=dayEnd;
window.addTask=addTask;
window.focusResponse=focusResponse;
</script>

</body>
</html>
