<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:linear-gradient(135deg,#0f172a,#020617);color:#e5e7eb}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.sidebar{padding:20px;display:flex;flex-direction:column;gap:18px;border-right:1px solid #1e293b}
.sidebar h2{text-align:center;color:#38bdf8;margin:0}
.status{padding:16px;border-radius:16px;border:2px solid #334155;text-align:center;font-weight:700;background:#020617}
.nav button{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid #1e293b;background:#020617;color:#e5e7eb;font-weight:600;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.main{padding:25px;overflow:auto}
.card{background:#020617;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:20px}
.hidden{display:none}
.task{display:flex;gap:10px;margin:10px 0}
.log{font-size:13px;border-top:1px solid #334155;padding-top:8px;margin-top:8px}
input.nextTask{width:100%;padding:8px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#020617;color:#e5e7eb}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="statusBox" class="status">Status: Logged out</div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
    <button id="dayEndBtn" onclick="openDayEnd()" disabled>Day End</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="logBox" class="card hidden">
    <h3>Login / Logout Log</h3>
    <div id="logList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
</div>
</div>

<script>
/* ===== STATE ===== */
let CURRENT_UID=null;

/* ===== STORAGE KEYS ===== */
const K_TASKS="TASKS";
const K_NEXT="NEXT_TASKS";
const K_LOGS="LOGS";

/* ===== HELPERS ===== */
const k = x => CURRENT_UID+"_"+x;
const now = () => new Date().toLocaleString();

/* ===== LOGIN ===== */
function login(){
  const email=prompt("Email");
  if(!email) return;

  CURRENT_UID=email;

  document.getElementById("statusBox").innerText="Status: Logged in";
  document.getElementById("bioBtn").disabled=false;
  document.getElementById("dayEndBtn").disabled=false;

  const logs=JSON.parse(localStorage.getItem(k(K_LOGS))||"[]");
  logs.push({login:now(),logout:"—",reason:"—"});
  localStorage.setItem(k(K_LOGS),JSON.stringify(logs));

  mergeTasks();
  renderTasks();
  renderLogs();
}

/* ===== TASK MERGE ===== */
function mergeTasks(){
  const prev=JSON.parse(localStorage.getItem(k(K_TASKS))||"[]");
  const next=JSON.parse(localStorage.getItem(k(K_NEXT))||"[]");

  const merged=[
    ...prev.filter(t=>!t.done),
    ...next.map(n=>({name:n,done:false}))
  ];

  if(merged.length===0){
    merged.push(
      {name:"Study core subject",done:false},
      {name:"Revise notes",done:false},
      {name:"Practice questions",done:false}
    );
  }

  localStorage.setItem(k(K_TASKS),JSON.stringify(merged));
  localStorage.removeItem(k(K_NEXT));
}

/* ===== TASK RENDER ===== */
function renderTasks(){
  const box=document.getElementById("tasksBox");
  const list=document.getElementById("taskList");
  box.classList.remove("hidden");
  list.innerHTML="";

  const tasks=JSON.parse(localStorage.getItem(k(K_TASKS))||"[]");
  tasks.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{t.done=cb.checked;localStorage.setItem(k(K_TASKS),JSON.stringify(tasks))};
    list.append(cb," "+t.name,document.createElement("br"));
  });
}

/* ===== LOG RENDER ===== */
function renderLogs(){
  const box=document.getElementById("logBox");
  const list=document.getElementById("logList");
  box.classList.remove("hidden");
  list.innerHTML="";

  const logs=JSON.parse(localStorage.getItem(k(K_LOGS))||"[]");
  logs.forEach(l=>{
    list.innerHTML+=`<div class="log">
      Login: ${l.login}<br>
      Logout: ${l.logout}<br>
      Reason: ${l.reason}
    </div>`;
  });
}

/* ===== BIO BREAK (FIXED) ===== */
function bioBreak(){
  const reason=prompt("Reason for Bio Break?");
  if(!reason) return;

  const logs=JSON.parse(localStorage.getItem(k(K_LOGS))||"[]");
  if(logs.length){
    logs[logs.length-1].logout=now();
    logs[logs.length-1].reason=reason;
    localStorage.setItem(k(K_LOGS),JSON.stringify(logs));
  }

  /* IMMEDIATE LOGOUT */
  CURRENT_UID=null;

  document.getElementById("statusBox").innerText="Status: Logged out";
  document.getElementById("bioBtn").disabled=true;
  document.getElementById("dayEndBtn").disabled=true;

  document.getElementById("tasksBox").classList.add("hidden");
  document.getElementById("logBox").classList.add("hidden");
}

/* ===== DAY END ===== */
function openDayEnd(){
  let html="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    html+=`<input class="nextTask" placeholder="Next Day Task ${i+1}">`;
  }
  html+=`<br><button onclick="confirmDayEnd()">Submit</button>`;
  const box=document.getElementById("dayEndBox");
  box.innerHTML=html;
  box.classList.remove("hidden");
}

function confirmDayEnd(){
  const inputs=[...document.querySelectorAll(".nextTask")]
    .map(i=>i.value.trim())
    .filter(v=>v);

  if(inputs.length){
    localStorage.setItem(CURRENT_UID+"_"+K_NEXT,JSON.stringify(inputs));
  }

  const tasks=JSON.parse(localStorage.getItem(CURRENT_UID+"_"+K_TASKS)||"[]");
  const done=tasks.filter(t=>t.done).length;
  const percent=Math.round(done/tasks.length*100);

  const report=document.getElementById("reportBox");
  report.innerHTML=`<h3>Report Card</h3>
    Tasks: ${done}/${tasks.length}<br>
    Completion: <b>${percent}%</b>`;
  report.classList.remove("hidden");

  /* RESET FOR NEXT DAY */
  localStorage.removeItem(CURRENT_UID+"_"+K_TASKS);
  localStorage.removeItem(CURRENT_UID+"_"+K_LOGS);

  document.getElementById("tasksBox").classList.add("hidden");
  document.getElementById("dayEndBox").classList.add("hidden");
  document.getElementById("bioBtn").disabled=true;
  document.getElementById("dayEndBtn").disabled=true;
  document.getElementById("statusBox").innerText="Status: Day End Completed";
}
</script>
</body>
</html>
