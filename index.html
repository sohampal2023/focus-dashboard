<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus System</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:#020617;color:#e5e7eb}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{
  padding:20px;
  border-right:1px solid #1e293b;
}
.sidebar h2{text-align:center;color:#7dd3fc;margin-bottom:10px}
.status{
  padding:10px;
  border:1px solid #334155;
  border-radius:10px;
  text-align:center;
  margin-bottom:12px;
}
button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer;
}
button:disabled{opacity:.4;cursor:not-allowed}

/* MAIN */
.main{padding:24px;overflow:auto}
.card{
  background:#020617;
  border:1px solid #334155;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}

/* SPEEDOMETER (calm) */
.speedo{
  width:300px;height:150px;border-radius:300px 300px 0 0;
  background:conic-gradient(from -90deg,
    #7f1d1d,#92400e,#a16207,#14532d,#312e81);
  position:relative;
  box-shadow:inset 0 0 0 14px #020617,inset 0 0 0 18px #1e293b;
}
.needle{
  position:absolute;width:4px;height:110px;
  background:#e5e7eb;left:50%;bottom:0;
  transform-origin:bottom center;
  transform:rotate(-90deg);
  transition:.6s cubic-bezier(.15,.85,.2,1);
}
.cap{
  position:absolute;width:14px;height:14px;background:#e5e7eb;
  border-radius:50%;left:50%;bottom:0;
  transform:translate(-50%,50%);
}
.percent{text-align:center;font-size:36px;font-weight:800;color:#7dd3fc}
.rating{text-align:center;font-size:18px;font-weight:700}
.details{text-align:center;font-size:14px;color:#cbd5f5}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #334155;padding:6px;text-align:center}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="statusBox" class="status">Logged out</div>
  <button id="loginBtn" onclick="login()">Login</button>
  <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
  <button id="dayBtn" onclick="openDayEnd()" disabled>Day End</button>
</div>

<div class="main">

<!-- TASK VIEW -->
<div id="taskBox" class="card hidden">
  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">

    <div>
      <h3>Assigned Tasks</h3>
      <div id="taskList"></div>
      <hr>
      <h4>Extra Work</h4>
      <div id="extraList"></div>
      <button onclick="addExtra()">+ Add Extra Work</button>
    </div>

    <div>
      <h3 style="text-align:center">Live Progress</h3>
      <div class="speedo">
        <div id="needle" class="needle"></div>
        <div class="cap"></div>
      </div>
      <div id="livePercent" class="percent">0%</div>
      <div id="liveRating" class="rating">Poor</div>
      <div id="liveDetails" class="details"></div>
    </div>

  </div>
</div>

<!-- LOGIN LOG -->
<div id="logBox" class="card hidden">
  <h3>Login / Logout Log</h3>
  <table>
    <thead><tr><th>Login</th><th>Logout</th><th>Reason</th></tr></thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<!-- NEXT DAY TASK INPUT -->
<div id="nextDayBox" class="card hidden"></div>

<!-- REPORT -->
<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
let UID=null;
const now=()=>new Date().toLocaleString();
const key=k=>UID+"_"+k;

/* LOGIN */
function login(){
  UID=prompt("Email");
  if(!UID)return;

  if(localStorage.getItem(key("ASK_REASON"))==="1"){
    const logs=JSON.parse(localStorage.getItem(key("LOGS")));
    const r=prompt("Reason for last logout?");
    logs[logs.length-1].reason=r||"Not specified";
    localStorage.setItem(key("LOGS"),JSON.stringify(logs));
    localStorage.removeItem(key("ASK_REASON"));
  }

  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||"[]");
  logs.push({login:now(),logout:"-",reason:"-"});
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));

  statusBox.innerText="Logged in";
  loginBtn.disabled=true;
  bioBtn.disabled=false;
  dayBtn.disabled=false;

  setupTasks();
  loadTasks();
  renderLogs();
  updateProgress();
}

/* BIO BREAK */
function bioBreak(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout=now();
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));
  localStorage.setItem(key("ASK_REASON"),"1");
  location.reload();
}

/* SETUP TASKS */
function setupTasks(){
  const carried=JSON.parse(localStorage.getItem(key("TASKS"))||"[]");
  const next=JSON.parse(localStorage.getItem(key("NEXT_TASKS"))||"[]");

  let merged=[...carried,...next.map(n=>({name:n,done:false}))];
  if(!merged.length){
    merged=[
      {name:"Study",done:false},
      {name:"Revise",done:false},
      {name:"Practice",done:false}
    ];
  }

  localStorage.setItem(key("TASKS"),JSON.stringify(merged));
  localStorage.removeItem(key("NEXT_TASKS"));
  localStorage.setItem(key("EXTRA"),JSON.stringify([]));

  taskBox.classList.remove("hidden");
  logBox.classList.remove("hidden");
  reportBox.classList.add("hidden");
}

/* LOAD TASKS */
function loadTasks(){
  taskList.innerHTML="";
  extraList.innerHTML="";

  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));

  tasks.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      if(!confirm("Confirm task completion?")){
        cb.checked=!cb.checked;return;
      }
      t.done=cb.checked;
      save(tasks,extras);
    };
    taskList.append(cb," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=e.done;
    cb.onchange=()=>{
      if(!confirm("Confirm extra work completion?")){
        cb.checked=!cb.checked;return;
      }
      e.done=cb.checked;
      save(tasks,extras);
    };
    extraList.append(cb," "+e.name,document.createElement("br"));
  });
}

/* ADD EXTRA */
function addExtra(){
  const name=prompt("Extra work?");
  if(!name)return;
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));
  extras.push({name,done:false});
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  loadTasks();
}

/* SAVE + UPDATE */
function save(tasks,extras){
  localStorage.setItem(key("TASKS"),JSON.stringify(tasks));
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  updateProgress();
}

/* SINGLE SOURCE OF TRUTH */
function calculateProgress(){
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));
  const doneAssigned=tasks.filter(t=>t.done).length;
  const doneExtra=extras.filter(e=>e.done).length;
  const assigned=tasks.length;

  const totalDone=doneAssigned+doneExtra;
  const percent=assigned?Math.round((totalDone/assigned)*100):0;

  return {percent,assigned,doneAssigned,doneExtra,totalDone};
}

/* UPDATE SPEEDO + TEXT */
function updateProgress(){
  const p=calculateProgress();
  const angle=(Math.min(p.percent,300)/300)*180 - 90;

  needle.style.transform=`rotate(${angle}deg)`;
  livePercent.innerText=p.percent+"%";
  liveRating.innerText=getLabel(p.percent);
  liveDetails.innerText=
    `Assigned: ${p.assigned} | Done: ${p.doneAssigned} | Extra: ${p.doneExtra}`;
}

function getLabel(p){
  if(p<40)return"Poor";
  if(p<60)return"Average";
  if(p<80)return"Good";
  if(p<100)return"Excellent";
  return"Fabulous";
}

/* DAY END STEP 1 */
function openDayEnd(){
  nextDayBox.innerHTML="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    nextDayBox.innerHTML+=
      `<input id="nd${i}" style="width:100%;margin:6px 0">`;
  }
  nextDayBox.innerHTML+=
    `<button onclick="finalDayEnd()">Submit</button>`;
  nextDayBox.classList.remove("hidden");
}

/* DAY END FINAL */
function finalDayEnd(){
  const next=[];
  for(let i=0;i<5;i++){
    const v=document.getElementById("nd"+i).value.trim();
    if(v)next.push(v);
  }
  localStorage.setItem(key("NEXT_TASKS"),JSON.stringify(next));

  const p=calculateProgress();
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));

  const carry=tasks.filter(t=>!t.done);
  localStorage.setItem(key("TASKS"),JSON.stringify(carry));
  localStorage.setItem(key("EXTRA"),JSON.stringify([]));

  reportBox.innerHTML=`
    <h3>Daily Report</h3>
    <div class="percent">${p.percent}%</div>
    <div class="rating">${getLabel(p.percent)}</div>
    <div class="details">
      Assigned: ${p.assigned} |
      Done: ${p.doneAssigned} |
      Extra: ${p.doneExtra} |
      Carry Forward: ${carry.length}
    </div>
  `;
  reportBox.classList.remove("hidden");

  localStorage.removeItem(key("LOGS"));

  taskBox.classList.add("hidden");
  logBox.classList.add("hidden");
  nextDayBox.classList.add("hidden");

  loginBtn.disabled=false;
  bioBtn.disabled=true;
  dayBtn.disabled=true;
}

/* LOG TABLE */
function renderLogs(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logTable.innerHTML="";
  logs.forEach(l=>{
    logTable.innerHTML+=
      `<tr><td>${l.login}</td><td>${l.logout}</td><td>${l.reason}</td></tr>`;
  });
}
</script>
</body>
</html>
