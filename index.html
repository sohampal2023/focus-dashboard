<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  font-size:18px;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}

/* MAIN */
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}

/* POPUP */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:16px;
  padding:30px;
  width:380px;
  text-align:center;
}
.popup button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}
.study{background:#22c55e}
.distract{background:#ef4444}
</style>
</head>

<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>
  <div class="nav">
    <button id="loginBtn">Login</button>
    <button id="bioBtn">Bio Break</button>
    <button id="dayEndBtn">Day End</button>
    <button id="historyBtn">History</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <p>No tasks yet</p>
  </div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>
</div>

</div>

<!-- FOCUS POPUP -->
<div id="focusOverlay" class="overlay hidden">
  <div class="popup">
    <h3>Focus Check</h3>
    <p>Are you studying or distracted?</p>
    <button class="study" id="studyBtn">Studying</button>
    <button class="distract" id="distractBtn">Distracted</button>
    <p style="font-size:12px">No response in 1 minute → idle mark</p>
  </div>
</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ================= DOM ================= */
const status = document.getElementById("status");
const tasksBox = document.getElementById("tasksBox");
const overlay = document.getElementById("focusOverlay");

/* ================= STATE ================= */
let score = 100;
let idleMarks = 0;
let popupTimer = null;

/* ================= HELPERS ================= */
function stamp(){
  return new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

/* ================= CORE LOGIC ================= */
async function login(){
  const email = prompt("Enter email");
  const pass = prompt("Enter password");
  if(!email || !pass) return;

  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    alert(e.message);
  }
}

async function bioBreak(){
  await signOut(auth);
}

function showFocusPopup(){
  overlay.classList.remove("hidden");
  popupTimer = setTimeout(()=>{
    idleMarks++;
    overlay.classList.add("hidden");
  },60000);
}

function focusResponse(isStudying){
  clearTimeout(popupTimer);
  overlay.classList.add("hidden");

  if(!isStudying){
    score = Math.max(score - 2, 0);
  }
}

/* ================= AUTH STATE ================= */
onAuthStateChanged(auth,(user)=>{
  if(user){
    status.innerText = "Status: Logged in @ " + stamp();
    tasksBox.classList.remove("hidden");
    showFocusPopup();
  }else{
    status.innerText = "Status: Logged out";
    tasksBox.classList.add("hidden");
  }
});

/* ================= GLOBAL EVENT DELEGATION ================= */
/* THIS IS THE FIX — buttons will NEVER break again */

document.addEventListener("click",(e)=>{

  if(e.target.id === "loginBtn"){
    login();
  }

  if(e.target.id === "bioBtn"){
    bioBreak();
  }

  if(e.target.id === "studyBtn"){
    focusResponse(true);
  }

  if(e.target.id === "distractBtn"){
    focusResponse(false);
  }

  if(e.target.id === "historyBtn"){
    alert("History view coming next");
  }

  if(e.target.id === "dayEndBtn"){
    alert("Day End logic next step");
  }

});
</script>

</body>
</html>
