<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:20px;
  border-radius:14px;
  border:2px solid #334155;
  text-align:center;
  font-weight:700;
  background:#020617;
}
.nav button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}

/* MAIN */
.main{
  padding:25px;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}

/* POPUP */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.popup{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:16px;
  padding:25px;
  width:320px;
  text-align:center;
}
.popup button{
  margin:10px;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}
.study{background:#22c55e}
.distract{background:#ef4444}
</style>
</head>

<body>

<div class="app">
  <div class="sidebar">
    <h2>FOCUS SYSTEM</h2>
    <div id="status" class="status">Status: Logged out</div>
    <div class="nav">
      <button id="loginBtn">Login</button>
      <button id="bioBtn">Bio Break</button>
      <button id="dayEndBtn">Day End</button>
    </div>
  </div>

  <div class="main">
    <div id="tasksBox" class="card hidden">
      <h3>Work Area</h3>
      <p>Working session active.</p>
    </div>

    <div id="reportBox" class="card hidden"></div>
  </div>
</div>

<!-- POPUP -->
<div id="focusOverlay" class="overlay hidden">
  <div class="popup">
    <h3>Focus Check</h3>
    <p>Are you studying or distracted?</p>
    <button id="studyBtn" class="study">Studying</button>
    <button id="distractBtn" class="distract">Distracted</button>
    <p style="font-size:12px">No response in 1 minute = idle mark</p>
  </div>
</div>

<!-- NORMAL SCRIPT (NO MODULE) -->
<script>
/* ===== STATE ===== */
let loggedIn=false;
let idleMarks=0;
let score=100;
let popupTimer=null;

/* ===== DOM ===== */
const status=document.getElementById("status");
const tasksBox=document.getElementById("tasksBox");
const reportBox=document.getElementById("reportBox");
const overlay=document.getElementById("focusOverlay");

/* ===== HELPERS ===== */
function timeNow(){
  return new Date().toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
}

/* ===== CORE FUNCTIONS ===== */
function login(){
  loggedIn=true;
  status.innerText="Status: Logged in @ "+timeNow();
  tasksBox.classList.remove("hidden");
  startFocusPopup();
}

function bioBreak(){
  loggedIn=false;
  status.innerText="Status: Bio Break @ "+timeNow();
  tasksBox.classList.add("hidden");
  stopPopup();
}

function dayEnd(){
  loggedIn=false;
  tasksBox.classList.add("hidden");
  reportBox.classList.remove("hidden");
  reportBox.innerHTML=
    "<h3>Day End</h3>"+
    "Final Score: "+score+"%<br>"+
    "Idle Marks: "+idleMarks;
  status.innerText="Status: Day End – Thank you";
  stopPopup();
}

/* ===== POPUP LOGIC ===== */
function startFocusPopup(){
  stopPopup();
  overlay.classList.remove("hidden");

  popupTimer=setTimeout(()=>{
    idleMarks++;
    score=Math.max(score-2,0);
    overlay.classList.add("hidden");
  },60000);
}

function stopPopup(){
  clearTimeout(popupTimer);
  overlay.classList.add("hidden");
}

function studying(){
  stopPopup();
}

function distracted(){
  score=Math.max(score-2,0);
  stopPopup();
}

/* ===== BUTTON BINDING (STABLE) ===== */
document.getElementById("loginBtn").onclick=login;
document.getElementById("bioBtn").onclick=bioBreak;
document.getElementById("dayEndBtn").onclick=dayEnd;
document.getElementById("studyBtn").onclick=studying;
document.getElementById("distractBtn").onclick=distracted;
</script>

</body>
</html>
