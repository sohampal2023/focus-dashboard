<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus System</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif
}
body{
  background:#020617;
  color:#e5e7eb
}

.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh
}

/* SIDEBAR */
.sidebar{
  padding:20px;
  border-right:1px solid #1e293b
}
.sidebar h2{
  text-align:center;
  color:#7dd3fc;
  margin-bottom:12px
}
.status{
  padding:10px;
  border:1px solid #334155;
  border-radius:10px;
  text-align:center;
  margin-bottom:10px
}
button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer
}
button:disabled{opacity:.4}

/* IDLE BOX */
.idleBox{
  padding:12px;
  border:1px solid #38bdf8;
  border-radius:12px;
  text-align:center;
  margin-bottom:12px;
  background:#020617
}

/* MAIN */
.main{
  padding:24px;
  overflow:auto
}
.card{
  background:#020617;
  border:1px solid #334155;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px
}
.hidden{display:none}

/* INPUT */
.nextInput{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}
th,td{
  border:1px solid #334155;
  padding:6px;
  text-align:center
}
</style>
</head>

<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="statusBox" class="status">Logged out</div>

  <div id="idleBox" class="idleBox hidden">
    Idle Time Left:
    <b><span id="idleTime">30:00</span></b><br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
  <button id="dayBtn" onclick="openDayEnd()" disabled>Day End</button>
</div>

<!-- MAIN -->
<div class="main">

<div id="taskBox" class="card hidden">
  <h3>Assigned Tasks</h3>
  <div id="taskList"></div>

  <hr>

  <h4>Extra Work</h4>
  <div id="extraList"></div>
  <button onclick="addExtra()">+ Add Extra Work</button>
</div>

<div id="logBox" class="card hidden">
  <h3>Login / Logout Log</h3>
  <table>
    <thead>
      <tr>
        <th>Login</th>
        <th>Logout</th>
        <th>Reason</th>
      </tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<div id="nextDayBox" class="card hidden">
  <h3>Enter Next Day Tasks</h3>
  <div id="nextInputs"></div>
  <button onclick="finalDayEnd()">Submit & Close Day</button>
</div>

<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
/* ================= CORE STATE ================= */
let UID = null;
const key = k => UID + "_" + k;
const now = () => new Date().toLocaleString();

/* ================= AUDIO (UNLOCKED) ================= */
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}
function playBeep(){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = 880;
  gain.gain.value = 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),300);
}

/* ================= IDLE (TAB SAFE) ================= */
const IDLE_LIMIT = 30 * 60 * 1000;
const WARNING_AT = 60 * 1000;

let idleTimer = null;
let lastActive = null;
let warningPlayed = false;

function startIdle(){
  clearInterval(idleTimer);
  lastActive = Date.now();
  warningPlayed = false;
  idleBox.classList.remove("hidden");

  idleTimer = setInterval(checkIdle, 1000);
}

function checkIdle(){
  const remaining = IDLE_LIMIT - (Date.now() - lastActive);

  if(remaining <= 0){
    autoIdleLogout();
    return;
  }

  const m = Math.floor(remaining / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  idleTime.innerText = `${m}:${String(s).padStart(2,"0")}`;

  if(remaining <= WARNING_AT && !warningPlayed){
    playBeep();
    warningPlayed = true;
  }
}

function resetIdle(){
  unlockAudio();
  lastActive = Date.now();
  warningPlayed = false;
}

function autoIdleLogout(){
  clearInterval(idleTimer);
  const logs = JSON.parse(localStorage.getItem(key("LOGS"))||[]);
  logs[logs.length-1].logout = now();
  logs[logs.length-1].reason = "Idle timeout";
  localStorage.setItem(key("LOGS"), JSON.stringify(logs));
  location.reload();
}

/* ================= LOGIN ================= */
function login(){
  unlockAudio();
  UID = prompt("Email");
  if(!UID) return;

  if(localStorage.getItem(key("ASK_REASON")) === "BIO"){
    const logs = JSON.parse(localStorage.getItem(key("LOGS")));
    logs[logs.length-1].reason =
      prompt("Reason for bio break?") || "Not specified";
    localStorage.setItem(key("LOGS"), JSON.stringify(logs));
    localStorage.removeItem(key("ASK_REASON"));
  }

  const logs = JSON.parse(localStorage.getItem(key("LOGS"))||[]);
  logs.push({login:now(), logout:"-", reason:"-"});
  localStorage.setItem(key("LOGS"), JSON.stringify(logs));

  statusBox.innerText = "Logged in";
  loginBtn.disabled = true;
  bioBtn.disabled = false;
  dayBtn.disabled = false;

  mergeTasksForToday();
  loadTasks();
  renderLogs();
  startIdle();
}

/* ================= BIO BREAK ================= */
function bioBreak(){
  clearInterval(idleTimer);
  const logs = JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout = now();
  localStorage.setItem(key("LOGS"), JSON.stringify(logs));
  localStorage.setItem(key("ASK_REASON"), "BIO");
  location.reload();
}

/* ================= TASK MERGE ================= */
function mergeTasksForToday(){
  const carried = JSON.parse(localStorage.getItem(key("TASKS"))||"[]");
  const next = JSON.parse(localStorage.getItem(key("NEXT_TASKS"))||"[]");

  const merged = [
    ...carried,
    ...next.map(n=>({name:n, done:false}))
  ];

  if(!merged.length){
    merged.push(
      {name:"Study core subject", done:false},
      {name:"Revise notes", done:false},
      {name:"Practice questions", done:false}
    );
  }

  localStorage.setItem(key("TASKS"), JSON.stringify(merged));
  localStorage.removeItem(key("NEXT_TASKS"));
  localStorage.setItem(key("EXTRA"), JSON.stringify([]));

  taskBox.classList.remove("hidden");
  logBox.classList.remove("hidden");
  reportBox.classList.add("hidden");
}

/* ================= TASK UI ================= */
function loadTasks(){
  taskList.innerHTML = "";
  extraList.innerHTML = "";

  const tasks = JSON.parse(localStorage.getItem(key("TASKS")));
  const extras = JSON.parse(localStorage.getItem(key("EXTRA")));

  tasks.forEach(t=>{
    const cb = document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      if(!confirm("Confirm task completion?")){
        cb.checked=!cb.checked; return;
      }
      t.done=cb.checked;
      localStorage.setItem(key("TASKS"), JSON.stringify(tasks));
    };
    taskList.append(cb," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=e.done;
    cb.onchange=()=>{
      if(!confirm("Confirm extra work?")){
        cb.checked=!cb.checked; return;
      }
      e.done=cb.checked;
      localStorage.setItem(key("EXTRA"), JSON.stringify(extras));
    };
    extraList.append(cb," "+e.name,document.createElement("br"));
  });
}

function addExtra(){
  const name = prompt("Extra work?");
  if(!name) return;
  const extras = JSON.parse(localStorage.getItem(key("EXTRA")));
  extras.push({name, done:false});
  localStorage.setItem(key("EXTRA"), JSON.stringify(extras));
  loadTasks();
}

/* ================= DAY END ================= */
function openDayEnd(){
  clearInterval(idleTimer);
  nextInputs.innerHTML="";
  for(let i=0;i<5;i++){
    nextInputs.innerHTML+=
      `<input class="nextInput" id="nd${i}" placeholder="Next Day Task ${i+1}">`;
  }
  nextDayBox.classList.remove("hidden");
}

function finalDayEnd(){
  const next=[];
  for(let i=0;i<5;i++){
    const v=document.getElementById("nd"+i).value.trim();
    if(v) next.push(v);
  }
  localStorage.setItem(key("NEXT_TASKS"), JSON.stringify(next));

  const tasks = JSON.parse(localStorage.getItem(key("TASKS")));
  const carry = tasks.filter(t=>!t.done);
  localStorage.setItem(key("TASKS"), JSON.stringify(carry));
  localStorage.setItem(key("EXTRA"), JSON.stringify([]));

  reportBox.innerHTML = `
    <h3>Day End Report</h3>
    <div>Total Assigned: ${tasks.length}</div>
    <div>Carried Forward: ${carry.length}</div>
    <div>Next Day Tasks Added: ${next.length}</div>
  `;
  reportBox.classList.remove("hidden");

  taskBox.classList.add("hidden");
  logBox.classList.add("hidden");
  nextDayBox.classList.add("hidden");

  statusBox.innerText="Day End – Thank you";
  loginBtn.disabled=false;
  bioBtn.disabled=true;
  dayBtn.disabled=true;
}

/* ================= LOG TABLE ================= */
function renderLogs(){
  const logs = JSON.parse(localStorage.getItem(key("LOGS"))||[]);
  logTable.innerHTML="";
  logs.forEach(l=>{
    logTable.innerHTML+=
      `<tr><td>${l.login}</td><td>${l.logout}</td><td>${l.reason}</td></tr>`;
  });
}
</script>
</body>
</html>
