<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:#020617;
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  background:#020617;
  border-right:1px solid #1e293b;
  padding:20px;
  z-index:10;
}
.sidebar h2{
  margin:0 0 20px;
  color:#38bdf8;
  text-align:center;
}
.status{
  padding:15px;
  border:1px solid #334155;
  border-radius:12px;
  text-align:center;
  margin-bottom:20px;
}
.sidebar button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  background:#020617;
  color:#e5e7eb;
  border:1px solid #1e293b;
  border-radius:10px;
  cursor:pointer;
}

/* MAIN */
.main{
  position:relative;
  padding:30px;
}
.hidden{display:none}

/* POPUP (ONLY MAIN AREA) */
.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}
.popup{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:16px;
  padding:28px;
  width:340px;
  text-align:center;
}
.popup button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
.study{background:#22c55e;color:#022c22}
.distract{background:#ef4444;color:#450a0a}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>FOCUS</h2>
    <div id="status" class="status">Logged out</div>
    <button id="loginBtn">Login</button>
    <button id="bioBtn">Bio Break</button>
    <button id="dayEndBtn">Day End</button>
    <button id="historyBtn">History</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <h1>Dashboard</h1>
    <p id="score">Score: 100%</p>

    <div id="tasks" class="hidden">
      <h3>Tasks</h3>
      <p>No tasks yet</p>
    </div>

    <!-- POPUP -->
    <div id="overlay" class="overlay hidden">
      <div class="popup">
        <h3>Focus Check</h3>
        <p>Are you studying?</p>
        <button id="studyBtn" class="study">Studying</button>
        <button id="distractBtn" class="distract">Distracted</button>
      </div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* DOM */
const status = document.getElementById("status");
const overlay = document.getElementById("overlay");
const tasks = document.getElementById("tasks");
const scoreText = document.getElementById("score");

/* STATE */
let score = 100;

/* BUTTONS */
loginBtn.onclick = async () => {
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    alert(e.message);
  }
};

bioBtn.onclick = async () => {
  await signOut(auth);
};

studyBtn.onclick = () => {
  overlay.classList.add("hidden");
};

distractBtn.onclick = () => {
  score -= 2;
  scoreText.innerText = "Score: " + score + "%";
  overlay.classList.add("hidden");
};

historyBtn.onclick = () => alert("History later");
dayEndBtn.onclick = () => alert("Day end later");

/* AUTH */
onAuthStateChanged(auth,(user)=>{
  if(user){
    status.innerText = "Logged in";
    tasks.classList.remove("hidden");
    overlay.classList.remove("hidden");   // ASK ONLY AFTER LOGIN
  }else{
    status.innerText = "Logged out";
    tasks.classList.add("hidden");
    overlay.classList.add("hidden");      // NEVER SHOW WHEN LOGGED OUT
  }
});
</script>

</body>
</html>
