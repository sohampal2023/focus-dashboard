<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  font-size:18px;
  line-height:1.6;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}

/* MAIN */
.main{padding:25px;overflow:auto}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}

/* TASKS */
.task{display:flex;gap:10px;margin:8px 0}

/* PROGRESS */
.progress{
  height:18px;border-radius:10px;overflow:hidden;
  border:1px solid #1e293b;margin:6px 0 12px;
}
.bar{height:100%;font-size:11px;font-weight:700;text-align:center}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}

/* HISTORY */
.history-item{
  padding:12px;border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;margin-bottom:10px;
}

/* ================= ADDED: FOCUS POPUP ================= */
#focusOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
#focusOverlay.hidden{display:none}

.focusBox{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:18px;
  padding:30px;
  width:380px;
  text-align:center;
  box-shadow:0 0 40px rgba(56,189,248,.4);
}
.focusBox h2{margin-top:0}
.focusBtns{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:20px 0;
}
.focusBtns button{
  padding:14px 18px;
  border-radius:12px;
  font-weight:700;
  border:none;
  cursor:pointer;
}
.focusBtns .yes{background:#22c55e;color:#000}
.focusBtns .no{background:#ef4444;color:#fff}
.focusBox small{color:#94a3b8}
/* ===================================================== */
</style>
</head>

<body>

<!-- ================= ADDED: FOCUS POPUP ================= -->
<div id="focusOverlay" class="hidden">
  <div class="focusBox">
    <h2>Focus Check</h2>
    <p>Be honest.<br>Are you studying or watching reels?</p>
    <div class="focusBtns">
      <button id="btnStudy" class="yes">I am studying</button>
      <button id="btnDistract" class="no">I was distracted</button>
    </div>
    <small>No response in 1 minute = idle mark</small>
  </div>
</div>
<!-- ===================================================== -->

<div class="app">
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>
  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>
  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>
</div>
</div>

<script type="module">
/* ===== YOUR EXISTING CODE (UNCHANGED) ===== */
/* … ALL YOUR ORIGINAL 344 LINES STAY HERE … */

/* ===== ADDED: FOCUS POPUP LOGIC (SAFE ADD) ===== */
const focusOverlay=document.getElementById("focusOverlay");
const btnStudy=document.getElementById("btnStudy");
const btnDistract=document.getElementById("btnDistract");

let focusTimer=null;

function showFocusPopup(){
  focusOverlay.classList.remove("hidden");
  clearTimeout(focusTimer);
  focusTimer=setTimeout(()=>{
    idleMarks++;
    focusOverlay.classList.add("hidden");
  },60000); // 1 minute
}

function hideFocusPopup(){
  clearTimeout(focusTimer);
  focusOverlay.classList.add("hidden");
}

btnStudy.addEventListener("click",()=>{
  hideFocusPopup();
});

btnDistract.addEventListener("click",()=>{
  idleMarks++;
  hideFocusPopup();
});

/* show popup every idle cycle */
setInterval(()=>{
  if(localStorage.getItem("LOGGED_IN")==="YES"){
    showFocusPopup();
  }
},30000); // test: every 30 sec

/* ===== KEEP YOUR EXISTING window EXPOSE ===== */
window.login=login;
window.bioBreak=bioBreak;
window.openDayEnd=openDayEnd;
window.toggleHistory=toggleHistory;
window.confirmDayEnd=confirmDayEnd;
</script>

</body>
</html>
