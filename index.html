<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body onload="initPage()">
<div class="container">
  <h1>Focus Dashboard</h1>

  <p id="statusText">Status: Logged out</p>
  <p id="loginTime"></p>
  <p id="logoutTime"></p>

  <button onclick="login()">Login</button>
  <button onclick="logoutWithReason()">Logout</button>

  <hr>

  <h3>Assigned Tasks for Today</h3>
  <div id="taskList"></div>

  <hr>

  <h3>Day End</h3>
  <button onclick="startDayEnd()">Day End</button>

  <div id="dayEndBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

/* ---------- FIREBASE ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ---------- HELPERS ---------- */
function today() {
  return new Date().toISOString().slice(0,10);
}
function nowTime() {
  return new Date().toLocaleTimeString();
}

/* ---------- LOGIN ---------- */
window.login = function () {
  const email = prompt("Enter email");
  const password = prompt("Enter password");

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      localStorage.setItem("login-time", nowTime());
      document.getElementById("statusText").innerText =
        "Status: Logged in";
      showLoginTime();
      loadTasks();
    })
    .catch(err => alert(err.message));
};

window.logoutWithReason = function () {
  const reason = prompt("Logout reason");
  if (!reason) return alert("Reason required");

  localStorage.setItem("logout-time", nowTime());
  localStorage.setItem("logout-reason", reason);
  showLogoutTime();
  signOut(auth);
  document.getElementById("statusText").innerText =
    "Status: Logged out";
};

/* ---------- DAY END TASK CREATION ---------- */
window.startDayEnd = function () {
  const count = prompt("How many subjects tomorrow? (1–7)");
  const n = Number(count);

  if (!n || n < 1 || n > 7) {
    alert("Enter number between 1 and 7");
    return;
  }

  let html = "<h4>Enter Subject Names</h4>";
  for (let i = 0; i < n; i++) {
    html += `<input type="text" id="sub${i}" placeholder="Subject ${i+1}"><br><br>`;
  }
  html += `<button onclick="confirmDayEnd(${n})">Confirm Day End</button>`;

  document.getElementById("dayEndBox").innerHTML = html;
};

window.confirmDayEnd = function (n) {
  let tasks = [];
  for (let i = 0; i < n; i++) {
    const val = document.getElementById("sub"+i).value.trim();
    if (!val) {
      alert("All subject names required");
      return;
    }
    tasks.push({ name: val, done: false });
  }

  localStorage.setItem("tasks-" + tomorrow(), JSON.stringify(tasks));
  localStorage.setItem("logout-time", nowTime());
  showLogoutTime();
  alert("Day End successful");
  signOut(auth);
  location.reload();
};

function tomorrow() {
  const d = new Date();
  d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}

/* ---------- TASK HANDLING ---------- */
function loadTasks() {
  const data = localStorage.getItem("tasks-" + today());
  if (!data) return;

  const tasks = JSON.parse(data);
  const box = document.getElementById("taskList");
  box.innerHTML = "";

  tasks.forEach((t, i) => {
    const div = document.createElement("div");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.disabled = t.done;
    cb.checked = t.done;

    cb.onchange = () => {
      if (confirm("Confirm this task is done?")) {
        t.done = true;
        saveTasks(tasks);
        loadTasks();
      } else {
        cb.checked = false;
      }
    };

    div.appendChild(cb);
    div.append(" " + t.name);
    box.appendChild(div);
  });
}

function saveTasks(tasks) {
  localStorage.setItem("tasks-" + today(), JSON.stringify(tasks));
}

/* ---------- AUTO MOVE INCOMPLETE TASKS ---------- */
window.addEventListener("beforeunload", () => {
  const data = localStorage.getItem("tasks-" + today());
  if (!data) return;

  const tasks = JSON.parse(data);
  const pending = tasks.filter(t => !t.done);
  if (pending.length > 0) {
    localStorage.setItem("tasks-" + tomorrow(), JSON.stringify(pending));
  }
});

/* ---------- UI ---------- */
function showLoginTime() {
  const t = localStorage.getItem("login-time");
  if (t) document.getElementById("loginTime").innerText =
    "Login Time: " + t;
}
function showLogoutTime() {
  const t = localStorage.getItem("logout-time");
  if (t) document.getElementById("logoutTime").innerText =
    "Logout Time: " + t;
}
function initPage() {
  showLoginTime();
  showLogoutTime();
  loadTasks();
}
</script>
</body>
</html>
