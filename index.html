<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.nav button:hover{border-color:#38bdf8}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{
  display:flex;
  gap:10px;
  margin:8px 0;
}
.progress{
  height:18px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1e293b;
}
.bar{
  height:100%;
  font-size:11px;
  font-weight:700;
  text-align:center;
}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
.history-item{
  padding:12px;
  border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<div class="main">

  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* CONSTANTS */
const DAY_STATUS="DAY_STATUS";
const CURRENT_TASKS="CURRENT_TASKS";
const REPORTS="REPORTS";

/* STATE */
let CURRENT_UID=null;

/* HELPERS */
function ukey(k){return CURRENT_UID+"_"+k}
function stamp(){
  return new Date().toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
  });
}

/* INIT */
function ensureUserState(){
  if(!localStorage.getItem(ukey(CURRENT_TASKS)))
    localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify([]));
  if(!localStorage.getItem(ukey(REPORTS)))
    localStorage.setItem(ukey(REPORTS),JSON.stringify([]));
  if(!localStorage.getItem(ukey(DAY_STATUS)))
    localStorage.setItem(ukey(DAY_STATUS),"ACTIVE");
}

/* SEED */
function seedInitialTasksIfEmpty(){
  const cur=JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))||"[]");
  if(cur.length===0){
    localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify([
      {name:"Study core subject",done:false},
      {name:"Revise notes",done:false},
      {name:"Practice questions",done:false}
    ]));
  }
}

/* REALTIME SYNC */
async function syncTasks(){
  const ref=doc(db,"users",CURRENT_UID);
  await updateDoc(ref,{
    liveTasks:JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))),
    lastUpdated:new Date(),
    expiresAt:new Date(Date.now()+7*86400000)
  });
}

/* LOGIN */
window.login=async function(){
  const email=prompt("Email");
  const pass=prompt("Password");
  if(!email||!pass)return;

  const cred=await signInWithEmailAndPassword(auth,email,pass);
  CURRENT_UID=cred.user.uid;

  const ref=doc(db,"users",CURRENT_UID);
  const snap=await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{email});
  }

  ensureUserState();
  seedInitialTasksIfEmpty();

  status.innerText="Status: Logged in @ "+stamp();
  tasksBox.classList.remove("hidden");
  loadTasks();
};

/* TASKS */
function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))||"[]");
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=async()=>{
      t.done=cb.checked;
      localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify(data));
      await syncTasks();
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

/* DAY END */
window.openDayEnd=function(){
  let h="<h3>Confirm Day End</h3>";
  for(let i=0;i<7;i++)
    h+=`<input placeholder="Next Day Task ${i+1}"><br>`;
  h+=`<br><button onclick="confirmDayEnd()">Confirm</button>`;
  dayEndBox.innerHTML=h;
  dayEndBox.classList.remove("hidden");
};

window.confirmDayEnd=async function(){
  const report=generateReport();
  const ref=doc(db,"users",CURRENT_UID);
  const snap=await getDoc(ref);
  const reps=snap.data().reports||[];
  reps.push(report);
  await updateDoc(ref,{
    reports:reps,
    expiresAt:new Date(Date.now()+7*86400000)
  });
  await signOut(auth);
  location.reload();
};

/* REPORT */
function generateReport(){
  const tasks=JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))||"[]");
  const done=tasks.filter(t=>t.done).length;
  const score=tasks.length?Math.round(done/tasks.length*100):0;
  const grade=score>=80?"EXCELLENT":score>=60?"GOOD":score>=40?"AVERAGE":"POOR";
  reportBox.innerHTML=`
    <h3>Report Card</h3>
    ${score}%
    <div class="progress">
      <div class="bar ${grade}" style="width:${score}%">${score}%</div>
    </div>
    Grade: <b>${grade}</b>
  `;
  return{date:new Date().toLocaleDateString(),finalScore:score,grade};
}

/* HISTORY */
window.toggleHistory=function(){
  historyBox.classList.toggle("hidden");
  historyBox.innerHTML="<h3>History</h3>";
  const h=JSON.parse(localStorage.getItem(ukey(REPORTS))||"[]");
  h.forEach(x=>{
    historyBox.innerHTML+=`
      <div class="history-item">
        ${x.date} → ${x.finalScore}% (${x.grade})
      </div>`;
  });
};

/* BIO BREAK */
window.bioBreak=async function(){
  await signOut(auth);
  status.innerText="Status: Bio Break @ "+stamp();
  tasksBox.classList.add("hidden");
};
</script>
</body>
</html>
