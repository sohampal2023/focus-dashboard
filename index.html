<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:"Segoe UI",system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}

.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  background:#020617;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:22px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  margin:0;
  font-size:22px;
  color:#38bdf8;
}

.status{
  background:#020617;
  border:1px solid #334155;
  padding:20px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  font-size:16px;
  line-height:1.5;
}

/* NAV */
.nav button{
  width:100%;
  margin-bottom:12px;
  padding:14px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.nav button:hover{border-color:#38bdf8}

/* MAIN */
.main{
  padding:25px;
  overflow-y:auto;
}

.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}

/* TASKS */
.task{
  display:flex;
  gap:10px;
  margin:8px 0;
}

/* PROGRESS */
.progress{
  background:#020617;
  border:1px solid #1e293b;
  height:18px;
  border-radius:10px;
  overflow:hidden;
  margin:6px 0 12px;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  text-align:center;
  font-size:11px;
}

/* HISTORY */
.history-item{
  padding:12px;
  background:#020617;
  border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>

</div>
</div>

<script>
/* DOM */
const status = document.getElementById("status");
const tasksBox = document.getElementById("tasksBox");
const dayEndBox = document.getElementById("dayEndBox");
const reportBox = document.getElementById("reportBox");
const historyBox = document.getElementById("historyBox");
const taskList = document.getElementById("taskList");

/* TIME */
function timeStamp(){
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function now(){return new Date()}
function mins(a,b){return Math.round((b-a)/60000)}

/* STORAGE */
const DAY_STATUS="DAY_STATUS";
const CURRENT_TASKS="CURRENT_TASKS";
const NEXT_TASKS="NEXT_TASKS";
const SESSIONS="SESSIONS";
const REPORTS="REPORTS";

/* LOGIN */
function login(){
  const id=prompt("Enter ID");
  const pw=prompt("Enter Password");
  if(!id||!pw) return;

  if(localStorage.getItem(DAY_STATUS)==="CLOSED"){
    const next=localStorage.getItem(NEXT_TASKS);
    if(next){
      localStorage.setItem(CURRENT_TASKS,next);
      localStorage.removeItem(NEXT_TASKS);
    }
    localStorage.setItem(DAY_STATUS,"ACTIVE");
  }

  startSession();
  localStorage.setItem("LOGGED_IN","YES");

  status.innerText="Status: Logged in @ "+timeStamp();
  tasksBox.classList.remove("hidden");
  loadTasks();
}

/* BIO BREAK */
function bioBreak(){
  endSession();
  localStorage.removeItem("LOGGED_IN");

  if(localStorage.getItem(DAY_STATUS)==="CLOSED"){
    status.innerText="Status: Bio Break (Day Ended)";
  }else{
    status.innerText="Status: Bio Break";
  }
  status.innerText+=" @ "+timeStamp();
  tasksBox.classList.add("hidden");
}

/* SESSION */
function startSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  s.push({start:now().toISOString(),end:null});
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}
function endSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  for(let i=s.length-1;i>=0;i--){
    if(!s[i].end){s[i].end=now().toISOString();break;}
  }
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}

/* TASKS */
function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  if(!data.length){
    taskList.innerText="No tasks assigned.";
    return;
  }
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task done?")){
        t.done=true;
        localStorage.setItem(CURRENT_TASKS,JSON.stringify(data));
      }else cb.checked=false;
    };
    const div=document.createElement("div");
    div.className="task";
    div.appendChild(cb);
    div.append(" "+t.name);
    taskList.appendChild(div);
  });
}

/* DAY END */
function openDayEnd(){
  if(localStorage.getItem("LOGGED_IN")!=="YES") return;
  if(localStorage.getItem(DAY_STATUS)==="CLOSED") return;

  let html="<h3>Confirm Day End</h3>";
  html+="<p>Next Day Subjects (max 7)</p>";
  for(let i=0;i<7;i++){
    html+=`<input id="s${i}" placeholder="Subject ${i+1}"><br>`;
  }
  html+=`
    <br>Distraction Time (minutes)<br>
    <input id="dist" type="number" min="0"><br><br>
    <button onclick="confirmDayEnd()">Confirm Day End</button>
  `;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
}

/* CONFIRM DAY END */
function confirmDayEnd(){
  let next=[];
  const cur=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  cur.filter(t=>!t.done).forEach(t=>next.push({name:t.name,done:false}));

  for(let i=0;i<7;i++){
    const v=document.getElementById("s"+i).value.trim();
    if(v) next.push({name:v,done:false});
  }

  localStorage.setItem(NEXT_TASKS,JSON.stringify(next));
  generateReport();
  localStorage.setItem(DAY_STATUS,"CLOSED");

  bioBreak();
  status.innerText+=" – Thank you";
  dayEndBox.classList.add("hidden");
  reportBox.classList.remove("hidden");
}

/* REPORT (TIME + TASK %) */
function generateReport(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  let total=0;
  s.forEach(x=>{if(x.start&&x.end)total+=mins(new Date(x.start),new Date(x.end))});

  const dist=Number(document.getElementById("dist").value||0);
  const prod=Math.max(total-dist,0);
  const pct=total?Math.round(prod/total*100):0;

  /* TASK COMPLETION */
  const tasks=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  let taskPct=0;
  if(tasks.length){
    const done=tasks.filter(t=>t.done).length;
    taskPct=Math.round(done/tasks.length*100);
  }

  let grade="POOR";
  if(pct>=80)grade="EXCELLENT";
  else if(pct>=60)grade="GOOD";
  else if(pct>=40)grade="AVERAGE";

  const r={date:new Date().toLocaleDateString(),pct,taskPct,grade};
  const all=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  all.push(r);
  localStorage.setItem(REPORTS,JSON.stringify(all));

  reportBox.innerHTML=`
    <h3>Report Card</h3>

    Time Productivity: ${pct}%
    <div class="progress"><div class="bar" style="width:${pct}%">${pct}%</div></div>

    Tasks Completed: ${taskPct}%
    <div class="progress"><div class="bar" style="width:${taskPct}%">${taskPct}%</div></div>

    Grade: <b>${grade}</b>
  `;
}

/* HISTORY */
function toggleHistory(){
  historyBox.classList.toggle("hidden");
  historyBox.innerHTML="<h3>History</h3>";
  const h=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  h.forEach(x=>{
    historyBox.innerHTML+=`
      <div class="history-item">
        ${x.date} → Time ${x.pct}% | Tasks ${x.taskPct}% (${x.grade})
      </div>`;
  });
}
</script>
</body>
</html>
