<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}

body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}

.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}

.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}

.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  background:#020617;
}

.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}

.nav button:hover{
  border-color:#38bdf8;
}

.main{
  padding:25px;
  overflow:auto;
}

.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.hidden{
  display:none;
}

.task{
  display:flex;
  gap:10px;
  margin:8px 0;
}

.progress{
  height:18px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1e293b;
}

.bar{
  height:100%;
  font-size:11px;
  font-weight:700;
  text-align:center;
}

.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}

.history-item{
  padding:12px;
  border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboardBox" class="card hidden">
    <h3>Daily Performance Dashboard</h3>

    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div style="flex:1">
        <div id="dashScore" style="font-size:48px;font-weight:900">0%</div>
        <div id="dashGrade"></div>

        <div class="progress" style="height:22px">
          <div id="dashBar" class="bar" style="width:0%">0%</div>
        </div>
      </div>

      <div style="flex:1">
        <div>Yesterday: <b id="yScore">—</b></div>
        <div>Today: <b id="tScore">—</b></div>
        <div id="deltaText" style="margin-top:10px;font-weight:700"></div>
      </div>
    </div>
  </div>

  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* STATE */
let CURRENT_UID = null;

/* HELPERS */
function ukey(k){
  return CURRENT_UID + "_" + k;
}

/* LOGIN (FIXED) */
window.login = async function(){
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;

  const cred = await signInWithEmailAndPassword(auth,email,pass);
  CURRENT_UID = cred.user.uid;

  const ref = doc(db,"users",CURRENT_UID);
  let snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{ email, blocked:false, reports:[] });
    snap = await getDoc(ref);
  }

  if(snap.data().blocked){
    alert("Blocked by admin");
    await signOut(auth);
    return;
  }

  initState();
  seedTasks();
  loadTasks();
  showDashboard();

  status.innerText = "Status: Logged in";
  tasksBox.classList.remove("hidden");
};

/* STATE INIT */
function initState(){
  if(!localStorage.getItem(ukey("CURRENT_TASKS"))){
    localStorage.setItem(ukey("CURRENT_TASKS"),"[]");
  }
  if(!localStorage.getItem(ukey("REPORTS"))){
    localStorage.setItem(ukey("REPORTS"),"[]");
  }
}

/* SEED TASKS */
function seedTasks(){
  const t = JSON.parse(localStorage.getItem(ukey("CURRENT_TASKS")));
  if(t.length === 0){
    localStorage.setItem(
      ukey("CURRENT_TASKS"),
      JSON.stringify([
        {name:"Study topic",done:false},
        {name:"Practice problems",done:false}
      ])
    );
  }
}

/* TASKS */
function loadTasks(){
  taskList.innerHTML="";
  const t = JSON.parse(localStorage.getItem(ukey("CURRENT_TASKS")));
  t.forEach(x=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=x.done;
    cb.onchange=()=>{
      x.done=cb.checked;
      localStorage.setItem(ukey("CURRENT_TASKS"),JSON.stringify(t));
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+x.name);
    taskList.appendChild(d);
  });
}

/* DAY END */
window.openDayEnd=function(){
  dayEndBox.innerHTML=`<h3>Confirm Day End</h3>
  <button onclick="confirmDayEnd()">Confirm</button>`;
  dayEndBox.classList.remove("hidden");
};

window.confirmDayEnd=async function(){
  const t = JSON.parse(localStorage.getItem(ukey("CURRENT_TASKS")));
  const done = t.filter(x=>x.done).length;
  const score = Math.round((done/t.length)*100)||0;

  const grade =
    score>=80?"EXCELLENT":
    score>=60?"GOOD":
    score>=40?"AVERAGE":"POOR";

  const rep={date:new Date().toLocaleDateString(),finalScore:score,grade};
  const reps=JSON.parse(localStorage.getItem(ukey("REPORTS")));
  reps.push(rep);
  localStorage.setItem(ukey("REPORTS"),JSON.stringify(reps));

  const ref=doc(db,"users",CURRENT_UID);
  const snap=await getDoc(ref);
  const r=snap.data().reports||[];
  r.push(rep);
  await updateDoc(ref,{reports:r});

  showDashboard();
  reportBox.innerHTML=`<h3>Report</h3>${score}% (${grade})`;
  reportBox.classList.remove("hidden");
  dayEndBox.classList.add("hidden");

  await signOut(auth);
};

/* DASHBOARD */
function showDashboard(){
  const r=JSON.parse(localStorage.getItem(ukey("REPORTS")));
  if(r.length===0)return;

  const t=r[r.length-1];
  const y=r.length>1?r[r.length-2]:null;

  dashScore.innerText=t.finalScore+"%";
  dashGrade.innerText=t.grade;
  dashBar.style.width=t.finalScore+"%";
  dashBar.innerText=t.finalScore+"%";
  dashBar.className="bar "+t.grade;

  tScore.innerText=t.finalScore+"%";
  yScore.innerText=y?y.finalScore+"%":"First day";

  if(y){
    const d=t.finalScore-y.finalScore;
    deltaText.innerText=d>0?"Improved +"+d+"%":d<0?"Dropped "+Math.abs(d)+"%":"Same";
  }else{
    deltaText.innerText="No comparison";
  }

  dashboardBox.classList.remove("hidden");
}

/* HISTORY */
window.toggleHistory=function(){
  historyBox.classList.toggle("hidden");
  historyBox.innerHTML="<h3>History</h3>";
  const r=JSON.parse(localStorage.getItem(ukey("REPORTS")));
  r.forEach(x=>{
    historyBox.innerHTML+=`<div class="history-item">${x.date} → ${x.finalScore}% (${x.grade})</div>`;
  });
};

/* LOGOUT */
window.bioBreak=async function(){
  await signOut(auth);
  status.innerText="Status: Bio Break";
};
</script>
</body>
</html>
