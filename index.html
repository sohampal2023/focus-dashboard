<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  font-size:18px;
  line-height:1.6;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{display:flex;gap:10px;margin:8px 0}
.progress{
  height:18px;border-radius:10px;overflow:hidden;
  border:1px solid #1e293b;margin:6px 0 12px;
}
.bar{height:100%;font-size:11px;font-weight:700;text-align:center}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
.history-item{
  padding:12px;border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;margin-bottom:10px;
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>
  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>
  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>
</div>
</div>

<script type="module">
/* ================= FIREBASE (ADD ONLY) ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain:"focus-dashboard-5965a.firebaseapp.com",
  projectId:"focus-dashboard-5965a"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window.db=db;

/* ================= ORIGINAL DOM ================= */
const status=document.getElementById("status");
const tasksBox=document.getElementById("tasksBox");
const taskList=document.getElementById("taskList");
const dayEndBox=document.getElementById("dayEndBox");
const reportBox=document.getElementById("reportBox");
const historyBox=document.getElementById("historyBox");

/* ================= ORIGINAL STORAGE ================= */
const DAY_STATUS="DAY_STATUS";
const CURRENT_TASKS="CURRENT_TASKS";
const NEXT_TASKS="NEXT_TASKS";
const SESSIONS="SESSIONS";
const REPORTS="REPORTS";

/* ================= TIME ================= */
const now=()=>new Date();
const stamp=()=>new Date().toLocaleTimeString([],{
  hour:"2-digit",minute:"2-digit"
});
const mins=(a,b)=>Math.round((b-a)/60000);

/* ================= IDLE STATE (ADD ONLY) ================= */
let idleMarks=0;
async function saveIdleMarks(){
  try{
    await setDoc(doc(db,"user_state","default"),{
      idleMarks,lastActive:new Date()
    });
  }catch(e){}
}
async function loadIdleMarks(){
  try{
    const s=await getDoc(doc(db,"user_state","default"));
    if(s.exists()) idleMarks=s.data().idleMarks||0;
  }catch(e){}
}

/* ================= LOGIN (LOGIC UNTOUCHED) ================= */
async function login(){
  if(!prompt("Enter ID")||!prompt("Enter Password"))return;
  await loadIdleMarks();
  lastActivity=Date.now();

  if(localStorage.getItem(DAY_STATUS)==="CLOSED"){
    const n=localStorage.getItem(NEXT_TASKS);
    if(n){localStorage.setItem(CURRENT_TASKS,n);localStorage.removeItem(NEXT_TASKS);}
    localStorage.setItem(DAY_STATUS,"ACTIVE");
  }
  startSession();
  localStorage.setItem("LOGGED_IN","YES");
  status.innerText="Status: Logged in @ "+stamp();
  tasksBox.classList.remove("hidden");
  loadTasks();
}

/* ================= BIO BREAK ================= */
function bioBreak(){
  endSession();
  localStorage.removeItem("LOGGED_IN");
  status.innerText="Status: Bio Break @ "+stamp();
  tasksBox.classList.add("hidden");
}

/* ================= SESSION ================= */
function startSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  s.push({start:now().toISOString(),end:null});
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}
function endSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  for(let i=s.length-1;i>=0;i--){if(!s[i].end){s[i].end=now().toISOString();break;}}
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}

/* ================= TASKS ================= */
function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  if(!data.length){taskList.innerText="No tasks assigned.";return;}
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";cb.checked=t.done;cb.disabled=t.done;
    cb.onchange=()=>{if(confirm("Confirm task done?")){t.done=true;localStorage.setItem(CURRENT_TASKS,JSON.stringify(data));}else cb.checked=false;};
    const d=document.createElement("div");
    d.className="task";d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

/* ================= DAY END ================= */
function openDayEnd(){
  if(localStorage.getItem("LOGGED_IN")!=="YES")return;
  let h="<h3>Confirm Day End</h3>";
  for(let i=0;i<7;i++)h+=`<input id="s${i}" placeholder="Subject ${i+1}"><br>`;
  h+=`<br>Distraction (min)<br><input id="dist" type="number"><br><br>
      <button onclick="confirmDayEnd()">Confirm</button>`;
  dayEndBox.innerHTML=h;
  dayEndBox.classList.remove("hidden");
}

/* ================= CONFIRM ================= */
function confirmDayEnd(){
  idleMarks=0;saveIdleMarks();
  let next=[];
  const cur=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  cur.filter(t=>!t.done).forEach(t=>next.push({name:t.name,done:false}));
  for(let i=0;i<7;i++){const v=document.getElementById("s"+i).value.trim();if(v)next.push({name:v,done:false});}
  localStorage.setItem(NEXT_TASKS,JSON.stringify(next));
  generateReport();
  localStorage.setItem(DAY_STATUS,"CLOSED");
  bioBreak();
  status.innerText+=" – Thank you";
  dayEndBox.classList.add("hidden");
  reportBox.classList.remove("hidden");
}

/* ================= REPORT (UNCHANGED) ================= */
function generateReport(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  let total=0;
  s.forEach(x=>x.start&&x.end&&(total+=mins(new Date(x.start),new Date(x.end))));
  const dist=+document.getElementById("dist").value||0;
  const pct=total?Math.round(Math.max(total-dist,0)/total*100):0;
  const t=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  const taskPct=t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0;
  const finalScore=Math.round((pct+taskPct)/2);
  const grade=finalScore>=80?"EXCELLENT":finalScore>=60?"GOOD":finalScore>=40?"AVERAGE":"POOR";
  const r={date:new Date().toLocaleDateString(),finalScore,grade};
  const all=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  all.push(r);localStorage.setItem(REPORTS,JSON.stringify(all));
  reportBox.innerHTML=`<h3>Report Card</h3>
    Final Score: ${finalScore}%
    <div class="progress"><div class="bar ${grade}" style="width:${finalScore}%">${finalScore}%</div></div>
    Grade: <b>${grade}</b>`;
}

/* ================= HISTORY ================= */
function toggleHistory(){
  historyBox.classList.toggle("hidden");
  historyBox.innerHTML="<h3>History</h3>";
  JSON.parse(localStorage.getItem(REPORTS)||"[]")
    .forEach(x=>historyBox.innerHTML+=
      `<div class="history-item">${x.date} → ${x.finalScore}% (${x.grade})</div>`);
}

/* ================= IDLE SYSTEM (TEST 30s) ================= */
let lastActivity=Date.now(),idlePopupShown=false;
const IDLE_TIME=30*1000; // 30 seconds TEST
const MAX_MARKS=3;

["click","keydown","mousemove","touchstart"].forEach(e=>{
  document.addEventListener(e,()=>{lastActivity=Date.now();idlePopupShown=false;});
});

setInterval(async()=>{
  if(localStorage.getItem("LOGGED_IN")!=="YES")return;
  if(Date.now()-lastActivity>=IDLE_TIME && !idlePopupShown){
    idlePopupShown=true;
    idleMarks++;await saveIdleMarks();
    alert("IDLE ALERT\n\nIdle Mark: "+idleMarks+" / "+MAX_MARKS);
    if(idleMarks>=MAX_MARKS){alert("Max idle reached. Logging out.");idleMarks=0;await saveIdleMarks();bioBreak();}
  }
},5000);
</script>

</body>
</html>
