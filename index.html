<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
body{
  margin:0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(120deg,#e0f2fe,#fefce8);
}
.app{
  max-width:960px;
  margin:30px auto;
  background:white;
  border-radius:18px;
  box-shadow:0 25px 50px rgba(0,0,0,0.12);
  padding:25px;
}
h1{text-align:center;margin-bottom:5px;}
.status{text-align:center;font-weight:600;margin-bottom:15px;}

.top-bar{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
button{
  padding:8px 16px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.login{background:#2563eb;color:white;}
.break{background:#059669;color:white;}
.end{background:#dc2626;color:white;}
.history{background:#7c3aed;color:white;}

.section{
  margin-top:20px;
  padding:18px;
  border-radius:14px;
  background:#f8fafc;
}

.hidden{display:none;}

.task{
  margin:8px 0;
}

.progress{
  height:20px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  text-align:center;
  color:white;
  font-size:12px;
}

img{
  width:100%;
  border-radius:14px;
  margin-bottom:12px;
}

.report-card{
  background:#ecfeff;
  border-left:6px solid #06b6d4;
  padding:15px;
  border-radius:12px;
}

.history-item{
  background:#fff;
  border-left:5px solid #6366f1;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
}
</style>
</head>

<body>
<div class="app">

<h1>Focus Dashboard</h1>

<div id="quoteBox" class="hidden"></div>

<div id="status" class="status">Status: Logged out</div>

<div class="top-bar">
  <button class="login" onclick="login()">Login</button>
  <button class="break" onclick="bioBreak()">Bio Break</button>
  <button class="end" onclick="openDayEnd()">Day End</button>
  <button class="history" onclick="toggleHistory()">History</button>
</div>

<div id="tasksSection" class="section hidden">
  <h3>Assigned Tasks</h3>
  <div id="taskList"></div>
</div>

<div id="dayEndSection" class="section hidden"></div>

<div id="reportSection" class="section hidden"></div>

<div id="historySection" class="section hidden"></div>

</div>

<script>
/* ---------------- STORAGE ---------------- */
const DAY_STATUS = "DAY_STATUS"; // ACTIVE | CLOSED
const CURRENT_TASKS = "CURRENT_TASKS";
const NEXT_TASKS = "NEXT_TASKS";
const SESSIONS = "SESSIONS";
const REPORTS = "REPORTS";

/* ---------------- TIME ---------------- */
function now(){return new Date();}
function mins(a,b){return Math.round((b-a)/60000);}

/* ---------------- LOGIN ---------------- */
function login(){
  const id=prompt("Enter ID");
  const pw=prompt("Enter Password");
  if(!id||!pw) return;

  if(localStorage.getItem(DAY_STATUS)==="CLOSED"){
    const next=localStorage.getItem(NEXT_TASKS);
    if(next){
      localStorage.setItem(CURRENT_TASKS,next);
      localStorage.removeItem(NEXT_TASKS);
    }
    localStorage.setItem(DAY_STATUS,"ACTIVE");
  }

  startSession();
  localStorage.setItem("LOGGED_IN","YES");
  status.innerText="Status: Logged in";
  tasksSection.classList.remove("hidden");
  quoteBox.classList.remove("hidden");
  loadTasks();
}

/* ---------------- BIO BREAK ---------------- */
function bioBreak(){
  endSession();
  localStorage.removeItem("LOGGED_IN");
  status.innerText="Status: Bio Break";
  tasksSection.classList.add("hidden");
}

/* ---------------- SESSION ---------------- */
function startSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  s.push({start:now().toISOString(),end:null});
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}
function endSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  for(let i=s.length-1;i>=0;i--){
    if(!s[i].end){s[i].end=now().toISOString();break;}
  }
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}

/* ---------------- TASKS ---------------- */
function loadTasks(){
  const list=taskList;
  list.innerHTML="";
  const data=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  if(!data.length){
    list.innerText="No tasks assigned.";
    return;
  }
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Mark task as completed?")){
        t.done=true;
        localStorage.setItem(CURRENT_TASKS,JSON.stringify(data));
      }else cb.checked=false;
    };
    const div=document.createElement("div");
    div.className="task";
    div.appendChild(cb);
    div.append(" "+t.name);
    list.appendChild(div);
  });
}

/* ---------------- DAY END ---------------- */
function openDayEnd(){
  if(localStorage.getItem("LOGGED_IN")!=="YES") return;
  if(localStorage.getItem(DAY_STATUS)==="CLOSED") return;

  let html="<h3>Confirm Day End</h3>";
  html+="<p>Next Day Subjects (max 7)</p>";
  for(let i=0;i<7;i++){
    html+=`<input id="s${i}" placeholder="Subject ${i+1}"><br>`;
  }
  html+=`
    <br>Distraction Time (minutes):<br>
    <input id="dist" type="number" min="0"><br><br>
    <button class="end" onclick="confirmDayEnd()">Confirm Day End</button>
  `;
  dayEndSection.innerHTML=html;
  dayEndSection.classList.remove("hidden");
}

/* ---------------- CONFIRM DAY END ---------------- */
function confirmDayEnd(){
  let next=[];
  const cur=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  cur.filter(t=>!t.done).forEach(t=>next.push({name:t.name,done:false}));

  for(let i=0;i<7;i++){
    const v=document.getElementById("s"+i).value.trim();
    if(v) next.push({name:v,done:false});
  }

  localStorage.setItem(NEXT_TASKS,JSON.stringify(next));
  generateReport();

  localStorage.setItem(DAY_STATUS,"CLOSED");
  bioBreak();
  dayEndSection.classList.add("hidden");
  reportSection.classList.remove("hidden");
}

/* ---------------- REPORT ---------------- */
function generateReport(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  let total=0;
  s.forEach(x=>{
    if(x.start&&x.end) total+=mins(new Date(x.start),new Date(x.end));
  });

  const dist=Number(document.getElementById("dist").value||0);
  const prod=Math.max(total-dist,0);
  const pct=total?Math.round(prod/total*100):0;

  let grade="Poor";
  if(pct>=80) grade="Excellent";
  else if(pct>=60) grade="Good";
  else if(pct>=40) grade="Average";

  const r={date:new Date().toLocaleDateString(),pct,grade};
  const all=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  const prev=all.length?all[all.length-1]:null;
  all.push(r);
  localStorage.setItem(REPORTS,JSON.stringify(all));

  reportSection.innerHTML=`
    <div class="report-card">
      <h3>Report Card</h3>
      Productivity: ${pct}%
      <div class="progress"><div class="bar" style="width:${pct}%">${pct}%</div></div>
      Status: <b>${grade}</b><br>
      ${prev?`Compared to previous day: ${pct-prev.pct>=0?"+":""}${pct-prev.pct}%`:""}
    </div>
  `;
}

/* ---------------- HISTORY ---------------- */
function toggleHistory(){
  historySection.classList.toggle("hidden");
  historySection.innerHTML="<h3>History</h3>";
  const h=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  h.forEach(x=>{
    historySection.innerHTML+=`
      <div class="history-item">
        ${x.date} → ${x.pct}% (${x.grade})
      </div>`;
  });
}

/* ---------------- MOTIVATION IMAGES ---------------- */
let img=1;
setInterval(()=>{
  if(localStorage.getItem("LOGGED_IN")==="YES"){
    quoteBox.innerHTML=`<img src="${img}.png">`;
    img++; if(img>30) img=1;
  }
},60000);
</script>
</body>
</html>
