<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  font-family:Segoe UI,system-ui,sans-serif;
  background:#020617;
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  border-right:1px solid #1e293b;
}
.status{
  padding:14px;
  border:1px solid #334155;
  border-radius:12px;
  margin-bottom:10px;
  text-align:center;
}
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#020617;
  color:#e5e7eb;
  border:1px solid #334155;
  border-radius:10px;
  cursor:pointer;
}
button:disabled{opacity:.4}
.main{padding:20px}
.card{
  border:1px solid #334155;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
.task{display:flex;gap:10px;margin:8px 0}
.hidden{display:none}
input{
  width:100%;
  padding:8px;
  background:#020617;
  color:#e5e7eb;
  border:1px solid #334155;
  border-radius:8px;
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h3>FOCUS SYSTEM</h3>
  <div id="status" class="status">Logged out</div>
  <button onclick="login()">Login</button>
  <button id="dayEndBtn" onclick="openDayEnd()" disabled>Day End</button>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a"
};

initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* STATE */
let UID = null;
let currentTasks = [];

/* DOM */
const statusEl = document.getElementById("status");
const taskList = document.getElementById("taskList");
const tasksBox = document.getElementById("tasksBox");
const dayEndBox = document.getElementById("dayEndBox");
const reportBox = document.getElementById("reportBox");
const dayEndBtn = document.getElementById("dayEndBtn");

/* LOGIN */
window.login = async ()=>{
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;

  try{
    const cred = await signInWithEmailAndPassword(auth,email,pass);
    UID = cred.user.uid;

    const ref = doc(db,"users",UID);
    const snap = await getDoc(ref);

    if(!snap.exists()){
      await setDoc(ref,{
        email,
        currentTasks:[
          {name:"Study core subject",done:false},
          {name:"Revise notes",done:false}
        ],
        dayClosed:false,
        idleCount:0,
        sessionStart:Date.now()
      });
    }

    const data = (await getDoc(ref)).data();

    if(data.dayClosed){
      const carry = data.currentTasks.filter(t=>!t.done);
      await updateDoc(ref,{
        currentTasks:carry,
        dayClosed:false,
        sessionStart:Date.now()
      });
      currentTasks = carry;
    }else{
      currentTasks = data.currentTasks;
    }

    renderTasks();
    statusEl.innerText="Logged in";
    tasksBox.classList.remove("hidden");
    dayEndBtn.disabled=false;

  }catch(e){
    alert("Login failed:\n"+e.message);
  }
};

/* TASKS */
function renderTasks(){
  taskList.innerHTML="";
  currentTasks.forEach((t,i)=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=async()=>{
      if(!confirm("Confirm change?")){
        cb.checked=!cb.checked;
        return;
      }
      t.done = cb.checked;
      await updateDoc(doc(db,"users",UID),{ currentTasks });
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

/* DAY END */
window.openDayEnd = ()=>{
  let html="<h3>Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    html+=`<input class="nextTask" placeholder="Task ${i+1}">`;
  }
  html+=`<br><button onclick="confirmDayEnd()">Submit</button>`;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
};

window.confirmDayEnd = async ()=>{
  const done=currentTasks.filter(t=>t.done).length;
  const percent=Math.round(done/currentTasks.length*100);
  const grade=percent>=80?"EXCELLENT":percent>=60?"GOOD":percent>=40?"AVERAGE":"POOR";

  await addDoc(collection(db,"users",UID,"reports"),{
    tasks:currentTasks,
    taskPercent:percent,
    grade,
    createdAt:serverTimestamp()
  });

  await updateDoc(doc(db,"users",UID),{
    dayClosed:true
  });

  reportBox.innerHTML=`<h3>Report</h3>${percent}% - ${grade}`;
  reportBox.classList.remove("hidden");
  tasksBox.classList.add("hidden");
  dayEndBox.classList.add("hidden");

  await signOut(auth);
};
</script>
</body>
</html>
