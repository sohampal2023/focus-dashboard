<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; }
    .container {
      max-width: 760px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    .progress {
      width: 100%;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0;
    }
    .bar {
      height: 20px;
      background: #4caf50;
      color: white;
      text-align: center;
      font-size: 12px;
    }
    .report {
      background:#eef6ff;
      padding:15px;
      margin-top:20px;
      border-radius:6px;
    }
    .compare {
      background:#fff3cd;
      padding:12px;
      margin-top:10px;
      border-radius:6px;
    }
  </style>
</head>

<body onload="initPage()">
<div class="container">
  <h1>Focus Dashboard</h1>

  <p id="statusText">Status: Logged out</p>
  <p id="loginTime"></p>
  <p id="logoutTime"></p>

  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>

  <hr>

  <h3>Assigned Tasks</h3>
  <div id="taskList">No tasks assigned.</div>

  <hr>

  <h3>Productivity</h3>
  Productive (minutes):
  <input type="number" id="prod" min="0"><br><br>
  Total (minutes):
  <input type="number" id="total" min="1"><br><br>

  <hr>

  <h3>Day End</h3>
  <button onclick="startDayEnd()">Day End</button>
  <div id="dayEndBox"></div>

  <div id="reportBox"></div>
</div>

<script type="module">
/* ---------- FIREBASE AUTH ---------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } 
  from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* ---------- STATE KEYS ---------- */
const CURRENT = "CURRENT_TASKS";
const NEXT = "NEXT_TASKS";
const DAY_ENDED = "DAY_ENDED";
const LAST = "LAST_REPORT";
const PREV = "PREV_REPORT";

/* ---------- LOGIN / LOGOUT ---------- */
window.login = function () {
  const email = prompt("Enter email");
  const password = prompt("Enter password");
  if (!email || !password) return;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      document.getElementById("statusText").innerText = "Status: Logged in";
      localStorage.setItem("loginTime", new Date().toLocaleTimeString());
      activateNextDayIfNeeded();
      showTimes();
      loadTasks();
      showReport();
    })
    .catch(err => alert(err.message));
};

window.logout = function () {
  signOut(auth).finally(() => {
    localStorage.setItem("logoutTime", new Date().toLocaleTimeString());
    document.getElementById("statusText").innerText = "Status: Logged out";
    showTimes();
  });
};

/* ---------- DAY END ---------- */
window.startDayEnd = function () {
  const n = Number(prompt("How many subjects next day? (1–7)"));
  if (n < 1 || n > 7) return alert("Only 1–7 allowed");

  let html = "<h4>Next Day Subjects</h4>";
  for (let i = 0; i < n; i++) {
    html += `<input id="s${i}" placeholder="Subject ${i+1}"><br><br>`;
  }
  html += `<button onclick="confirmDayEnd(${n})">Confirm Day End</button>`;
  dayEndBox.innerHTML = html;
};

window.confirmDayEnd = function (n) {
  let nextTasks = [];

  const current = JSON.parse(localStorage.getItem(CURRENT) || "[]");
  current.filter(t => !t.done).forEach(t => nextTasks.push({ name:t.name, done:false }));

  for (let i = 0; i < n; i++) {
    const v = document.getElementById("s"+i).value.trim();
    if (!v) return alert("Fill all subjects");
    nextTasks.push({ name:v, done:false });
  }

  localStorage.setItem(NEXT, JSON.stringify(nextTasks));
  localStorage.removeItem(CURRENT);
  localStorage.setItem(DAY_ENDED, "true");

  generateReport();
  logout();
  location.reload();
};

/* ---------- TASK FLOW ---------- */
function activateNextDayIfNeeded() {
  if (localStorage.getItem(DAY_ENDED) === "true") {
    const next = localStorage.getItem(NEXT);
    if (next) {
      localStorage.setItem(CURRENT, next);
      localStorage.removeItem(NEXT);
    }
    localStorage.removeItem(DAY_ENDED);
  }
}

function loadTasks() {
  const box = document.getElementById("taskList");
  box.innerHTML = "";

  const data = localStorage.getItem(CURRENT);
  if (!data) {
    box.innerText = "No tasks assigned.";
    return;
  }

  const tasks = JSON.parse(data);
  tasks.forEach((t,i)=>{
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.disabled = t.done;

    cb.onchange = () => {
      if (confirm("Confirm task completed?")) {
        t.done = true;
        localStorage.setItem(CURRENT, JSON.stringify(tasks));
        loadTasks();
      } else cb.checked = false;
    };

    box.appendChild(cb);
    box.append(" " + t.name);
    box.appendChild(document.createElement("br"));
  });
}

/* ---------- REPORT & COMPARISON ---------- */
function generateReport() {
  const prod = Number(document.getElementById("prod").value || 0);
  const total = Number(document.getElementById("total").value || 1);

  const prodPct = Math.round((prod / total) * 100);

  const tasks = JSON.parse(localStorage.getItem(CURRENT) || "[]");
  const done = tasks.filter(t=>t.done).length;
  const taskPct = tasks.length ? Math.round((done / tasks.length) * 100) : 100;

  const status =
    prodPct >= 80 ? "EXCELLENT" :
    prodPct >= 50 ? "AVERAGE" : "POOR";

  const last = JSON.parse(localStorage.getItem(LAST));
  if (last) localStorage.setItem(PREV, JSON.stringify(last));

  localStorage.setItem(LAST, JSON.stringify({ prodPct, taskPct, status }));
}

function showReport() {
  const last = JSON.parse(localStorage.getItem(LAST));
  if (!last) return;

  let html = `
    <div class="report">
      <h3>Report Card</h3>
      Productivity: ${last.prodPct}%
      <div class="progress"><div class="bar" style="width:${last.prodPct}%">${last.prodPct}%</div></div>
      Task Completion: ${last.taskPct}%
      <div class="progress"><div class="bar" style="width:${last.taskPct}%">${last.taskPct}%</div></div>
      <b>Status: ${last.status}</b>
    </div>
  `;

  const prev = JSON.parse(localStorage.getItem(PREV));
  if (prev) {
    const dp = last.prodPct - prev.prodPct;
    const dt = last.taskPct - prev.taskPct;

    html += `
      <div class="compare">
        <h4>Comparison with Previous Day</h4>
        Productivity: ${dp >= 0 ? "+" : ""}${dp}%<br>
        Task Completion: ${dt >= 0 ? "+" : ""}${dt}%<br>
        <b>${dp >= 0 && dt >= 0 ? "Improved" : "Needs Improvement"}</b>
      </div>
    `;
  }

  reportBox.innerHTML = html;
}

/* ---------- UI ---------- */
function showTimes() {
  loginTime.innerText = "Login: " + (localStorage.getItem("loginTime") || "");
  logoutTime.innerText = "Logout: " + (localStorage.getItem("logoutTime") || "");
}

function initPage() {
  showTimes();
  loadTasks();
  showReport();
}
</script>
</body>
</html>
