<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus System</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:#020617;color:#e5e7eb}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{padding:20px;border-right:1px solid #1e293b}
.sidebar h2{text-align:center;color:#7dd3fc}
.status{padding:10px;border:1px solid #334155;border-radius:10px;text-align:center;margin-bottom:10px}
button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#020617;color:#e5e7eb;cursor:pointer}
button:disabled{opacity:.4}

/* MAIN */
.main{padding:24px;overflow:auto}
.card{background:#020617;border:1px solid #334155;border-radius:14px;padding:20px;margin-bottom:20px}
.hidden{display:none}

/* IDLE */
.idleBox{
  padding:12px;
  border:1px solid #7dd3fc;
  border-radius:12px;
  margin-bottom:12px;
  text-align:center;
}

/* SPEEDO */
.speedo{
  width:300px;height:150px;border-radius:300px 300px 0 0;
  background:conic-gradient(from -90deg,#7f1d1d,#92400e,#a16207,#14532d,#312e81);
  position:relative;
  box-shadow:inset 0 0 0 14px #020617,inset 0 0 0 18px #1e293b;
}
.needle{position:absolute;width:4px;height:110px;background:#e5e7eb;left:50%;bottom:0;transform-origin:bottom center;transform:rotate(-90deg);transition:.6s}
.cap{position:absolute;width:14px;height:14px;background:#e5e7eb;border-radius:50%;left:50%;bottom:0;transform:translate(-50%,50%)}

.percent{text-align:center;font-size:36px;font-weight:800;color:#7dd3fc}
.rating{text-align:center;font-size:18px;font-weight:700}
.details{text-align:center;font-size:14px;color:#cbd5f5}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #334155;padding:6px;text-align:center}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="statusBox" class="status">Logged out</div>

  <div id="idleBox" class="idleBox hidden">
    Idle Time Left: <b><span id="idleTime">30:00</span></b><br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
  <button id="dayBtn" onclick="openDayEnd()" disabled>Day End</button>
</div>

<div class="main">

<div id="taskBox" class="card hidden">
  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">

    <div>
      <h3>Assigned Tasks</h3>
      <div id="taskList"></div>
      <hr>
      <h4>Extra Work</h4>
      <div id="extraList"></div>
      <button onclick="addExtra()">+ Add Extra</button>
    </div>

    <div>
      <h3 style="text-align:center">Live Progress</h3>
      <div class="speedo">
        <div id="needle" class="needle"></div>
        <div class="cap"></div>
      </div>
      <div id="livePercent" class="percent">0%</div>
      <div id="liveRating" class="rating">Poor</div>
      <div id="liveDetails" class="details"></div>
    </div>

  </div>
</div>

<div id="logBox" class="card hidden">
  <h3>Login / Logout Log</h3>
  <table>
    <thead><tr><th>Login</th><th>Logout</th><th>Reason</th></tr></thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<div id="nextDayBox" class="card hidden"></div>
<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
let UID=null;
let idleTimer=null;
let idleRemaining=1800;
let idleMiss=0;
let penalty=0;

const now=()=>new Date().toLocaleString();
const key=k=>UID+"_"+k;

/* IDLE */
function startIdle(){
  idleRemaining=1800;
  idleMiss=0;
  idleTime.innerText="30:00";
  idleBox.classList.remove("hidden");

  clearInterval(idleTimer);
  idleTimer=setInterval(()=>{
    idleRemaining--;
    idleTime.innerText=
      Math.floor(idleRemaining/60)+":"+String(idleRemaining%60).padStart(2,"0");

    if(idleRemaining%30===0 && idleRemaining!==1800){
      idleMiss++;
      if(idleMiss>=2){
        penalty+=2;
        updateProgress();
      }
      if(idleMiss>=3){
        autoLogout();
      }
    }
  },1000);
}

function resetIdle(){
  startIdle();
}

function autoLogout(){
  clearInterval(idleTimer);
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout=now();
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));
  localStorage.setItem(key("ASK_REASON"),"1");
  location.reload();
}

/* LOGIN */
function login(){
  UID=prompt("Email");
  if(!UID)return;

  if(localStorage.getItem(key("ASK_REASON"))==="1"){
    const logs=JSON.parse(localStorage.getItem(key("LOGS")));
    const r=prompt("Reason for last logout?");
    logs[logs.length-1].reason=r||"Idle timeout";
    localStorage.setItem(key("LOGS"),JSON.stringify(logs));
    localStorage.removeItem(key("ASK_REASON"));
  }

  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||"[]");
  logs.push({login:now(),logout:"-",reason:"-"});
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));

  statusBox.innerText="Logged in";
  loginBtn.disabled=true;
  bioBtn.disabled=false;
  dayBtn.disabled=false;

  penalty=0;
  startIdle();
  setupTasks();
  loadTasks();
  renderLogs();
  updateProgress();
}

/* BIO BREAK */
function bioBreak(){
  clearInterval(idleTimer);
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout=now();
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));
  localStorage.setItem(key("ASK_REASON"),"1");
  location.reload();
}

/* TASK SETUP */
function setupTasks(){
  const carried=JSON.parse(localStorage.getItem(key("TASKS"))||"[]");
  const next=JSON.parse(localStorage.getItem(key("NEXT_TASKS"))||"[]");

  let merged=[...carried,...next.map(n=>({name:n,done:false}))];
  if(!merged.length){
    merged=[
      {name:"Study",done:false},
      {name:"Revise",done:false},
      {name:"Practice",done:false}
    ];
  }

  localStorage.setItem(key("TASKS"),JSON.stringify(merged));
  localStorage.removeItem(key("NEXT_TASKS"));
  localStorage.setItem(key("EXTRA"),JSON.stringify([]));

  taskBox.classList.remove("hidden");
  logBox.classList.remove("hidden");
  reportBox.classList.add("hidden");
}

/* LOAD TASKS */
function loadTasks(){
  taskList.innerHTML="";
  extraList.innerHTML="";
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));

  tasks.forEach(t=>{
    const c=document.createElement("input");
    c.type="checkbox";c.checked=t.done;
    c.onchange=()=>{
      if(!confirm("Confirm task completion?")){
        c.checked=!c.checked;return;
      }
      t.done=c.checked;
      save(tasks,extras);
    };
    taskList.append(c," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    const c=document.createElement("input");
    c.type="checkbox";c.checked=e.done;
    c.onchange=()=>{
      if(!confirm("Confirm extra work completion?")){
        c.checked=!c.checked;return;
      }
      e.done=c.checked;
      save(tasks,extras);
    };
    extraList.append(c," "+e.name,document.createElement("br"));
  });
}

/* EXTRA */
function addExtra(){
  const name=prompt("Extra work?");
  if(!name)return;
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));
  extras.push({name,done:false});
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  loadTasks();
}

/* SAVE */
function save(tasks,extras){
  localStorage.setItem(key("TASKS"),JSON.stringify(tasks));
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  updateProgress();
}

/* PROGRESS */
function calculate(){
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));
  const done=tasks.filter(t=>t.done).length + extras.filter(e=>e.done).length;
  const percent=tasks.length?Math.max(0,Math.round((done/tasks.length)*100-penalty)):0;
  return {percent,assigned:tasks.length,extra:extras.length};
}

function updateProgress(){
  const p=calculate();
  const angle=(Math.min(p.percent,300)/300)*180-90;
  needle.style.transform=`rotate(${angle}deg)`;
  livePercent.innerText=p.percent+"%";
  liveRating.innerText=getLabel(p.percent);
  liveDetails.innerText=`Assigned: ${p.assigned} | Extra: ${p.extra} | Penalty: -${penalty}%`;
}

function getLabel(p){
  if(p<40)return"Poor";
  if(p<60)return"Average";
  if(p<80)return"Good";
  if(p<100)return"Excellent";
  return"Fabulous";
}

/* DAY END */
function openDayEnd(){
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");

  nextDayBox.innerHTML="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    nextDayBox.innerHTML+=`<input id="nd${i}" style="width:100%;margin:6px 0">`;
  }
  nextDayBox.innerHTML+=`<button onclick="finalDayEnd()">Submit</button>`;
  nextDayBox.classList.remove("hidden");
}

function finalDayEnd(){
  const next=[];
  for(let i=0;i<5;i++){
    const v=document.getElementById("nd"+i).value.trim();
    if(v)next.push(v);
  }
  localStorage.setItem(key("NEXT_TASKS"),JSON.stringify(next));

  const p=calculate();
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const carry=tasks.filter(t=>!t.done);

  localStorage.setItem(key("TASKS"),JSON.stringify(carry));
  localStorage.setItem(key("EXTRA"),JSON.stringify([]));
  localStorage.removeItem(key("LOGS"));

  reportBox.innerHTML=`
    <h3>Daily Report</h3>
    <div class="percent">${p.percent}%</div>
    <div class="rating">${getLabel(p.percent)}</div>
    <div class="details">
      Assigned: ${tasks.length} |
      Carry Forward: ${carry.length} |
      Penalty: -${penalty}%
    </div>
  `;
  reportBox.classList.remove("hidden");

  taskBox.classList.add("hidden");
  logBox.classList.add("hidden");
  nextDayBox.classList.add("hidden");

  loginBtn.disabled=false;
  bioBtn.disabled=true;
  dayBtn.disabled=true;
}

/* LOG TABLE */
function renderLogs(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logTable.innerHTML="";
  logs.forEach(l=>{
    logTable.innerHTML+=`<tr><td>${l.login}</td><td>${l.logout}</td><td>${l.reason}</td></tr>`;
  });
}
</script>
</body>
</html>
