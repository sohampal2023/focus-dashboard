<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Focus Dashboard</h1>
    <p>Your personal study focus system is running.</p>

    <p class="status" id="statusText">Status: Logged out</p>

    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Daily Focus Report</h3>

    <label>Productive Time (minutes)</label><br>
    <input type="number" id="productive" placeholder="e.g. 240"><br><br>

    <label>Distracting Time (minutes)</label><br>
    <input type="number" id="distracting" placeholder="e.g. 60"><br><br>

    <label>Total Time (minutes)</label><br>
    <input type="number" id="total" placeholder="e.g. 300"><br><br>

    <button onclick="submitReport()">Submit Report</button>

    <p id="result"></p>
  </div>

  <script>
    function login() {
      document.getElementById("statusText").innerText = "Status: Logged in";
    }

    function logout() {
      document.getElementById("statusText").innerText = "Status: Logged out";
    }

    function submitReport() {
      const p = document.getElementById("productive").value;
      const d = document.getElementById("distracting").value;
      const t = document.getElementById("total").value;

      if (!p || !d || !t) {
        document.getElementById("result").innerText = "Please fill all fields.";
        return;
      }

      const productivity = ((p / t) * 100).toFixed(1);

      document.getElementById("result").innerText =
        "Report submitted. Productivity: " + productivity + "%";
    }
  </script>
</body>
</html>
