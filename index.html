<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:16px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:700;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.nav button:disabled{
  opacity:.4;
  cursor:not-allowed;
}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{
  display:flex;
  gap:10px;
  margin:10px 0;
}
input.nextTask{
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="statusBox" class="status">Status: Logged out</div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button id="dayEndBtn" onclick="openDayEnd()" disabled>Day End</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a"
};

initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* STATE */
let UID = null;
let currentTasks = [];

/* DOM */
const statusEl = document.getElementById("statusBox");
const taskList = document.getElementById("taskList");
const tasksBox = document.getElementById("tasksBox");
const dayEndBox = document.getElementById("dayEndBox");
const reportBox = document.getElementById("reportBox");
const dayEndBtn = document.getElementById("dayEndBtn");

/* LOGIN */
window.login = async ()=>{
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;

  try{
    const cred = await signInWithEmailAndPassword(auth,email,pass);
    UID = cred.user.uid;

    const ref = doc(db,"users",UID);
    const snap = await getDoc(ref);

    /* First-time user */
    if(!snap.exists()){
      await setDoc(ref,{
        email,
        currentTasks:[
          {name:"Study core subject",done:false},
          {name:"Revise notes",done:false},
          {name:"Practice questions",done:false}
        ],
        dayClosed:false,
        sessionStart:Date.now()
      });
    }

    const data = (await getDoc(ref)).data();

    /* GUARANTEED ARRAY */
    const baseTasks = Array.isArray(data.currentTasks)
      ? data.currentTasks
      : [];

    /* DAY LOGIC */
    if(data.dayClosed){
      const carry = baseTasks.filter(t=>!t.done);

      await updateDoc(ref,{
        currentTasks: carry,
        dayClosed:false,
        sessionStart:Date.now()
      });

      currentTasks = carry;
    }else{
      currentTasks = baseTasks;
    }

    renderTasks();

    statusEl.innerText = "Status: Logged in";
    tasksBox.classList.remove("hidden");
    dayEndBtn.disabled = false;

  }catch(e){
    console.error(e);
    alert(e.code + "\n" + e.message);
  }
};

/* TASK RENDER */
function renderTasks(){
  taskList.innerHTML="";
  currentTasks.forEach((t)=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=async()=>{
      if(!confirm("Confirm task status change?")){
        cb.checked=!cb.checked;
        return;
      }
      t.done = cb.checked;
      await updateDoc(doc(db,"users",UID),{
        currentTasks
      });
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

/* DAY END */
window.openDayEnd = ()=>{
  let html="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    html+=`<input class="nextTask" placeholder="Next Day Task ${i+1}">`;
  }
  html+=`<br><button onclick="confirmDayEnd()">Submit</button>`;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
};

window.confirmDayEnd = async ()=>{
  const done = currentTasks.filter(t=>t.done).length;
  const percent = currentTasks.length
    ? Math.round(done/currentTasks.length*100)
    : 0;

  const grade =
    percent>=80?"EXCELLENT":
    percent>=60?"GOOD":
    percent>=40?"AVERAGE":"POOR";

  await addDoc(collection(db,"users",UID,"reports"),{
    tasks: currentTasks,
    taskPercent: percent,
    grade,
    createdAt: serverTimestamp()
  });

  await updateDoc(doc(db,"users",UID),{
    dayClosed:true
  });

  reportBox.innerHTML = `
    <h3>Report Card</h3>
    Task Completion: ${percent}%<br>
    Grade: <b>${grade}</b>
  `;

  reportBox.classList.remove("hidden");
  tasksBox.classList.add("hidden");
  dayEndBox.classList.add("hidden");

  await signOut(auth);
};
</script>
</body>
</html>
