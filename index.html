<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:20px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:800;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.nav button:hover{border-color:#38bdf8}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{
  display:flex;
  gap:10px;
  margin:8px 0;
}
.progress{
  height:18px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1e293b;
}
.bar{
  height:100%;
  font-size:11px;
  font-weight:700;
  text-align:center;
}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="status" class="status">Status: Logged out</div>

  <div id="idleBox" class="status hidden">
    Focus Timer: <span id="idleTime">30</span>s
    <br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
  </div>
</div>

<div class="main">

  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* CONSTANTS */
const CURRENT_TASKS="CURRENT_TASKS";
const SESSION_START="SESSION_START";
const PRODUCTIVE_TIME="PRODUCTIVE_TIME";
const IDLE_LIMIT=30;

/* STATE */
let CURRENT_UID=null;
let idleTimer=null;
let idleRemaining=IDLE_LIMIT;
let lastActiveStamp=null;

/* HELPERS */
function ukey(k){return CURRENT_UID+"_"+k}

/* LOGIN */
window.login=async()=>{
  const email=prompt("Email");
  const pass=prompt("Password");
  if(!email||!pass)return;

  const cred=await signInWithEmailAndPassword(auth,email,pass);
  CURRENT_UID=cred.user.uid;

  const ref=doc(db,"users",CURRENT_UID);
  if(!(await getDoc(ref)).exists()){
    await setDoc(ref,{email});
  }

  if(!localStorage.getItem(ukey(CURRENT_TASKS))){
    localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify([
      {name:"Study core subject",done:false},
      {name:"Revise notes",done:false},
      {name:"Practice questions",done:false}
    ]));
  }

  localStorage.setItem(ukey(SESSION_START),Date.now());
  localStorage.setItem(ukey(PRODUCTIVE_TIME),"0");

  status.innerText="Status: Logged in";
  tasksBox.classList.remove("hidden");
  idleBox.classList.remove("hidden");

  loadTasks();
  startIdleTimer();
};

/* TASKS */
function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))||"[]");
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{t.done=cb.checked;localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify(data))};
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

/* IDLE LOGIC */
function startIdleTimer(){
  clearInterval(idleTimer);
  idleRemaining=IDLE_LIMIT;
  idleTime.innerText=idleRemaining;
  lastActiveStamp=Date.now();

  idleTimer=setInterval(()=>{
    idleRemaining--;
    idleTime.innerText=idleRemaining;
    if(idleRemaining<=0) idleLogout();
  },1000);
}

window.resetIdle=function(){
  const now=Date.now();
  const productive=Math.floor((now-lastActiveStamp)/1000);
  const prev=Number(localStorage.getItem(ukey(PRODUCTIVE_TIME))||0);
  localStorage.setItem(ukey(PRODUCTIVE_TIME),prev+productive);
  startIdleTimer();
};

async function idleLogout(){
  clearInterval(idleTimer);
  alert("Idle detected. Auto logout.");
  await signOut(auth);
  location.reload();
}

/* DAY END */
window.openDayEnd=()=>{
  dayEndBox.innerHTML=`
    <h3>Confirm Day End</h3>
    <button onclick="confirmDayEnd()">Confirm</button>
  `;
  dayEndBox.classList.remove("hidden");
};

window.confirmDayEnd=async()=>{
  clearInterval(idleTimer);

  const tasks=JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))||"[]");
  const done=tasks.filter(t=>t.done).length;
  const taskPercent=tasks.length?Math.round(done/tasks.length*100):0;

  const productive=Number(localStorage.getItem(ukey(PRODUCTIVE_TIME))||0);
  const total=Math.floor((Date.now()-Number(localStorage.getItem(ukey(SESSION_START))))/1000);
  const productivePercent=total?Math.min(100,Math.round(productive/total*100)):0;

  const finalScore=Math.round(taskPercent*0.7+productivePercent*0.3);
  const grade=finalScore>=80?"EXCELLENT":finalScore>=60?"GOOD":finalScore>=40?"AVERAGE":"POOR";

  reportBox.innerHTML=`
    <h3>Report Card</h3>
    Task Completion: ${taskPercent}%<br>
    Productive Time: ${productivePercent}%<br><br>
    <div class="progress">
      <div class="bar ${grade}" style="width:${finalScore}%">${finalScore}%</div>
    </div>
    Grade: <b>${grade}</b>
  `;
  reportBox.classList.remove("hidden");

  await signOut(auth);
};

/* BIO BREAK */
window.bioBreak=async()=>{
  clearInterval(idleTimer);
  await signOut(auth);
  location.reload();
};
</script>
</body>
</html>
