<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Focus Tracker</title>

<style>
body{
  margin:0;
  font-family:system-ui,Segoe UI;
  background:#0f172a;
  color:#e5e7eb;
}
header{
  padding:16px;
  background:#020617;
  border-bottom:1px solid #334155;
}
main{padding:20px; max-width:800px; margin:auto}
button{
  padding:10px 16px;
  background:#020617;
  color:#fff;
  border:1px solid #334155;
  cursor:pointer;
}
input{
  padding:10px;
  width:100%;
  margin:6px 0;
  background:#020617;
  border:1px solid #334155;
  color:#fff;
}
.task{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
}
.locked{opacity:.6}
#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
}
#popupBox{
  background:#020617;
  padding:20px;
  border:2px solid #38bdf8;
  border-radius:14px;
  text-align:center;
}
.hidden{display:none}
</style>
</head>

<body>

<header>
  <h3>Student Focus Tracker</h3>
  <div id="status">Not logged in</div>
</header>

<main>
  <div id="loginBox">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="app" class="hidden">
    <h3>Today Tasks</h3>
    <div id="tasks"></div>

    <input id="taskInput" placeholder="Add task for today">
    <button onclick="addTask()">Add Task</button>

    <br><br>
    <button onclick="dayEnd()">Day End</button>
    <div id="report"></div>
  </div>
</main>

<!-- Focus Popup -->
<div id="popup" class="hidden">
  <div id="popupBox">
    <h3>Focus Check</h3>
    <p>Are you studying?</p>
    <button onclick="focusAnswer(true)">Yes</button>
    <button onclick="focusAnswer(false)">No</button>
    <p style="font-size:12px">No response = miss</p>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ========= FIREBASE ========= */
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT"
});
const auth = firebase.auth();
const db = firebase.database();

/* ========= STATE ========= */
let uid=null;
let sessionId=null;
let tasks=[];
let popupMiss=0;
let score=100;
let popupTimer=null;

/* ========= LOGIN ========= */
async function login(){
  const email=email.value;
  const password=password.value;
  const res=await auth.signInWithEmailAndPassword(email,password);
  uid=res.user.uid;
  status.innerText="Logged in";
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  await loadOrCreateSession();
  startFocusCycle();
}

/* ========= SESSION ========= */
async function loadOrCreateSession(){
  const snap=await db.ref("sessions/"+uid).once("value");
  if(!snap.exists() || snap.val().status==="CLOSED"){
    sessionId=Date.now();
    await db.ref("sessions/"+uid).set({
      sessionId,
      loginAt:firebase.database.ServerValue.TIMESTAMP,
      status:"ACTIVE",
      popupMiss:0,
      score:100
    });
    tasks=[];
  }else{
    sessionId=snap.val().sessionId;
    popupMiss=snap.val().popupMiss;
    score=snap.val().score;
    const t=await db.ref("tasks/"+uid+"/"+sessionId).once("value");
    tasks=t.exists()?t.val():[];
  }
  renderTasks();
}

/* ========= TASKS ========= */
function renderTasks(){
  tasksDiv.innerHTML="";
  tasks.forEach((t,i)=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm completed?")){
        tasks[i].done=true;
        saveTasks();
      }else cb.checked=false;
    };
    const d=document.createElement("div");
    d.className="task"+(t.done?" locked":"");
    d.append(cb,document.createTextNode(t.name));
    tasksDiv.appendChild(d);
  });
}

async function saveTasks(){
  await db.ref("tasks/"+uid+"/"+sessionId).set(tasks);
  renderTasks();
}

function addTask(){
  const v=taskInput.value.trim();
  if(!v)return;
  tasks.push({name:v,done:false});
  saveTasks();
  taskInput.value="";
}

/* ========= FOCUS ========= */
function startFocusCycle(){
  popupTimer=setTimeout(showPopup,30000);
}
function showPopup(){
  popup.classList.remove("hidden");
  popupTimer=setTimeout(()=>{
    registerMiss();
  },60000);
}
function focusAnswer(ok){
  popup.classList.add("hidden");
  clearTimeout(popupTimer);
  if(!ok) registerMiss();
  startFocusCycle();
}
function registerMiss(){
  popup.classList.add("hidden");
  popupMiss++;
  score-=2;
  db.ref("sessions/"+uid).update({popupMiss,score});
  startFocusCycle();
}

/* ========= DAY END ========= */
async function dayEnd(){
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;

  await db.ref("sessions/"+uid).update({
    status:"CLOSED",
    popupMiss,
    score,
    dayEndAt:firebase.database.ServerValue.TIMESTAMP
  });

  report.innerHTML=`
    <h3>Report</h3>
    Tasks: ${done}/${total}<br>
    Completion: ${pct}%<br>
    Score: ${score}%
  `;
}
</script>

</body>
</html>
