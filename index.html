<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background:#f4f6f9;
    }

    .container {
      max-width: 820px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }

    /* Quote section */
    .quote-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .quote-card img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 10px;
      object-fit: contain;
    }

    .progress {
      width: 100%;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0;
    }

    .bar {
      height: 20px;
      background: #4caf50;
      color: white;
      text-align: center;
      font-size: 12px;
      line-height: 20px;
    }

    .report {
      background:#eef6ff;
      padding:15px;
      margin-top:20px;
      border-radius:6px;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #4a90e2;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-right: 6px;
    }

    button:hover {
      background: #357ac9;
    }
  </style>
</head>

<body onload="initPage()">

<div class="container">

  <!-- 🌿 MOTIVATIONAL IMAGE QUOTE -->
  <div class="quote-card">
    <img id="quoteImage" src="quotes/1.jpg" alt="Motivational Quote">
  </div>

  <h1>Focus Dashboard</h1>

  <p id="statusText">Status: Logged out</p>

  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>

  <hr>

  <h3>Assigned Tasks</h3>
  <div id="taskList">No tasks assigned.</div>

  <hr>

  <h3>Day End</h3>
  <button onclick="startDayEnd()">Day End</button>
  <div id="dayEndBox"></div>

  <div id="reportBox"></div>

</div>

<script>
/* =====================================================
   IMAGE QUOTE ROTATION (1 MINUTE)
===================================================== */
const TOTAL_QUOTES = 30;
let quoteIndex = 1;

function rotateQuote() {
  document.getElementById("quoteImage").src =
    "quotes/" + quoteIndex + ".jpg";
  quoteIndex++;
  if (quoteIndex > TOTAL_QUOTES) quoteIndex = 1;
}

// show first image
rotateQuote();

// change every 1 minute
setInterval(rotateQuote, 60000);

/* =====================================================
   EXISTING LOGIC (UNCHANGED)
===================================================== */

/* ---------- STORAGE KEYS ---------- */
const SESSIONS = "SESSIONS";
const CURRENT = "CURRENT_TASKS";
const NEXT = "NEXT_TASKS";
const DAY_ENDED = "DAY_ENDED";
const LAST = "LAST_REPORT";
const PREV = "PREV_REPORT";

/* ---------- TIME HELPERS ---------- */
function now() { return new Date(); }
function minutesBetween(a,b){ return Math.round((b-a)/60000); }

/* ---------- LOGIN / LOGOUT ---------- */
function login() {
  const sessions = JSON.parse(localStorage.getItem(SESSIONS) || "[]");
  sessions.push({ start: now().toISOString(), end: null });
  localStorage.setItem(SESSIONS, JSON.stringify(sessions));

  document.getElementById("statusText").innerText = "Status: Logged in";

  activateNextDayIfNeeded();
  loadTasks();
  showReport();
}

function logout() {
  const sessions = JSON.parse(localStorage.getItem(SESSIONS) || "[]");
  for (let i = sessions.length - 1; i >= 0; i--) {
    if (sessions[i].end === null) {
      sessions[i].end = now().toISOString();
      break;
    }
  }
  localStorage.setItem(SESSIONS, JSON.stringify(sessions));
  document.getElementById("statusText").innerText = "Status: Logged out";
}

/* ---------- DAY END ---------- */
function startDayEnd() {
  const n = Number(prompt("How many subjects next day? (1–7)"));
  if (n < 1 || n > 7) return alert("Only 1–7 allowed");

  let html = "<h4>Next Day Subjects</h4>";
  for (let i = 0; i < n; i++) {
    html += `<input id="s${i}" placeholder="Subject ${i+1}"><br><br>`;
  }

  html += `
    <h4>Distraction</h4>
    <label><input type="checkbox" id="yt"> YouTube</label><br>
    <label><input type="checkbox" id="fb"> Facebook</label><br>
    <label><input type="checkbox" id="ig"> Instagram</label><br><br>
    Distraction Time (minutes):
    <input type="number" id="dist" min="0"><br><br>
    <button onclick="confirmDayEnd(${n})">Confirm Day End</button>
  `;
  dayEndBox.innerHTML = html;
}

function confirmDayEnd(n) {
  let nextTasks = [];

  const current = JSON.parse(localStorage.getItem(CURRENT) || "[]");
  current.filter(t => !t.done)
         .forEach(t => nextTasks.push({name:t.name,done:false}));

  for (let i = 0; i < n; i++) {
    const v = document.getElementById("s"+i).value.trim();
    if (!v) return alert("Fill all subjects");
    nextTasks.push({name:v,done:false});
  }

  localStorage.setItem(NEXT, JSON.stringify(nextTasks));
  localStorage.removeItem(CURRENT);
  localStorage.setItem(DAY_ENDED, "true");

  generateReport();
  logout();
  location.reload();
}

/* ---------- TASK FLOW ---------- */
function activateNextDayIfNeeded() {
  if (localStorage.getItem(DAY_ENDED) === "true") {
    const next = localStorage.getItem(NEXT);
    if (next) {
      localStorage.setItem(CURRENT, next);
      localStorage.removeItem(NEXT);
    }
    localStorage.removeItem(DAY_ENDED);
    localStorage.removeItem(SESSIONS);
  }
}

function loadTasks() {
  const box = document.getElementById("taskList");
  box.innerHTML = "";
  const data = localStorage.getItem(CURRENT);
  if (!data) { box.innerText = "No tasks assigned."; return; }

  const tasks = JSON.parse(data);
  tasks.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task done?")){
        t.done=true;
        localStorage.setItem(CURRENT,JSON.stringify(tasks));
        loadTasks();
      } else cb.checked=false;
    };
    box.appendChild(cb);
    box.append(" "+t.name);
    box.appendChild(document.createElement("br"));
  });
}

/* ---------- REPORT ---------- */
function generateReport() {
  const sessions = JSON.parse(localStorage.getItem(SESSIONS) || "[]");
  let totalMin = 0;

  sessions.forEach(s=>{
    if(s.start && s.end){
      totalMin += minutesBetween(new Date(s.start), new Date(s.end));
    }
  });

  const dist = Number(document.getElementById("dist").value || 0);
  const productive = Math.max(totalMin - dist, 0);
  const prodPct = totalMin ? Math.round((productive/totalMin)*100) : 0;

  const tasks = JSON.parse(localStorage.getItem(CURRENT) || "[]");
  const done = tasks.filter(t=>t.done).length;
  const taskPct = tasks.length ? Math.round((done/tasks.length)*100) : 100;

  const status = prodPct>=80?"EXCELLENT":prodPct>=50?"AVERAGE":"POOR";

  localStorage.setItem(LAST, JSON.stringify({
    totalMin, productive, dist, prodPct, taskPct, status
  }));
}

function showReport() {
  const r = JSON.parse(localStorage.getItem(LAST));
  if(!r) return;

  reportBox.innerHTML = `
    <div class="report">
      <h3>Last Report Card</h3>
      Total Time: ${r.totalMin} min<br>
      Productive: ${r.productive} min<br>
      Distraction: ${r.dist} min<br><br>

      Productivity: ${r.prodPct}%
      <div class="progress"><div class="bar" style="width:${r.prodPct}%">${r.prodPct}%</div></div>

      Task Completion: ${r.taskPct}%
      <div class="progress"><div class="bar" style="width:${r.taskPct}%">${r.taskPct}%</div></div>

      <b>Status:</b> ${r.status}
    </div>
  `;
}

function initPage(){
  activateNextDayIfNeeded();
  loadTasks();
  showReport();
}
</script>

</body>
</html>
