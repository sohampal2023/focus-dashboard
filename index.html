<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:14px;
  border-radius:14px;
  border:2px solid #334155;
  text-align:center;
  font-weight:700;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.nav button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* MAIN */
.main{
  padding:30px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}
.hidden{display:none}

/* SPEEDOMETER */
.speedo-wrap{
  display:flex;
  justify-content:center;
  margin:20px 0 10px;
}
.speedo{
  width:320px;
  height:160px;
  border-radius:320px 320px 0 0;
  position:relative;
  background:conic-gradient(
    #dc2626 0deg,
    #ef4444 30deg,
    #facc15 60deg,
    #22c55e 100deg,
    #38bdf8 140deg,
    #a855f7 180deg
  );
  overflow:hidden;
}
.speedo::after{
  content:"";
  position:absolute;
  inset:20px;
  background:#020617;
  border-radius:300px 300px 0 0;
}
.needle{
  width:4px;
  height:130px;
  background:#f8fafc;
  position:absolute;
  bottom:0;
  left:50%;
  transform-origin:bottom center;
  transform:rotate(-90deg);
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
  z-index:4;
}
.center-dot{
  width:16px;height:16px;
  background:#f8fafc;
  border-radius:50%;
  position:absolute;
  bottom:0;
  left:50%;
  transform:translate(-50%,50%);
  z-index:5;
}

/* TEXT */
.percent{
  text-align:center;
  font-size:42px;
  font-weight:900;
  color:#38bdf8;
}
.details{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#cbd5f5;
}

/* INPUT */
input.nextTask{
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
}
</style>
</head>

<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="statusBox" class="status">Status: Logged out</div>

  <div id="idleBox" class="status hidden">
    Idle Timer: <b><span id="idleTime">30:00</span></b><br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <div class="nav">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
    <button id="dayEndBtn" onclick="openDayEnd()" disabled>Day End</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

<div id="tasksBox" class="card hidden">
  <div style="display:grid;grid-template-columns:1fr 360px;gap:20px">

    <div>
      <h3>Assigned Tasks</h3>
      <div id="taskList"></div>

      <hr>

      <h4>Extra Work (Bonus)</h4>
      <div id="extraList"></div>
      <button onclick="addExtraTask()">+ Add Extra Work</button>
    </div>

    <div>
      <h3 style="text-align:center">Live Progress</h3>

      <div class="speedo-wrap">
        <div class="speedo">
          <div id="liveNeedle" class="needle"></div>
          <div class="center-dot"></div>
        </div>
      </div>

      <div id="livePercent" class="percent">0%</div>
      <div id="liveDetails" class="details"></div>
    </div>

  </div>
</div>

<div id="dayEndBox" class="card hidden"></div>
<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
let UID=null;
let idleTimer=null;
let idleRemaining=1800;

const K_TASKS="TASKS";
const K_EXTRA="EXTRA_TASKS";
const K_NEXT="NEXT_TASKS";
const key=k=>UID+"_"+k;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

function login(){
  UID=prompt("Email");
  if(!UID)return;

  reportBox.classList.add("hidden");
  loginBtn.disabled=true;
  bioBtn.disabled=false;
  dayEndBtn.disabled=false;
  statusBox.innerText="Status: Logged in";

  idleBox.classList.remove("hidden");
  startIdle();

  mergeTasks();
  loadTasks();
  updateLiveSpeedo();
}

function mergeTasks(){
  const prev=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const next=JSON.parse(localStorage.getItem(key(K_NEXT))||"[]");
  const merged=[...prev,...next.map(n=>({name:n,done:false}))];

  if(!merged.length){
    merged.push(
      {name:"Study core subject",done:false},
      {name:"Revise notes",done:false},
      {name:"Practice questions",done:false}
    );
  }

  localStorage.setItem(key(K_TASKS),JSON.stringify(merged));
  localStorage.removeItem(key(K_NEXT));
  localStorage.setItem(key(K_EXTRA),"[]");

  tasksBox.classList.remove("hidden");
}

function loadTasks(){
  taskList.innerHTML="";
  extraList.innerHTML="";

  const tasks=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");

  tasks.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      if(!confirm("Confirm task status change?")){
        cb.checked=!cb.checked;return;
      }
      t.done=cb.checked;
      localStorage.setItem(key(K_TASKS),JSON.stringify(tasks));
      updateLiveSpeedo();
    };
    taskList.append(cb," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=e.done;
    cb.onchange=()=>{
      if(!confirm("Confirm extra work completion?")){
        cb.checked=!cb.checked;return;
      }
      e.done=cb.checked;
      localStorage.setItem(key(K_EXTRA),JSON.stringify(extras));
      updateLiveSpeedo();
    };
    extraList.append(cb," "+e.name,document.createElement("br"));
  });
}

function addExtraTask(){
  const name=prompt("Extra work?");
  if(!name)return;
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");
  extras.push({name,done:false});
  localStorage.setItem(key(K_EXTRA),JSON.stringify(extras));
  loadTasks();
  updateLiveSpeedo();
}

function updateLiveSpeedo(){
  const tasks=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");

  const assigned=tasks.length;
  const done=tasks.filter(t=>t.done).length;
  const extraDone=extras.filter(e=>e.done).length;

  const percent=assigned?Math.round(((done+extraDone)/assigned)*100):0;
  const angle=Math.min(percent*1.8,270)-90;

  liveNeedle.style.transform=`rotate(${angle}deg)`;
  livePercent.innerText=percent+"%";
  liveDetails.innerText=`Assigned: ${assigned} | Done: ${done} | Extra: ${extraDone}`;
}

function startIdle(){
  clearInterval(idleTimer);
  idleRemaining=1800;
  idleTime.innerText=fmt(idleRemaining);
  idleTimer=setInterval(()=>{
    idleRemaining--;
    idleTime.innerText=fmt(idleRemaining);
    if(idleRemaining<=0) location.reload();
  },1000);
}
function resetIdle(){startIdle()}

function openDayEnd(){
  let html="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    html+=`<input class="nextTask" placeholder="Next Day Task ${i+1}">`;
  }
  html+=`<br><button onclick="confirmDayEnd()">Submit</button>`;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
}

function confirmDayEnd(){
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");

  const next=[...document.querySelectorAll(".nextTask")]
    .map(i=>i.value.trim()).filter(v=>v);
  if(next.length) localStorage.setItem(key(K_NEXT),JSON.stringify(next));

  const tasks=JSON.parse(localStorage.getItem(key(K_TASKS))||"[]");
  const extras=JSON.parse(localStorage.getItem(key(K_EXTRA))||"[]");

  const undone=tasks.filter(t=>!t.done);
  localStorage.setItem(key(K_TASKS),JSON.stringify(undone));

  const assigned=tasks.length;
  const done=tasks.filter(t=>t.done).length;
  const extraDone=extras.filter(e=>e.done).length;
  const percent=Math.round(((done+extraDone)/assigned)*100);
  const angle=(percent*1.8)-90;

  reportBox.innerHTML=`
    <h3 style="text-align:center">Performance Meter</h3>
    <div class="speedo-wrap">
      <div class="speedo">
        <div class="needle" style="transform:rotate(${angle}deg)"></div>
        <div class="center-dot"></div>
      </div>
    </div>
    <div class="percent">${percent}%</div>
    <div class="details">Assigned: ${assigned} | Done: ${done} | Extra: ${extraDone}</div>
  `;
  reportBox.classList.remove("hidden");

  tasksBox.classList.add("hidden");
  dayEndBox.classList.add("hidden");

  loginBtn.disabled=false;
  bioBtn.disabled=true;
  dayEndBtn.disabled=true;
  statusBox.innerText="Status: Day End Completed";
}

function bioBreak(){location.reload()}
</script>
</body>
</html>
