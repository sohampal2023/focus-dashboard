<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:#020617;color:#e5e7eb}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{padding:20px;border-right:1px solid #1e293b}
.sidebar h2{text-align:center;color:#38bdf8;margin-bottom:12px}
.status{padding:12px;border:1px solid #334155;border-radius:12px;text-align:center;margin-bottom:12px}
button{
  width:100%;padding:12px;margin:6px 0;border-radius:10px;
  border:1px solid #334155;background:#020617;color:#e5e7eb;cursor:pointer
}
button:disabled{opacity:.4;cursor:not-allowed}

/* MAIN */
.main{padding:24px;overflow:auto}
.card{background:#020617;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:20px}
.hidden{display:none}

/* SPEEDOMETER (task view only) */
.speedo{
  width:320px;height:160px;border-radius:320px 320px 0 0;position:relative;
  background:conic-gradient(from -90deg,#dc2626,#f97316,#facc15,#22c55e,#8b5cf6);
  box-shadow:inset 0 0 0 14px #020617,inset 0 0 0 18px #1e293b;
}
.ticks{
  position:absolute;inset:0;
  background:repeating-conic-gradient(from -90deg,#fff 0 2deg,transparent 2deg 6deg);
  mask:radial-gradient(circle at bottom,transparent 58%,black 59%);
}
.needle{
  position:absolute;width:6px;height:120px;background:#fff;
  left:50%;bottom:0;transform-origin:bottom center;
  transform:rotate(-90deg);
  transition:transform .6s cubic-bezier(.15,.85,.2,1)
}
.cap{
  position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;
  left:50%;bottom:0;transform:translate(-50%,50%)
}

.percent{text-align:center;font-size:40px;font-weight:800;color:#38bdf8}
.rating{text-align:center;font-size:18px;font-weight:700;margin-top:6px}
.details{text-align:center;font-size:14px;color:#cbd5f5}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #334155;padding:8px;text-align:center}
th{background:#020617}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="statusBox" class="status">Status: Logged out</div>
  <button id="loginBtn" onclick="login()">Login</button>
  <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
  <button id="dayBtn" onclick="dayEnd()" disabled>Day End</button>
</div>

<div class="main">

<!-- TASK VIEW -->
<div id="taskBox" class="card hidden">
  <div style="display:grid;grid-template-columns:1fr 340px;gap:20px">
    <div>
      <h3>Assigned Tasks</h3>
      <div id="taskList"></div>
      <hr>
      <h4>Extra Work</h4>
      <div id="extraList"></div>
      <button onclick="addExtra()">+ Add Extra</button>
    </div>

    <div>
      <h3 style="text-align:center">Live Progress</h3>
      <div class="speedo">
        <div class="ticks"></div>
        <div id="needle" class="needle"></div>
        <div class="cap"></div>
      </div>
      <div id="livePercent" class="percent">0%</div>
      <div id="liveRating" class="rating">Poor</div>
      <div id="liveDetails" class="details"></div>
    </div>
  </div>
</div>

<!-- LOGIN LOG -->
<div id="logBox" class="card hidden">
  <h3>Login / Logout Log</h3>
  <table>
    <thead>
      <tr><th>Login</th><th>Logout</th><th>Reason</th></tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<!-- REPORT -->
<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
let UID=null;
const now=()=>new Date().toLocaleString();
const key=k=>UID+"_"+k;

/* LOGIN */
function login(){
  UID=prompt("Email");
  if(!UID)return;

  if(localStorage.getItem(key("ASK_REASON"))==="1"){
    const logs=JSON.parse(localStorage.getItem(key("LOGS"))||"[]");
    const r=prompt("Reason for last logout?");
    logs[logs.length-1].reason=r||"Not specified";
    localStorage.setItem(key("LOGS"),JSON.stringify(logs));
    localStorage.removeItem(key("ASK_REASON"));
  }

  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||"[]");
  logs.push({login:now(),logout:"-",reason:"-"});
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));

  statusBox.innerText="Status: Logged in";
  loginBtn.disabled=true;
  bioBtn.disabled=false;
  dayBtn.disabled=false;

  initTasks();
  loadTasks();
  renderLogs();
  updateSpeedo();
}

/* BIO BREAK */
function bioBreak(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout=now();
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));
  localStorage.setItem(key("ASK_REASON"),"1");
  location.reload();
}

/* DAY END */
function dayEnd(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout=now();
  logs[logs.length-1].reason="Day Completed";

  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA"))||"[]");

  const percent=Math.round(((tasks.filter(t=>t.done).length+extras.length)/tasks.length)*100);

  reportBox.innerHTML=`
    <h3>Daily Report Card</h3>
    <div class="percent">${percent}%</div>
    <div class="rating">${getLabel(percent)}</div>
    <div class="details">
      Assigned: ${tasks.length} |
      Done: ${tasks.filter(t=>t.done).length} |
      Extra: ${extras.length}
    </div>
  `;
  reportBox.classList.remove("hidden");

  localStorage.removeItem(key("LOGS"));
  taskBox.classList.add("hidden");
  logBox.classList.add("hidden");
}

/* TASKS */
function initTasks(){
  if(!localStorage.getItem(key("TASKS"))){
    localStorage.setItem(key("TASKS"),JSON.stringify([
      {name:"Study",done:false},
      {name:"Revise",done:false},
      {name:"Practice",done:false}
    ]));
    localStorage.setItem(key("EXTRA"),"[]");
  }
  taskBox.classList.remove("hidden");
  logBox.classList.remove("hidden");
}

function loadTasks(){
  taskList.innerHTML="";
  extraList.innerHTML="";

  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA"))||"[]");

  tasks.forEach(t=>{
    const c=document.createElement("input");
    c.type="checkbox";
    c.checked=t.done;
    c.onchange=()=>{t.done=c.checked;save(tasks,extras)};
    taskList.append(c," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    extraList.append("✔ "+e.name,document.createElement("br"));
  });
}

function addExtra(){
  const e=prompt("Extra work?");
  if(!e)return;
  const extras=JSON.parse(localStorage.getItem(key("EXTRA"))||"[]");
  extras.push({name:e});
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  loadTasks();
  updateSpeedo();
}

function save(tasks,extras){
  localStorage.setItem(key("TASKS"),JSON.stringify(tasks));
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  updateSpeedo();
}

/* SPEEDO + LABEL */
function updateSpeedo(){
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA"))||"[]");

  const percent=Math.round(((tasks.filter(t=>t.done).length+extras.length)/tasks.length)*100);
  const capped=Math.min(percent,300);
  const angle=(capped/300)*180 - 90;

  needle.style.transform=`rotate(${angle}deg)`;
  livePercent.innerText=percent+"%";
  liveRating.innerText=getLabel(percent);
  liveDetails.innerText=`Assigned: ${tasks.length} | Extra: ${extras.length}`;
}

function getLabel(p){
  if(p < 40) return "Poor";
  if(p < 60) return "Average";
  if(p < 80) return "Good";
  if(p < 100) return "Excellent";
  return "Fabulous";
}

function renderLogs(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||"[]");
  logTable.innerHTML="";
  logs.forEach(l=>{
    logTable.innerHTML+=`<tr><td>${l.login}</td><td>${l.logout}</td><td>${l.reason}</td></tr>`;
  });
}
</script>
</body>
</html>
