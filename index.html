<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:16px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:700;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.nav button:disabled{
  opacity:.4;
  cursor:not-allowed;
}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{
  display:flex;
  gap:10px;
  margin:10px 0;
}
.progress{
  height:18px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1e293b;
}
.bar{
  height:100%;
  font-size:11px;
  font-weight:700;
  text-align:center;
}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
input.nextTask{
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="statusBox" class="status">Status: Logged out</div>

  <div id="idleBox" class="status hidden">
    Idle Timer: <b><span id="idleTime">30:00</span></b><br>
    Idle Count: <b><span id="idleCount">0</span></b>
    <br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <div class="nav">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
    <button id="dayEndBtn" onclick="openDayEnd()" disabled>Day End</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* DOM */
const statusEl = document.getElementById("statusBox");
const tasksBox = document.getElementById("tasksBox");
const taskList = document.getElementById("taskList");
const idleBox = document.getElementById("idleBox");
const idleTime = document.getElementById("idleTime");
const idleCountEl = document.getElementById("idleCount");
const dayEndBox = document.getElementById("dayEndBox");
const reportBox = document.getElementById("reportBox");

const bioBtn = document.getElementById("bioBtn");
const dayEndBtn = document.getElementById("dayEndBtn");

/* CONSTANTS */
const CURRENT_TASKS="CURRENT_TASKS";
const SESSION_START="SESSION_START";
const PRODUCTIVE_TIME="PRODUCTIVE_TIME";
const IDLE_COUNT="IDLE_COUNT";
const IDLE_LIMIT=1800;

/* STATE */
let CURRENT_UID=null;
let idleTimer=null;
let idleRemaining=IDLE_LIMIT;

/* HELPERS */
function ukey(k){return CURRENT_UID+"_"+k}

/* LOGIN */
window.login = async ()=>{
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;

  try{
    const cred = await signInWithEmailAndPassword(auth,email,pass);
    CURRENT_UID = cred.user.uid;

    const ref = doc(db,"users",CURRENT_UID);
    if(!(await getDoc(ref)).exists()){
      await setDoc(ref,{ email });
    }

    if(!localStorage.getItem(ukey(CURRENT_TASKS))){
      localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify([
        {name:"Study core subject",done:false},
        {name:"Revise notes",done:false},
        {name:"Practice questions",done:false}
      ]));
    }

    localStorage.setItem(ukey(SESSION_START),Date.now());
    localStorage.setItem(ukey(PRODUCTIVE_TIME),"0");
    localStorage.setItem(ukey(IDLE_COUNT),"0");

    idleCountEl.innerText="0";
    statusEl.innerText="Status: Logged in";

    tasksBox.classList.remove("hidden");
    idleBox.classList.remove("hidden");
    bioBtn.disabled=false;
    dayEndBtn.disabled=false;

    loadTasks();
    startIdleTimer();

  }catch(err){
    alert("Login failed:\n" + err.message);
  }
};

/* TASKS */
function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(ukey(CURRENT_TASKS))||"[]");
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      if(!confirm("Confirm task status change?")){
        cb.checked=!cb.checked;
        return;
      }
      t.done=cb.checked;
      localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify(data));
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

/* IDLE TIMER */
function startIdleTimer(){
  clearInterval(idleTimer);
  idleRemaining=IDLE_LIMIT;
  updateIdleTime();

  idleTimer=setInterval(()=>{
    idleRemaining--;
    updateIdleTime();
    if(idleRemaining<=0) idleLogout();
  },1000);
}

function updateIdleTime(){
  const m=Math.floor(idleRemaining/60);
  const s=idleRemaining%60;
  idleTime.innerText=`${m}:${s.toString().padStart(2,"0")}`;
}

window.resetIdle=()=>startIdleTimer();

async function idleLogout(){
  clearInterval(idleTimer);
  alert("Idle detected. Auto logout.");
  await signOut(auth);
  location.reload();
}

/* DAY END */
window.openDayEnd=()=>{
  let html="<h3>Enter Next Day Tasks</h3>";
  for(let i=0;i<5;i++){
    html+=`<input class="nextTask" placeholder="Next Day Task ${i+1}">`;
  }
  html+=`<br><button onclick="confirmDayEnd()">Submit</button>`;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
};

window.confirmDayEnd=async()=>{
  clearInterval(idleTimer);
  await signOut(auth);
  location.reload();
};

/* BIO BREAK */
window.bioBreak=async()=>{
  clearInterval(idleTimer);
  await signOut(auth);
  location.reload();
};
</script>
</body>
</html>
