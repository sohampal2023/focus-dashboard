<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
body{
  font-family: "Segoe UI", Arial;
  background: linear-gradient(135deg,#e8f0ff,#f7faff);
  margin:0;
}
.container{
  max-width:900px;
  margin:30px auto;
  background:#ffffff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
}
h1{text-align:center;margin-bottom:10px;}
.status{text-align:center;font-weight:bold;margin:10px 0;}
button{
  padding:8px 14px;
  margin:4px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
button:disabled{background:#9ca3af;}
button.secondary{background:#059669;}
button.warn{background:#dc2626;}

.card{
  background:#f1f5f9;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.progress{
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
  height:20px;
  margin:6px 0;
}
.bar{
  height:100%;
  background:#22c55e;
  text-align:center;
  color:white;
  font-size:12px;
}

.hidden{display:none;}

.task{
  margin:6px 0;
}

img{
  max-width:100%;
  border-radius:12px;
}

.historyItem{
  background:#fff;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border-left:5px solid #2563eb;
}
</style>
</head>

<body>
<div class="container">

<h1>Focus Dashboard</h1>

<div id="quoteBox" class="card hidden" style="text-align:center;"></div>

<div class="status" id="statusText">Status: Logged out</div>

<div style="text-align:center;">
  <button onclick="login()">Login</button>
  <button onclick="logout()" class="secondary">Bio Break</button>
  <button onclick="showHistory()">History</button>
</div>

<div id="tasksBox" class="card hidden">
  <h3>Assigned Tasks</h3>
  <div id="taskList"></div>
</div>

<div id="dayEndBox" class="card hidden"></div>

<div id="reportBox" class="card hidden"></div>

<div id="historyBox" class="card hidden"></div>

</div>

<script>
/* ------------------ STORAGE ------------------ */
const STATE="STATE"; // LOGGED_IN, BIO_BREAK, DAY_END_PENDING, DAY_ENDED
const CURRENT="CURRENT_TASKS";
const NEXT="NEXT_TASKS";
const SESSIONS="SESSIONS";
const REPORTS="REPORTS";

/* ------------------ TIME ------------------ */
function now(){return new Date();}
function mins(a,b){return Math.round((b-a)/60000);}

/* ------------------ LOGIN ------------------ */
function login(){
  const id=prompt("Enter ID");
  const pw=prompt("Enter Password");
  if(!id||!pw) return;

  if(localStorage.getItem(STATE)==="DAY_ENDED"){
    const next=localStorage.getItem(NEXT);
    if(next){
      localStorage.setItem(CURRENT,next);
      localStorage.removeItem(NEXT);
    }
    localStorage.removeItem(STATE);
  }

  startSession();
  localStorage.setItem(STATE,"LOGGED_IN");
  statusText.innerText="Status: Logged in";
  tasksBox.classList.remove("hidden");
  quoteBox.classList.remove("hidden");
  loadTasks();
}

/* ------------------ LOGOUT (BIO BREAK) ------------------ */
function logout(){
  endSession();
  localStorage.setItem(STATE,"BIO_BREAK");
  statusText.innerText="Status: Bio Break";
  tasksBox.classList.add("hidden");
  dayEndBox.classList.add("hidden");
}

/* ------------------ SESSION ------------------ */
function startSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  s.push({start:now().toISOString(),end:null});
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}
function endSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  for(let i=s.length-1;i>=0;i--){
    if(!s[i].end){s[i].end=now().toISOString();break;}
  }
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}

/* ------------------ TASKS ------------------ */
function loadTasks(){
  const list=document.getElementById("taskList");
  list.innerHTML="";
  const data=JSON.parse(localStorage.getItem(CURRENT)||"[]");
  if(!data.length){list.innerText="No tasks assigned.";return;}

  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task done?")){
        t.done=true;
        localStorage.setItem(CURRENT,JSON.stringify(data));
      }else cb.checked=false;
    };
    const div=document.createElement("div");
    div.className="task";
    div.appendChild(cb);
    div.append(" "+t.name);
    list.appendChild(div);
  });

  const btn=document.createElement("button");
  btn.textContent="Day End";
  btn.onclick=startDayEnd;
  list.appendChild(btn);
}

/* ------------------ DAY END ------------------ */
function startDayEnd(){
  if(localStorage.getItem(STATE)!=="LOGGED_IN") return;
  localStorage.setItem(STATE,"DAY_END_PENDING");

  let html="<h3>Confirm Day End</h3>";
  html+="Next day subjects (1–7):<br>";
  for(let i=0;i<7;i++){
    html+=`<input id="s${i}" placeholder="Subject ${i+1}"><br>`;
  }
  html+=`<br>Distraction time (minutes):<br>
         <input id="dist" type="number" min="0"><br><br>
         <button class="warn" onclick="confirmDayEnd()">Confirm Day End</button>`;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
}

/* ------------------ CONFIRM DAY END ------------------ */
function confirmDayEnd(){
  if(localStorage.getItem(STATE)!=="DAY_END_PENDING") return;

  let next=[];
  const cur=JSON.parse(localStorage.getItem(CURRENT)||"[]");
  cur.filter(t=>!t.done).forEach(t=>next.push({name:t.name,done:false}));

  for(let i=0;i<7;i++){
    const v=document.getElementById("s"+i).value.trim();
    if(v) next.push({name:v,done:false});
  }

  localStorage.setItem(NEXT,JSON.stringify(next));
  generateReport();
  localStorage.setItem(STATE,"DAY_ENDED");
  tasksBox.classList.add("hidden");
  dayEndBox.classList.add("hidden");
  reportBox.classList.remove("hidden");
  logout();
}

/* ------------------ REPORT ------------------ */
function generateReport(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  let total=0;
  s.forEach(x=>{
    if(x.start&&x.end) total+=mins(new Date(x.start),new Date(x.end));
  });

  const dist=Number(document.getElementById("dist").value||0);
  const prod=Math.max(total-dist,0);
  const pct=total?Math.round(prod/total*100):0;

  let status="Poor";
  if(pct>=80) status="Excellent";
  else if(pct>=60) status="Good";
  else if(pct>=40) status="Average";

  const rep={date:new Date().toLocaleDateString(),total,prod,dist,pct,status};
  const all=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  all.push(rep);
  localStorage.setItem(REPORTS,JSON.stringify(all));

  reportBox.innerHTML=`
    <h3>Report Card</h3>
    Total Time: ${total} min<br>
    Productive: ${prod} min<br>
    Distraction: ${dist} min<br>
    Productivity: ${pct}%
    <div class="progress"><div class="bar" style="width:${pct}%">${pct}%</div></div>
    <b>Status: ${status}</b>
  `;
}

/* ------------------ HISTORY ------------------ */
function showHistory(){
  const box=document.getElementById("historyBox");
  box.innerHTML="<h3>History</h3>";
  const data=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  data.forEach(r=>{
    box.innerHTML+=`
      <div class="historyItem">
        <b>${r.date}</b><br>
        Productivity: ${r.pct}% (${r.status})
      </div>`;
  });
  box.classList.remove("hidden");
}

/* ------------------ MOTIVATION IMAGES ------------------ */
let imgIndex=1;
setInterval(()=>{
  if(localStorage.getItem(STATE)==="LOGGED_IN"){
    quoteBox.innerHTML=`<img src="${imgIndex}.png">`;
    imgIndex++; if(imgIndex>30) imgIndex=1;
  }
},60000);
</script>
</body>
</html>
