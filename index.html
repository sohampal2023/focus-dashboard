<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  height:100%;
  font-family:Segoe UI,system-ui,sans-serif
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  background:#020617
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer
}
.nav button:hover{
  border-color:#38bdf8
}
.main{
  padding:25px;
  overflow:auto
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px
}
.hidden{
  display:none
}
.task{
  display:flex;
  gap:10px;
  margin:8px 0
}
.progress{
  height:18px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #1e293b
}
.bar{
  height:100%;
  font-size:11px;
  font-weight:700;
  text-align:center
}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
.history-item{
  padding:12px;
  border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;
  margin-bottom:10px
}
.admin-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}
.admin-row button{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
  cursor:pointer
}
.admin-row button.terminate{
  border-color:#ef4444;
  color:#ef4444
}
.admin-row button.approve{
  border-color:#22c55e;
  color:#22c55e
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
    <button id="adminBtn" class="hidden" onclick="openAdmin()">Admin Panel</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>
  <div id="adminBox" class="card hidden"></div>
</div>

</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a",
  storageBucket: "focus-dashboard-5965a.firebasestorage.app",
  messagingSenderId: "337204334808",
  appId: "1:337204334808:web:9d0d36bed2fbae9b8147ad"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= ROLES ================= */
const ADMIN_EMAIL = "admin@study.com";

let CURRENT_UID = null;
let CURRENT_EMAIL = null;

/* ================= DOM ================= */
const status = document.getElementById("status");
const tasksBox = document.getElementById("tasksBox");
const taskList = document.getElementById("taskList");
const dayEndBox = document.getElementById("dayEndBox");
const reportBox = document.getElementById("reportBox");
const historyBox = document.getElementById("historyBox");
const adminBox = document.getElementById("adminBox");
const adminBtn = document.getElementById("adminBtn");

/* ================= STORAGE KEYS ================= */
const DAY_STATUS = "DAY_STATUS";
const CURRENT_TASKS = "CURRENT_TASKS";
const NEXT_TASKS = "NEXT_TASKS";
const SESSIONS = "SESSIONS";
const REPORTS = "REPORTS";

/* ================= HELPERS ================= */
const ukey = k => `${CURRENT_UID}_${k}`;
const now = () => new Date();
const stamp = () => new Date().toLocaleTimeString([],{
  hour:"2-digit",minute:"2-digit"
});
const mins = (a,b) => Math.round((b-a)/60000);

/* ================= NEW DAY LOGIC ================= */
function startNewDayIfNeeded(){
  const s = localStorage.getItem(ukey(DAY_STATUS));
  if(s === "CLOSED"){
    const n = JSON.parse(localStorage.getItem(ukey(NEXT_TASKS)) || "[]");
    localStorage.setItem(ukey(CURRENT_TASKS),JSON.stringify(n));
    localStorage.removeItem(ukey(NEXT_TASKS));
    localStorage.setItem(ukey(DAY_STATUS),"ACTIVE");
  }
}

/* ================= LOGIN ================= */
window.login = async ()=>{
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;

  const cred = await signInWithEmailAndPassword(auth,email,pass);
  CURRENT_UID = cred.user.uid;
  CURRENT_EMAIL = email;

  const snap = await getDoc(doc(db,"users",CURRENT_UID));
  if(snap.exists() && snap.data().blocked === true){
    alert("Your account is blocked by admin.");
    await signOut(auth);
    return;
  }

  if(email === ADMIN_EMAIL){
    adminBtn.classList.remove("hidden");
  }

  status.innerText = "Status: Logged in @ " + stamp();
};

/* ================= ADMIN PANEL ================= */
window.openAdmin = async ()=>{
  if(CURRENT_EMAIL !== ADMIN_EMAIL) return;

  adminBox.classList.remove("hidden");
  adminBox.innerHTML = "<h3>Admin Panel – User Control</h3>";

  const snap = await getDocs(collection(db,"users"));

  snap.forEach(d=>{
    const u = d.data();
    if(u.email === ADMIN_EMAIL) return;

    const row = document.createElement("div");
    row.className = "history-item admin-row";

    const label = document.createElement("div");
    label.innerText = `${u.email} — ${u.blocked ? "BLOCKED" : "ACTIVE"}`;

    const okBtn = document.createElement("button");
    okBtn.innerText = "OK";
    okBtn.className = "approve";
    okBtn.onclick = async ()=>{
      await updateDoc(doc(db,"users",d.id),{ blocked:false });
      openAdmin();
    };

    const termBtn = document.createElement("button");
    termBtn.innerText = "Terminate";
    termBtn.className = "terminate";
    termBtn.onclick = async ()=>{
      await updateDoc(doc(db,"users",d.id),{ blocked:true });
      openAdmin();
    };

    row.append(label, okBtn, termBtn);
    adminBox.appendChild(row);
  });
};

/* ================= BIO BREAK ================= */
window.bioBreak = async ()=>{
  await signOut(auth);
  status.innerText = "Status: Bio Break @ " + stamp();
  tasksBox.classList.add("hidden");
};
</script>
</body>
</html>
