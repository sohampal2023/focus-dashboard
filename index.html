<!DOCTYPE html>
<html>
<head>
<title>Focus Dashboard</title>

<style>
body { font-family: Arial; background:#f4f6f9; }
.container {
  max-width: 820px;
  margin: 30px auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}
button {
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  background: #4a90e2;
  color: white;
  cursor: pointer;
  margin-right: 6px;
}
button:hover { background:#357ac9; }
.progress {
  width:100%; background:#ddd; border-radius:10px; overflow:hidden;
}
.bar {
  height:20px; background:#4caf50; color:white; text-align:center;
}
.hidden { display:none; }
.report { background:#eef6ff; padding:15px; border-radius:6px; }
</style>
</head>

<body onload="init()">

<div class="container">
<h1>Focus Dashboard</h1>

<p id="status">Status: Logged out</p>

<button onclick="login()">Login</button>
<button onclick="logout()">Bio Break</button>
<button onclick="dayEnd()">Day End</button>

<hr>

<div id="taskSection" class="hidden">
<h3>Assigned Tasks</h3>
<div id="taskList"></div>
</div>

<div id="reportSection" class="hidden">
<h3>Daily Report</h3>
<div id="reportContent"></div>
</div>

</div>

<script>
/* ========= STATE ========= */
const STATE_KEY = "APP_STATE";
const LOGGED_OUT = "LOGGED_OUT";
const LOGGED_IN = "LOGGED_IN";
const DAY_ENDED = "DAY_ENDED";

/* ========= DATA ========= */
const TASKS = "TASKS";
const REPORT = "REPORT";

/* ========= INIT ========= */
function init() {
  if (!localStorage.getItem(STATE_KEY))
    localStorage.setItem(STATE_KEY, LOGGED_OUT);
  render();
}

/* ========= LOGIN ========= */
function login() {
  const id = prompt("Enter ID");
  const pass = prompt("Enter Password");
  if (!id || !pass) return;

  const state = localStorage.getItem(STATE_KEY);

  if (state === DAY_ENDED) {
    // New day starts
    localStorage.removeItem(REPORT);
  }

  localStorage.setItem(STATE_KEY, LOGGED_IN);
  render();
}

/* ========= LOGOUT ========= */
function logout() {
  localStorage.setItem(STATE_KEY, LOGGED_OUT);
  render();
}

/* ========= DAY END ========= */
function dayEnd() {
  if (localStorage.getItem(STATE_KEY) !== LOGGED_IN) {
    alert("Login first");
    return;
  }

  const tasks = JSON.parse(localStorage.getItem(TASKS) || "[]");
  const done = tasks.filter(t => t.done).length;
  const pct = tasks.length ? Math.round((done/tasks.length)*100) : 0;

  localStorage.setItem(REPORT, JSON.stringify({
    tasks: tasks.length,
    done,
    pct
  }));

  localStorage.setItem(STATE_KEY, DAY_ENDED);
  render();
}

/* ========= RENDER ========= */
function render() {
  const state = localStorage.getItem(STATE_KEY);

  document.getElementById("taskSection").classList.add("hidden");
  document.getElementById("reportSection").classList.add("hidden");

  if (state === LOGGED_OUT) {
    document.getElementById("status").innerText = "Status: Bio Break";
  }

  if (state === LOGGED_IN) {
    document.getElementById("status").innerText = "Status: Working";
    showTasks();
  }

  if (state === DAY_ENDED) {
    document.getElementById("status").innerText = "Status: Day Ended";
    showReport();
  }
}

/* ========= TASKS ========= */
function showTasks() {
  document.getElementById("taskSection").classList.remove("hidden");
  const box = document.getElementById("taskList");
  box.innerHTML = "";

  let tasks = JSON.parse(localStorage.getItem(TASKS));
  if (!tasks) {
    tasks = [
      {name:"Subject 1", done:false},
      {name:"Subject 2", done:false}
    ];
    localStorage.setItem(TASKS, JSON.stringify(tasks));
  }

  tasks.forEach(t=>{
    const cb = document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      t.done=true;
      localStorage.setItem(TASKS, JSON.stringify(tasks));
    };
    box.appendChild(cb);
    box.append(" "+t.name);
    box.appendChild(document.createElement("br"));
  });
}

/* ========= REPORT ========= */
function showReport() {
  document.getElementById("reportSection").classList.remove("hidden");
  const r = JSON.parse(localStorage.getItem(REPORT));
  if (!r) return;

  document.getElementById("reportContent").innerHTML = `
    Tasks Done: ${r.done}/${r.tasks}<br>
    Completion: ${r.pct}%
    <div class="progress">
      <div class="bar" style="width:${r.pct}%">${r.pct}%</div>
    </div>
  `;
}
</script>

</body>
</html>
