<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus System</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:#020617;color:#e5e7eb}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{padding:20px;border-right:1px solid #1e293b}
.sidebar h2{text-align:center;color:#7dd3fc;margin-bottom:12px}
.status{padding:10px;border:1px solid #334155;border-radius:10px;text-align:center;margin-bottom:10px}
button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:10px;border:1px solid #334155;
  background:#020617;color:#e5e7eb;cursor:pointer
}
button:disabled{opacity:.4}

/* IDLE */
.idleBox{
  padding:12px;border:1px solid #38bdf8;
  border-radius:12px;text-align:center;
  margin-bottom:12px;background:#020617
}

/* MAIN */
.main{padding:24px;overflow:auto}
.card{
  background:#020617;border:1px solid #334155;
  border-radius:14px;padding:20px;margin-bottom:20px
}
.hidden{display:none}

/* INPUT */
.nextInput{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb;
}

/* SPEEDOMETER */
.speedo{
  width:300px;height:150px;border-radius:300px 300px 0 0;
  background:conic-gradient(from -90deg,
    #7f1d1d,#92400e,#a16207,#14532d,#312e81);
  position:relative;
  box-shadow:inset 0 0 0 14px #020617,inset 0 0 0 18px #1e293b
}
.needle{
  position:absolute;width:4px;height:110px;
  background:#e5e7eb;left:50%;bottom:0;
  transform-origin:bottom center;transform:rotate(-90deg);
  transition:.6s cubic-bezier(.15,.85,.2,1)
}
.cap{
  position:absolute;width:14px;height:14px;background:#e5e7eb;
  border-radius:50%;left:50%;bottom:0;
  transform:translate(-50%,50%)
}

.percent{text-align:center;font-size:36px;font-weight:800;color:#7dd3fc}
.rating{text-align:center;font-size:18px;font-weight:700}
.details{text-align:center;font-size:14px;color:#cbd5f5}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #334155;padding:6px;text-align:center}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="statusBox" class="status">Logged out</div>

  <div id="idleBox" class="idleBox hidden">
    Idle Time Left:
    <b><span id="idleTime">30:00</span></b><br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
  <button id="dayBtn" onclick="openDayEnd()" disabled>Day End</button>
</div>

<div class="main">

<div id="taskBox" class="card hidden">
  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">

    <div>
      <h3>Assigned Tasks</h3>
      <div id="taskList"></div>
      <hr>
      <h4>Extra Work</h4>
      <div id="extraList"></div>
      <button onclick="addExtra()">+ Add Extra Work</button>
    </div>

    <div>
      <h3 style="text-align:center">Live Progress</h3>
      <div class="speedo">
        <div id="needle" class="needle"></div>
        <div class="cap"></div>
      </div>
      <div id="livePercent" class="percent">0%</div>
      <div id="liveRating" class="rating">Poor</div>
      <div id="liveDetails" class="details"></div>
    </div>

  </div>
</div>

<div id="logBox" class="card hidden">
  <h3>Login / Logout Log</h3>
  <table>
    <thead>
      <tr><th>Login</th><th>Logout</th><th>Reason</th></tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<div id="nextDayBox" class="card hidden">
  <h3>Enter Next Day Tasks</h3>
  <div id="nextInputs"></div>
  <button onclick="finalDayEnd()">Submit</button>
</div>

<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
let UID = null;
let idleTimer = null;
let targetTime = null;
let penalty = 0;
let idleStrikes = 0; 

const now = () => new Date().toLocaleString();
const key = k => UID + "_" + k;

/* 🔒 IDLE TIMER – DYNAMIC DURATION */
function startIdle(customSeconds = 1800) {
  clearInterval(idleTimer);
  targetTime = Date.now() + (customSeconds * 1000);
  
  idleBox.classList.remove("hidden");
  updateIdle();

  idleTimer = setInterval(() => {
    const current = Date.now();
    const remainingSeconds = Math.ceil((targetTime - current) / 1000);

    updateIdle(remainingSeconds);

    if (remainingSeconds <= 0) {
      autoLogout();
    }
  }, 1000);
}

function updateIdle(seconds) {
  if (seconds === undefined && targetTime) {
      seconds = Math.ceil((targetTime - Date.now()) / 1000);
  }
  let displaySeconds = seconds > 0 ? seconds : 0;
  
  const h = Math.floor(displaySeconds / 3600);
  const m = Math.floor((displaySeconds % 3600) / 60);
  const s = displaySeconds % 60;

  if(h > 0) {
    idleTime.innerText = `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  } else {
    idleTime.innerText = `${m}:${String(s).padStart(2,"0")}`;
  }
}

/* LOGOUTS & PENALTY LOGIC (FIXED) */
function autoLogout() {
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");

  // 1. READ latest strikes from Storage (Fixes the sync issue)
  let currentStrikes = parseInt(localStorage.getItem(key("IDLE_STRIKES")) || "0");
  
  // 2. Increment
  currentStrikes++;
  
  // 3. Check Logic
  if(currentStrikes >= 2) {
    // Apply Penalty
    let currentPenalty = parseInt(localStorage.getItem(key("PENALTY")) || "0");
    currentPenalty += 10;
    localStorage.setItem(key("PENALTY"), currentPenalty);
    
    // Reset Strikes after penalty
    currentStrikes = 0; 
    alert("⚠ 2 Consecutive Idle Timeouts! -10% Penalty Applied.");
  }
  
  // 4. Save Updates
  localStorage.setItem(key("IDLE_STRIKES"), currentStrikes);

  // 5. Log the Logout
  const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");
  if (logs.length) {
    const last = logs[logs.length - 1];
    last.logout = now();
    last.logoutTS = Date.now();
    last.reason = "Timeout";
    localStorage.setItem(key("LOGS"), JSON.stringify(logs));
  }
  
  location.reload();
}

function bioBreak() {
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");
  
  // Bio Break resets the streak
  localStorage.setItem(key("IDLE_STRIKES"), "0");

  const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");
  if (logs.length) {
    const last = logs[logs.length - 1];
    last.logout = now();
    last.logoutTS = Date.now();
    last.reason = "Pending";
    localStorage.setItem(key("LOGS"), JSON.stringify(logs));
  }
  location.reload();
}

/* LOGIN */
function login() {
  UID = prompt("Email");
  if (!UID) return;

  const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");

  // LOAD DATA FROM STORAGE
  idleStrikes = parseInt(localStorage.getItem(key("IDLE_STRIKES")) || "0");
  penalty = parseInt(localStorage.getItem(key("PENALTY")) || "0");

  // Update UI
  updateStrikeDisplay();

  // Handle Previous Break
  if (logs.length) {
    const lastLog = logs[logs.length - 1];
    if (lastLog.reason === "Pending") {
      const userReason = prompt("Reason for previous break?", "Bio Break");
      lastLog.reason = userReason || "Bio Break";
    }
  }

  localStorage.removeItem(key("DAY_ENDED"));

  logs.push({ 
    login: now(), 
    loginTS: Date.now(),
    logout: "-", 
    logoutTS: null,
    reason: "-", 
    completed: [] 
  });
  localStorage.setItem(key("LOGS"), JSON.stringify(logs));

  statusBox.innerText = "Logged in";
  loginBtn.disabled = true;
  bioBtn.disabled = false;
  dayBtn.disabled = false;

  // CHECK TEST STATE
  const activeTest = JSON.parse(localStorage.getItem(key("TEST_STATE")));
  if (activeTest) {
    if (confirm(`Resume Mock Test: ${activeTest.name}?`)) {
      restoreTestUI(activeTest);
      
      const elapsed = (Date.now() - activeTest.startTime) / 1000;
      const totalDuration = activeTest.durationMins * 60;
      const remaining = totalDuration - elapsed;

      if(remaining > 0) {
        startIdle(remaining);
      } else {
        startIdle(1);
      }
      
      loadTasks(); 
      renderLogs();
      updateProgress();
      return; 
    } else {
      finishTestSequence(activeTest);
    }
  }

  startIdle(); 
  setupTasks();
  loadTasks();
  renderLogs();
  updateProgress();
}

function updateStrikeDisplay() {
  let box = document.getElementById("idleStrikeBox");
  if(!box) {
    box = document.createElement("div");
    box.id = "idleStrikeBox";
    box.className = "status";
    statusBox.parentNode.insertBefore(box, statusBox.nextSibling);
  }
  
  box.innerText = `Idle Strikes: ${idleStrikes}`;
  
  // Visual Feedback (Red if strike exists)
  if(idleStrikes > 0) {
      box.style.borderColor = "#f87171";
      box.style.color = "#f87171";
      box.style.background = "rgba(248, 113, 113, 0.1)";
  } else {
      // Default style
      box.style.borderColor = "#334155";
      box.style.color = "#e5e7eb";
      box.style.background = "transparent";
  }
}

/* --- MOCK TEST LOGIC --- */

function startMockTestSetup() {
  const name = prompt("Enter Test Name:");
  if(!name) return;
  const fullMarks = prompt("Enter Full Marks:");
  if(!fullMarks) return;
  
  const durationInput = prompt("Enter Duration in MINUTES (e.g. 120):");
  const durationMins = parseInt(durationInput);
  
  if(!durationMins || isNaN(durationMins)) {
    alert("Invalid Time. Test Cancelled.");
    return;
  }

  const testState = {
    name: name,
    fullMarks: fullMarks,
    durationMins: durationMins,
    startTime: Date.now()
  };
  localStorage.setItem(key("TEST_STATE"), JSON.stringify(testState));

  startIdle(durationMins * 60);

  restoreTestUI(testState);
}

function restoreTestUI(testState) {
  taskBox.classList.remove("hidden");
  const container = document.getElementById("taskBox");
  
  const hrs = Math.floor(testState.durationMins / 60);
  const mins = testState.durationMins % 60;
  
  container.innerHTML = `
    <div style="text-align:center; padding: 20px; border: 1px solid #facc15; border-radius: 10px;">
      <h2 style="color:#facc15">MOCK TEST RUNNING</h2>
      <h3 style="color:white">${testState.name}</h3>
      <p>Full Marks: ${testState.fullMarks} | Duration: ${hrs}h ${mins}m</p>
      <div style="margin-top:10px; color:#cbd5e1; font-size:14px;">
         Idle Timer set to Exam Duration. Do not close tab.
      </div>
      <hr style="border-color:#334155; margin: 20px 0;">
      <button onclick="triggerEndTest()" style="background:#dc2626; border:none; padding:15px; font-size:18px; font-weight:bold;">EXAM DONE</button>
    </div>
  `;
}

function triggerEndTest() {
  const testState = JSON.parse(localStorage.getItem(key("TEST_STATE")));
  if(testState) finishTestSequence(testState);
}

function finishTestSequence(testState) {
  const obtained = prompt(`Exam Done: ${testState.name}\nEnter Marks Obtained (out of ${testState.fullMarks}):`);
  if(obtained === null) return; 
  
  const accuracy = prompt("Enter Accuracy %:");
  if(accuracy === null) return;

  const msg = `Please Confirm Details:\n\nTest: ${testState.name}\nScore: ${obtained} / ${testState.fullMarks}\nAccuracy: ${accuracy}%`;
  
  if(confirm(msg)) {
    const extras = JSON.parse(localStorage.getItem(key("EXTRA")) || "[]");
    const resultComment = `Score: ${obtained}/${testState.fullMarks} | Acc: ${accuracy}%`;
    
    extras.push({
      name: `MOCK TEST: ${testState.name}`,
      done: true,
      comment: resultComment,
      due: "None"
    });
    localStorage.setItem(key("EXTRA"), JSON.stringify(extras));
    
    const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");
    if(logs.length){
      const active = logs[logs.length-1];
      if(!active.completed) active.completed = [];
      active.completed.push({
        name: `MOCK TEST: ${testState.name}`,
        comment: resultComment,
        due: "None"
      });
      localStorage.setItem(key("LOGS"), JSON.stringify(logs));
    }

    localStorage.removeItem(key("TEST_STATE"));
    startIdle(1800);
    location.reload(); 
  }
}

/* --- STANDARD TASK SYSTEM --- */

function setupTasks() {
  const carried = JSON.parse(localStorage.getItem(key("TASKS")) || "[]");
  const next = JSON.parse(localStorage.getItem(key("NEXT_TASKS")) || "[]");

  let merged = [...carried, ...next.map(n => ({ name: n, done: false, comment: "", due: "" }))];
  if (!merged.length) {
    merged = [
      { name: "Study", done: false, comment: "", due: "" },
      { name: "Revise", done: false, comment: "", due: "" },
      { name: "Practice", done: false, comment: "", due: "" }
    ];
  }

  localStorage.setItem(key("TASKS"), JSON.stringify(merged));
  localStorage.removeItem(key("NEXT_TASKS"));
  
  taskBox.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">
      <div>
        <h3>Assigned Tasks</h3>
        <div style="margin-bottom:15px; padding:10px; border:1px dashed #facc15; border-radius:8px; text-align:center">
             <button onclick="startMockTestSetup()" style="background:#a16207; width:auto; padding:8px 20px;">Start Mock Test</button>
        </div>
        <div id="taskList"></div>
        <hr>
        <h4>Extra Work</h4>
        <div id="extraList"></div>
        <button onclick="addExtra()">+ Add Extra Work</button>
      </div>
      <div>
        <h3 style="text-align:center">Live Progress</h3>
        <div class="speedo">
          <div id="needle" class="needle"></div>
          <div class="cap"></div>
        </div>
        <div id="livePercent" class="percent">0%</div>
        <div id="liveRating" class="rating">Poor</div>
        <div id="liveDetails" class="details"></div>
      </div>
    </div>
  `;

  taskBox.classList.remove("hidden");
  logBox.classList.remove("hidden");
  reportBox.classList.add("hidden");
}

function loadTasks() {
  const tList = document.getElementById("taskList");
  const eList = document.getElementById("extraList");
  if(!tList || !eList) return; 

  tList.innerHTML = "";
  eList.innerHTML = "";
  
  const tasks = JSON.parse(localStorage.getItem(key("TASKS")) || "[]");
  const extras = JSON.parse(localStorage.getItem(key("EXTRA")) || "[]");

  const updateLogTask = (name, isChecked, comment, due) => {
    const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");
    if(logs.length){
      const active = logs[logs.length-1];
      if(!active.completed) active.completed = [];
      if(isChecked){
        active.completed = active.completed.filter(i => (typeof i === 'string' ? i : i.name) !== name);
        active.completed.push({ name: name, comment: comment, due: due });
      } else {
        active.completed = active.completed.filter(i => (typeof i === 'string' ? i : i.name) !== name);
      }
      localStorage.setItem(key("LOGS"), JSON.stringify(logs));
      renderLogs();
    }
  };

  tasks.forEach(t => {
    const container = document.createElement("div");
    container.style.marginBottom = "4px";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    const label = document.createElement("span");
    const updateLabel = () => {
       if(t.done){
           label.innerHTML = ` ${t.name} <span style="font-size:12px;color:#94a3b8">[C: ${t.comment} | Due: ${t.due}]</span>`;
       } else {
           label.innerText = " " + t.name;
       }
    };
    updateLabel();
    cb.onchange = () => {
      if (!confirm("Confirm task completion?")) { cb.checked = !cb.checked; return; }
      if(cb.checked){
        const remark = prompt(`Comment for ${t.name}?`, "Done");
        const dueVal = prompt(`Any pending work/marks left for ${t.name}?`, "None");
        t.comment = remark || "-";
        t.due = dueVal || "-";
      } else { t.comment = ""; t.due = ""; }
      t.done = cb.checked;
      updateLabel();
      updateLogTask(t.name, t.done, t.comment, t.due);
      save(tasks, extras);
    };
    container.append(cb, label);
    tList.append(container);
  });

  extras.forEach(e => {
    const container = document.createElement("div");
    container.style.marginBottom = "4px";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = e.done;
    if(e.name.startsWith("MOCK TEST:")) { cb.disabled = true; }
    const label = document.createElement("span");
    const updateLabel = () => {
       if(e.done){
           label.innerHTML = ` ${e.name} <span style="font-size:12px;color:#94a3b8">[${e.comment}]</span>`;
       } else {
           label.innerText = " " + e.name;
       }
    };
    updateLabel();
    cb.onchange = () => {
      if (!confirm("Confirm extra work completion?")) { cb.checked = !cb.checked; return; }
      if(cb.checked){
        const remark = prompt(`Comment for ${e.name}?`, "Done");
        const dueVal = prompt(`Any pending work/marks left for ${e.name}?`, "None");
        e.comment = remark || "-";
        e.due = dueVal || "-";
      } else { e.comment = ""; e.due = ""; }
      e.done = cb.checked;
      updateLabel();
      updateLogTask(e.name + " (Extra)", e.done, e.comment, e.due);
      save(tasks, extras);
    };
    container.append(cb, label);
    eList.append(container);
  });
}

function addExtra() {
  const name = prompt("Extra work?");
  if (!name) return;
  const extras = JSON.parse(localStorage.getItem(key("EXTRA")) || "[]");
  extras.push({ name, done: false, comment: "", due: "" });
  localStorage.setItem(key("EXTRA"), JSON.stringify(extras));
  loadTasks();
}

function save(tasks, extras) {
  localStorage.setItem(key("TASKS"), JSON.stringify(tasks));
  localStorage.setItem(key("EXTRA"), JSON.stringify(extras));
  updateProgress();
}

/* PROGRESS */
function calculate() {
  const tasks = JSON.parse(localStorage.getItem(key("TASKS")) || "[]");
  const extras = JSON.parse(localStorage.getItem(key("EXTRA")) || "[]");
  const done = tasks.filter(t => t.done).length +
    extras.filter(e => e.done).length;
  const percent = tasks.length ?
    Math.max(0, Math.round((done / tasks.length) * 100 - penalty)) : 0;
  return { percent, assigned: tasks.length, extra: extras.length };
}

function updateProgress() {
  const needle = document.getElementById("needle");
  if(!needle) return;
  const p = calculate();
  needle.style.transform =
    `rotate(${(Math.min(p.percent, 300) / 300) * 180 - 90}deg)`;
  livePercent.innerText = p.percent + "%";
  liveRating.innerText = getLabel(p.percent);
  liveDetails.innerText =
    `Assigned: ${p.assigned} | Extra: ${p.extra} | Penalty: -${penalty}%`;
}

function getLabel(p) {
  if (p < 40) return "Poor";
  if (p < 60) return "Average";
  if (p < 80) return "Good";
  if (p <= 100) return "Excellent";
  return "Fabulous";
}

/* DAY END */
function openDayEnd() {
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");

  nextInputs.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    nextInputs.innerHTML +=
      `<input class="nextInput" id="nd${i}" placeholder="Next Day Task ${i + 1}">`;
  }
  nextDayBox.classList.remove("hidden");
}

function finalDayEnd() {
  const next = [];
  for (let i = 0; i < 7; i++) {
    const el = document.getElementById("nd" + i);
    if(el && el.value.trim()) next.push(el.value.trim());
  }
  localStorage.setItem(key("NEXT_TASKS"), JSON.stringify(next));

  const p = calculate();
  const tasks = JSON.parse(localStorage.getItem(key("TASKS")) || "[]");
  const extras = JSON.parse(localStorage.getItem(key("EXTRA")) || "[]");
  const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");
  const carry = tasks.filter(t => !t.done);

  let totalMillis = 0;
  logs.forEach(l => {
    let end = l.logoutTS;
    if(!end) end = Date.now();
    if(l.loginTS) totalMillis += (end - l.loginTS);
  });
  const totalMin = Math.floor(totalMillis / 60000);
  const hrs = Math.floor(totalMin / 60);
  const mins = totalMin % 60;
  const timeStr = `${hrs} hr ${mins} min`;

  const doneTasks = tasks.filter(t => t.done).map(t => ({name: t.name, comment: t.comment, due: t.due}));
  const doneExtras = extras.filter(e => e.done).map(e => ({name: e.name + " (Extra)", comment: e.comment, due: e.due}));
  const allDone = [...doneTasks, ...doneExtras];

  let doneTable = "";
  if(allDone.length > 0){
    doneTable = `
    <h4 style="margin-top:20px;text-align:left;border-top:1px solid #334155;padding-top:10px">Work Done Report</h4>
    <table>
        <thead>
            <tr>
                <th style="width:40%">Task</th>
                <th style="width:30%">Comment</th>
                <th style="width:30%">Due</th>
            </tr>
        </thead>
        <tbody>
            ${allDone.map(d => `
                <tr>
                    <td style="color:#86efac">${d.name}</td>
                    <td>${d.comment}</td>
                    <td style="color:#fca5a5">${d.due}</td>
                </tr>
            `).join("")}
        </tbody>
    </table>`;
  } else {
    doneTable = `<div style="margin-top:20px;color:#fca5a5">No work completed.</div>`;
  }

  localStorage.setItem(key("TASKS"), JSON.stringify(carry));
  localStorage.setItem(key("EXTRA"), JSON.stringify([]));
  localStorage.removeItem(key("LOGS"));
  localStorage.removeItem(key("TEST_STATE"));
  
  // RESET IDLE & PENALTY
  localStorage.setItem(key("IDLE_STRIKES"), "0");
  localStorage.setItem(key("PENALTY"), "0");
  
  const tableRef = document.getElementById("logTable");
  if(tableRef) tableRef.innerHTML = "";

  reportBox.innerHTML = `
    <h3>Daily Report</h3>
    <div class="percent">${p.percent}%</div>
    <div class="rating">${getLabel(p.percent)}</div>
    <div style="font-size:20px;color:#facc15;margin:10px 0;font-weight:bold">
      Total Study Time: ${timeStr}
    </div>
    <div class="details">
      Assigned: ${tasks.length} |
      Carry Forward: ${carry.length} |
      Penalty: -${penalty}%
    </div>
    ${doneTable}`;
    
  reportBox.classList.remove("hidden");
  if(taskBox) taskBox.classList.add("hidden");
  logBox.classList.add("hidden");
  nextDayBox.classList.add("hidden");

  statusBox.innerText = "Day End – Thank you";
  loginBtn.disabled = false;
  bioBtn.disabled = true;
  dayBtn.disabled = true;
}

/* LOG TABLE */
function renderLogs() {
  const logs = JSON.parse(localStorage.getItem(key("LOGS")) || "[]");
  const table = document.querySelector("table");
  if(!table) return;

  table.innerHTML = `
    <thead>
      <tr>
        <th>Login</th>
        <th>Logout</th>
        <th>Reason</th>
        <th style="width:40%">Work Ticked</th>
      </tr>
    </thead>
    <tbody id="logTable"></tbody> 
  `;
  const tbody = document.getElementById("logTable");
  tbody.innerHTML = "";

  logs.forEach(l => {
    let workHtml = "-";
    if (l.completed && l.completed.length) {
      workHtml = l.completed.map(item => {
        if(typeof item === 'string'){ return `<div>${item}</div>`; }
        return `
        <div style="border-bottom:1px dashed #334155; padding:4px 0;">
            <div style="color:#86efac;font-weight:bold">${item.name}</div>
            <div style="font-size:12px;color:#cbd5e1">
               ${item.comment} | Due: <span style="color:#fca5a5">${item.due}</span>
            </div>
        </div>`;
      }).join("");
    }
    tbody.innerHTML += `
      <tr>
        <td style="vertical-align:top">${l.login}</td>
        <td style="vertical-align:top">${l.logout}</td>
        <td style="vertical-align:top">${l.reason}</td>
        <td style="text-align:left;vertical-align:top">${workHtml}</td>
      </tr>`;
  });
}
</script>
</body>
</html>
