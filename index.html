<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  font-size:18px;
  line-height:1.6;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{display:flex;gap:10px;margin:8px 0}
.progress{
  height:18px;border-radius:10px;overflow:hidden;
  border:1px solid #1e293b;margin:6px 0 12px;
}
.bar{height:100%;font-size:11px;font-weight:700;text-align:center}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
.history-item{
  padding:12px;border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;margin-bottom:10px;
}

/* ===== POPUP ===== */
#focusOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
#focusOverlay.hidden{display:none}
.focusBox{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:18px;
  padding:30px;
  width:380px;
  text-align:center;
}
.focusBtns{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:20px 0;
}
.focusBtns button{
  padding:14px 18px;
  border-radius:12px;
  font-weight:700;
  border:none;
  cursor:pointer;
}
.focusBtns .yes{background:#22c55e;color:#000}
.focusBtns .no{background:#ef4444;color:#fff}
</style>
</head>

<body>

<div id="focusOverlay" class="hidden">
  <div class="focusBox">
    <h2>Focus Check</h2>
    <p>Are you studying or watching reels?</p>
    <div class="focusBtns">
      <button id="btnStudy" class="yes">I am studying</button>
      <button id="btnDistract" class="no">I was distracted</button>
    </div>
    <small>No response in 1 minute = idle mark</small>
  </div>
</div>

<div class="app">
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>
  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>
  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain:"focus-dashboard-5965a.firebaseapp.com",
  projectId:"focus-dashboard-5965a"
});
const db=getFirestore(app);

/* ===== ORIGINAL VARIABLES ===== */
const status=document.getElementById("status");
const tasksBox=document.getElementById("tasksBox");
const taskList=document.getElementById("taskList");
const dayEndBox=document.getElementById("dayEndBox");
const reportBox=document.getElementById("reportBox");
const historyBox=document.getElementById("historyBox");

const DAY_STATUS="DAY_STATUS";
const CURRENT_TASKS="CURRENT_TASKS";
const NEXT_TASKS="NEXT_TASKS";
const SESSIONS="SESSIONS";
const REPORTS="REPORTS";

const now=()=>new Date();
const stamp=()=>new Date().toLocaleTimeString([],{
  hour:"2-digit",minute:"2-digit"
});
const mins=(a,b)=>Math.round((b-a)/60000);

let idleMarks=0;
let lastActivity=Date.now();
let idlePopupShown=false;

/* ===== FUNCTIONS (UNCHANGED) ===== */
async function saveIdleMarks(){
  try{
    await setDoc(doc(db,"user_state","default"),{
      idleMarks,lastActive:new Date()
    });
  }catch(e){}
}
async function loadIdleMarks(){
  try{
    const s=await getDoc(doc(db,"user_state","default"));
    if(s.exists()) idleMarks=s.data().idleMarks||0;
  }catch(e){}
}

async function login(){
  if(!prompt("Enter ID")||!prompt("Enter Password"))return;
  await loadIdleMarks();
  lastActivity=Date.now();
  startSession();
  localStorage.setItem("LOGGED_IN","YES");
  status.innerText="Status: Logged in @ "+stamp();
  tasksBox.classList.remove("hidden");
  loadTasks();
}

function bioBreak(){
  endSession();
  localStorage.removeItem("LOGGED_IN");
  status.innerText="Status: Bio Break @ "+stamp();
  tasksBox.classList.add("hidden");
}

function startSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  s.push({start:now().toISOString(),end:null});
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}
function endSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  for(let i=s.length-1;i>=0;i--){
    if(!s[i].end){s[i].end=now().toISOString();break;}
  }
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}

function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  if(!data.length){
    taskList.innerText="No tasks assigned.";
    return;
  }
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task done?")){
        t.done=true;
        localStorage.setItem(CURRENT_TASKS,JSON.stringify(data));
      }else cb.checked=false;
    };
    const d=document.createElement("div");
    d.className="task";
    d.append(cb," "+t.name);
    taskList.appendChild(d);
  });
}

function openDayEnd(){
  if(localStorage.getItem("LOGGED_IN")!=="YES")return;
  let h="<h3>Confirm Day End</h3>";
  for(let i=0;i<7;i++)
    h+=`<input id="s${i}" placeholder="Subject ${i+1}"><br>`;
  h+=`<br>Distraction (min)<br>
      <input id="dist" type="number"><br><br>
      <button onclick="confirmDayEnd()">Confirm</button>`;
  dayEndBox.innerHTML=h;
  dayEndBox.classList.remove("hidden");
}

function confirmDayEnd(){
  idleMarks=0;
  saveIdleMarks();
  generateReport();
  bioBreak();
  status.innerText+=" – Thank you";
}

function generateReport(){
  reportBox.innerHTML="<h3>Report generated</h3>";
}

function toggleHistory(){
  historyBox.classList.toggle("hidden");
}

/* ===== IDLE POPUP ===== */
const overlay=document.getElementById("focusOverlay");
const btnStudy=document.getElementById("btnStudy");
const btnDistract=document.getElementById("btnDistract");

btnStudy.addEventListener("click",()=>{
  overlay.classList.add("hidden");
  lastActivity=Date.now();
});
btnDistract.addEventListener("click",()=>{
  idleMarks++;
  saveIdleMarks();
  overlay.classList.add("hidden");
});

setInterval(()=>{
  if(localStorage.getItem("LOGGED_IN")==="YES"){
    overlay.classList.remove("hidden");
  }
},30000);

/* ===== CRITICAL FIX: EXPOSE FUNCTIONS ===== */
window.login = login;
window.bioBreak = bioBreak;
window.openDayEnd = openDayEnd;
window.toggleHistory = toggleHistory;
window.confirmDayEnd = confirmDayEnd;

</script>

</body>
</html>
