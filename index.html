<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>

<style>
body{background:#020617;color:#e5e7eb;font-family:Segoe UI;margin:0}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
.sidebar{padding:20px;border-right:1px solid #1e293b}
.main{padding:20px}
button{width:100%;padding:10px;margin:6px 0;background:#020617;color:#fff;border:1px solid #334155}
.task{display:flex;gap:8px;margin:6px 0}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">
  <div class="sidebar">
    <h3>USER PANEL</h3>
    <div id="status">Logged out</div>
    <button onclick="login()">Login</button>
    <button onclick="dayEnd()">Day End</button>
  </div>

  <div class="main">
    <h3>Today Tasks</h3>
    <div id="taskList"></div>
    <input id="newTask" placeholder="Add task">
    <button onclick="addTask()">Add Task</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, where, getDocs,
  updateDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey:"AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain:"focus-dashboard-5965a.firebaseapp.com",
  projectId:"focus-dashboard-5965a"
});
const auth=getAuth(app);
const db=getFirestore(app);

/* STATE */
let uid=null;
let activeDayId=null;
let tasks=[];

/* LOGIN */
async function login(){
  const email=prompt("Email");
  const pass=prompt("Password");
  const res=await signInWithEmailAndPassword(auth,email,pass);
  uid=res.user.uid;
  document.getElementById("status").innerText="Logged in";
  await loadOrCreateDay();
}

/* LOAD OR CREATE DAY */
async function loadOrCreateDay(){
  const q=query(
    collection(db,"daily_tasks"),
    where("uid","==",uid),
    where("dayStatus","==","ACTIVE")
  );
  const snap=await getDocs(q);

  if(snap.empty){
    const ref=await addDoc(collection(db,"daily_tasks"),{
      uid,
      dayStatus:"ACTIVE",
      tasks:[],
      createdAt:serverTimestamp(),
      closedAt:null
    });
    activeDayId=ref.id;
    tasks=[];
  }else{
    activeDayId=snap.docs[0].id;
    tasks=snap.docs[0].data().tasks;
  }
  renderTasks();
}

/* RENDER */
function renderTasks(){
  const box=document.getElementById("taskList");
  box.innerHTML="";
  tasks.forEach((t,i)=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{tasks[i].done=true;saveTasks()};
    const d=document.createElement("div");
    d.className="task";
    d.append(cb,t.name);
    box.appendChild(d);
  });
}

/* SAVE TASKS */
async function saveTasks(){
  await updateDoc(doc(db,"daily_tasks",activeDayId),{tasks});
}

/* ADD TASK */
function addTask(){
  const v=document.getElementById("newTask").value.trim();
  if(!v)return;
  tasks.push({name:v,done:false});
  saveTasks();
  renderTasks();
  document.getElementById("newTask").value="";
}

/* DAY END */
async function dayEnd(){
  if(!activeDayId)return;

  const unfinished=tasks.filter(t=>!t.done);

  // close today
  await updateDoc(doc(db,"daily_tasks",activeDayId),{
    dayStatus:"CLOSED",
    closedAt:serverTimestamp()
  });

  // create next day
  await addDoc(collection(db,"daily_tasks"),{
    uid,
    dayStatus:"ACTIVE",
    tasks:unfinished,
    createdAt:serverTimestamp(),
    closedAt:null
  });

  alert("Day Ended. Next day prepared.");
  location.reload();
}

/* expose */
window.login=login;
window.addTask=addTask;
window.dayEnd=dayEnd;
</script>
</body>
</html>
