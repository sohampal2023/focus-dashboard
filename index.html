<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:#020617;
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  border-right:1px solid #1e293b;
  padding:20px;
}
.sidebar h2{
  margin:0 0 20px;
  color:#38bdf8;
  text-align:center;
}
.status{
  padding:15px;
  border:1px solid #334155;
  border-radius:12px;
  text-align:center;
  margin-bottom:20px;
}
.sidebar button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  background:#020617;
  color:#e5e7eb;
  border:1px solid #1e293b;
  border-radius:10px;
  cursor:pointer;
}

/* MAIN */
.main{
  position:relative;
  padding:30px;
}
.hidden{display:none}

/* BLOCKING POPUP */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:16px;
  padding:28px;
  width:340px;
  text-align:center;
}
.popup button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
.study{background:#22c55e;color:#022c22}
.distract{background:#ef4444;color:#450a0a}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>FOCUS</h2>
    <div id="status" class="status">Logged out</div>
    <button id="loginBtn">Login</button>
    <button id="bioBtn">Bio Break</button>
    <button id="dayEndBtn">Day End</button>
    <button id="historyBtn">History</button>
  </div>

  <!-- MAIN -->
  <div class="main">
    <h1>Dashboard</h1>
    <p id="score">Score: 100%</p>

    <div id="tasks" class="hidden">
      <h3>Tasks</h3>
      <p>No tasks yet</p>
    </div>
  </div>

</div>

<!-- POPUP -->
<div id="overlay" class="overlay hidden">
  <div class="popup">
    <h3>Focus Check</h3>
    <p>Are you studying?</p>
    <button id="studyBtn" class="study">Studying</button>
    <button id="distractBtn" class="distract">Distracted</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain: "focus-dashboard-5965a.firebaseapp.com",
  projectId: "focus-dashboard-5965a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* DOM */
const status = document.getElementById("status");
const overlay = document.getElementById("overlay");
const tasks = document.getElementById("tasks");
const scoreText = document.getElementById("score");

/* STATE */
let score = 100;
let missCount = 0;
let focusInterval = null;
let responseTimeout = null;

/* CORE LOGIC */
function showPopup(){
  overlay.classList.remove("hidden");

  responseTimeout = setTimeout(()=>{
    missCount++;

    if(missCount >= 3){
      score = Math.max(score - 2,0);
      scoreText.innerText = "Score: " + score + "%";
      logoutUser();
    }

    overlay.classList.add("hidden");
  },30000); // 30 sec to respond
}

function startCycle(){
  showPopup();
  focusInterval = setInterval(showPopup,30000); // every 30 sec
}

function stopCycle(){
  clearInterval(focusInterval);
  clearTimeout(responseTimeout);
  overlay.classList.add("hidden");
  missCount = 0;
}

function resetAfterResponse(){
  clearTimeout(responseTimeout);
  overlay.classList.add("hidden");
  missCount = 0;
}

async function logoutUser(){
  stopCycle();
  await signOut(auth);
}

/* BUTTONS */
loginBtn.onclick = async ()=>{
  const email = prompt("Email");
  const pass = prompt("Password");
  if(!email || !pass) return;
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    alert(e.message);
  }
};

bioBtn.onclick = async ()=>{
  await signOut(auth);
};

studyBtn.onclick = ()=>{
  resetAfterResponse();
};

distractBtn.onclick = ()=>{
  score = Math.max(score - 2,0);
  scoreText.innerText = "Score: " + score + "%";
  resetAfterResponse();
};

historyBtn.onclick = ()=>alert("History later");
dayEndBtn.onclick = ()=>alert("Day end later");

/* AUTH */
onAuthStateChanged(auth,(user)=>{
  if(user){
    status.innerText = "Logged in";
    tasks.classList.remove("hidden");
    startCycle();
  }else{
    status.innerText = "Logged out";
    tasks.classList.add("hidden");
    stopCycle();
  }
});
</script>

</body>
</html>
