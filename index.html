<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:Segoe UI,system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}
.sidebar{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  border-right:1px solid #1e293b;
}
.sidebar h2{
  text-align:center;
  color:#38bdf8;
  margin:0;
}
.status{
  padding:26px;
  border-radius:16px;
  border:2px solid #334155;
  text-align:center;
  font-weight:900;
  font-size:18px;
  line-height:1.6;
  background:#020617;
}
.nav button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  font-weight:600;
  cursor:pointer;
}
.main{
  padding:25px;
  overflow:auto;
}
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}
.hidden{display:none}
.task{display:flex;gap:10px;margin:8px 0}
.progress{
  height:18px;border-radius:10px;overflow:hidden;
  border:1px solid #1e293b;margin:6px 0 12px;
}
.bar{height:100%;font-size:11px;font-weight:700;text-align:center}
.bar.EXCELLENT{background:#22c55e}
.bar.GOOD{background:#84cc16}
.bar.AVERAGE{background:#facc15}
.bar.POOR{background:#ef4444}
.history-item{
  padding:12px;border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;margin-bottom:10px;
}

/* ===== CUSTOM IDLE POPUP ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup{
  background:#020617;
  border:2px solid #38bdf8;
  border-radius:18px;
  padding:25px;
  width:360px;
  text-align:center;
}
.popup h3{margin-top:0}
.popup p{color:#94a3b8}
.popup button{
  margin:10px;
  padding:10px 18px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
}
.study{background:#22c55e;color:#000}
.reel{background:#ef4444;color:#fff}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>
  <div id="status" class="status">Status: Logged out</div>
  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<div class="main">
  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>
  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>
</div>
</div>

<!-- ===== IDLE POPUP ===== -->
<div id="idleOverlay" class="overlay hidden">
  <div class="popup">
    <h3>Focus Check</h3>
    <p>Be honest.<br>Are you studying or watching reels?</p>
    <button class="study" onclick="idleResponse(true)">I am studying</button>
    <button class="reel" onclick="idleResponse(false)">I was distracted</button>
    <p style="font-size:12px">No response in 1 minute = idle mark</p>
  </div>
</div>

<script type="module">
/* ===== FIREBASE ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyD16NhAUgo3sgag01nZPZGHXjMvAZZ0rDE",
  authDomain:"focus-dashboard-5965a.firebaseapp.com",
  projectId:"focus-dashboard-5965a"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window.db=db;

/* ===== ORIGINAL CODE (UNCHANGED BELOW) ===== */
const status=document.getElementById("status");
const tasksBox=document.getElementById("tasksBox");
const taskList=document.getElementById("taskList");
const dayEndBox=document.getElementById("dayEndBox");
const reportBox=document.getElementById("reportBox");
const historyBox=document.getElementById("historyBox");

const DAY_STATUS="DAY_STATUS";
const CURRENT_TASKS="CURRENT_TASKS";
const NEXT_TASKS="NEXT_TASKS";
const SESSIONS="SESSIONS";
const REPORTS="REPORTS";

const now=()=>new Date();
const stamp=()=>new Date().toLocaleTimeString([],{
  hour:"2-digit",minute:"2-digit"
});
const mins=(a,b)=>Math.round((b-a)/60000);

/* ===== IDLE STATE ===== */
let idleMarks=0;
let lastActivity=Date.now();
let idlePopupShown=false;
let idleTimer=null;

async function saveIdleMarks(){
  try{
    await setDoc(doc(db,"user_state","default"),{
      idleMarks,lastActive:new Date()
    });
  }catch(e){}
}
async function loadIdleMarks(){
  try{
    const s=await getDoc(doc(db,"user_state","default"));
    if(s.exists()) idleMarks=s.data().idleMarks||0;
  }catch(e){}
}

/* ===== LOGIN / OTHER LOGIC (UNCHANGED) ===== */
async function login(){ /* same as yours */ 
  if(!prompt("Enter ID")||!prompt("Enter Password"))return;
  await loadIdleMarks();
  lastActivity=Date.now();
  startSession();
  localStorage.setItem("LOGGED_IN","YES");
  status.innerText="Status: Logged in @ "+stamp();
  tasksBox.classList.remove("hidden");
  loadTasks();
}
function bioBreak(){ endSession(); localStorage.removeItem("LOGGED_IN"); status.innerText="Status: Bio Break @ "+stamp(); tasksBox.classList.add("hidden"); }
function startSession(){ const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]"); s.push({start:now().toISOString(),end:null}); localStorage.setItem(SESSIONS,JSON.stringify(s)); }
function endSession(){ const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]"); for(let i=s.length-1;i>=0;i--){ if(!s[i].end){s[i].end=now().toISOString();break;} } localStorage.setItem(SESSIONS,JSON.stringify(s)); }

/* ===== ACTIVITY TRACK ===== */
["click","keydown","mousemove","touchstart"].forEach(e=>{
  document.addEventListener(e,()=>{ lastActivity=Date.now(); });
});

/* ===== IDLE CHECK (CUSTOM POPUP) ===== */
const IDLE_TIME=30*1000;
const MAX_MARKS=3;

setInterval(()=>{
  if(localStorage.getItem("LOGGED_IN")!=="YES")return;
  if(Date.now()-lastActivity>=IDLE_TIME && !idlePopupShown){
    idlePopupShown=true;
    document.getElementById("idleOverlay").classList.remove("hidden");

    idleTimer=setTimeout(async()=>{
      idleMarks++;
      await saveIdleMarks();
      hideIdle();
      if(idleMarks>=MAX_MARKS){
        alert("Maximum idle limit reached. Logging out.");
        idleMarks=0;
        await saveIdleMarks();
        bioBreak();
      }
    },60000);
  }
},5000);

function idleResponse(ok){
  clearTimeout(idleTimer);
  hideIdle();
  lastActivity=Date.now();
  if(!ok){
    idleMarks++;
    saveIdleMarks();
  }
}

function hideIdle(){
  idlePopupShown=false;
  document.getElementById("idleOverlay").classList.add("hidden");
}

/* ===== EXPOSE ===== */
window.login=login;
window.bioBreak=bioBreak;
window.idleResponse=idleResponse;
</script>

</body>
</html>
