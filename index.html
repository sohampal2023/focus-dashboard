<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Focus Tracker</title>

<style>
body{
  margin:0;
  font-family:system-ui,Segoe UI;
  background:#020617;
  color:#e5e7eb;
}
header{
  padding:16px;
  border-bottom:1px solid #334155;
}
main{
  max-width:800px;
  margin:auto;
  padding:20px;
}
input,button{
  padding:10px;
  margin:6px 0;
  background:#020617;
  border:1px solid #334155;
  color:#fff;
}
button{cursor:pointer}
.task{
  display:flex;
  gap:10px;
  margin:6px 0;
}
.done{opacity:.6}
.hidden{display:none}

/* POPUP */
#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
}
#popup{
  border:2px solid #38bdf8;
  padding:24px;
  border-radius:16px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <h3>Focus System</h3>
  <div id="status">Not logged in</div>
</header>

<main>

<div id="loginBox">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">
  <h3>Tasks</h3>
  <div id="taskList"></div>

  <input id="taskInput" placeholder="Add task">
  <button onclick="addTask()">Add Task</button>

  <br><br>
  <button onclick="dayEnd()">Day End</button>
  <div id="report"></div>
</div>

</main>

<!-- Focus Popup -->
<div id="overlay" class="hidden">
  <div id="popup">
    <h3>Focus Check</h3>
    <p>Are you studying?</p>
    <button onclick="focusAnswer(true)">Yes</button>
    <button onclick="focusAnswer(false)">No</button>
    <p style="font-size:12px">No response = miss</p>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ========= FIREBASE ========= */
firebase.initializeApp({
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT"
});
const auth = firebase.auth();
const db = firebase.database();

/* ========= STATE ========= */
let uid = null;
let sessionId = null;
let tasks = [];
let popupMiss = 0;
let score = 100;

let focusDelayTimer = null;   // 30 sec timer
let focusResponseTimer = null; // 60 sec timer
let loggedIn = false;

/* ========= LOGIN ========= */
async function login(){
  clearAllTimers();                 // 🔒 critical
  const res = await auth.signInWithEmailAndPassword(
    email.value.trim(),
    password.value.trim()
  );

  uid = res.user.uid;
  loggedIn = true;

  status.innerText = "Logged in";
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");

  await loadOrCreateSession();

  startFocusDelay();                // ✅ START ONLY HERE
}

/* ========= SESSION ========= */
async function loadOrCreateSession(){
  const snap = await db.ref("sessions/"+uid).once("value");

  if(!snap.exists() || snap.val().status === "CLOSED"){
    sessionId = Date.now();
    await db.ref("sessions/"+uid).set({
      sessionId,
      loginAt: firebase.database.ServerValue.TIMESTAMP,
      status: "ACTIVE",
      popupMiss: 0,
      score: 100
    });
    tasks = [];
  } else {
    sessionId = snap.val().sessionId;
    popupMiss = snap.val().popupMiss;
    score = snap.val().score;
    const t = await db.ref("tasks/"+uid+"/"+sessionId).once("value");
    tasks = t.exists() ? t.val() : [];
  }
  renderTasks();
}

/* ========= TASKS ========= */
function renderTasks(){
  taskList.innerHTML="";
  tasks.forEach((t,i)=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task completed?")){
        tasks[i].done=true;
        saveTasks();
      } else cb.checked=false;
    };
    const d=document.createElement("div");
    d.className="task"+(t.done?" done":"");
    d.append(cb,document.createTextNode(t.name));
    taskList.appendChild(d);
  });
}

async function saveTasks(){
  await db.ref("tasks/"+uid+"/"+sessionId).set(tasks);
  renderTasks();
}

function addTask(){
  const v=taskInput.value.trim();
  if(!v) return;
  tasks.push({name:v,done:false});
  saveTasks();
  taskInput.value="";
}

/* ========= FOCUS (FIXED) ========= */
function startFocusDelay(){
  clearAllTimers();
  focusDelayTimer = setTimeout(showPopup, 30000); // ✅ 30s AFTER LOGIN
}

function showPopup(){
  if(!loggedIn) return;

  overlay.classList.remove("hidden");

  focusResponseTimer = setTimeout(()=>{
    registerMiss();
  }, 60000);
}

function focusAnswer(ok){
  overlay.classList.add("hidden");
  clearAllTimers();

  if(!ok) registerMiss();
  startFocusDelay();
}

function registerMiss(){
  overlay.classList.add("hidden");
  popupMiss++;
  score -= 2;

  db.ref("sessions/"+uid).update({popupMiss, score});
  startFocusDelay();
}

/* ========= DAY END ========= */
async function dayEnd(){
  clearAllTimers();
  loggedIn = false;

  const done = tasks.filter(t=>t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done/total*100) : 0;

  await db.ref("sessions/"+uid).update({
    status:"CLOSED",
    popupMiss,
    score,
    dayEndAt: firebase.database.ServerValue.TIMESTAMP
  });

  report.innerHTML = `
    <h3>Report</h3>
    Tasks: ${done}/${total}<br>
    Completion: ${pct}%<br>
    Score: ${score}%
  `;
}

/* ========= TIMER SAFETY ========= */
function clearAllTimers(){
  clearTimeout(focusDelayTimer);
  clearTimeout(focusResponseTimer);
  focusDelayTimer = null;
  focusResponseTimer = null;
}
</script>

</body>
</html>
