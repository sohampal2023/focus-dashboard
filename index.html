<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>

<style>
/* ================= RESET & BASE ================= */
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:"Segoe UI",system-ui,sans-serif;
}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#e5e7eb;
}

/* ================= LAYOUT ================= */
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  height:100vh;
}

/* ================= SIDEBAR ================= */
.sidebar{
  background:linear-gradient(180deg,#020617,#020617);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:22px;
  border-right:1px solid #1e293b;
}

.sidebar h2{
  text-align:center;
  margin:0;
  font-size:22px;
  letter-spacing:1px;
  color:#38bdf8;
}

/* ================= STATUS (ENHANCED) ================= */
.status{
  background:linear-gradient(180deg,#020617,#020617);
  border:1px solid #334155;
  padding:20px 16px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  font-size:16px;
  line-height:1.5;
  box-shadow:
    0 0 0 1px rgba(56,189,248,.15),
    0 10px 25px rgba(0,0,0,.5);
  word-break:break-word;
}

/* ================= NAV ================= */
.nav button{
  width:100%;
  margin-bottom:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  background:#020617;
  color:#e5e7eb;
  border:1px solid #1e293b;
}
.nav button:hover{
  border-color:#38bdf8;
}

/* ================= MAIN ================= */
.main{
  padding:25px;
  overflow-y:auto;
}

/* ================= CARDS ================= */
.card{
  background:linear-gradient(135deg,#020617,#020617);
  border:1px solid #1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.hidden{display:none}

/* ================= MOTIVATION ================= */
.motivation img{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:14px;
}
.motivation p{
  margin-top:10px;
  font-style:italic;
  text-align:center;
  color:#94a3b8;
}

/* ================= TASKS ================= */
.task{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
}

/* ================= PROGRESS ================= */
.progress{
  background:#020617;
  border:1px solid #1e293b;
  height:18px;
  border-radius:10px;
  overflow:hidden;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  text-align:center;
  font-size:11px;
}

/* ================= HISTORY ================= */
.history-item{
  padding:12px;
  background:#020617;
  border:1px solid #1e293b;
  border-left:5px solid #38bdf8;
  border-radius:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="app">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <!-- STATUS -->
  <div id="status" class="status">
    Status: Logged out
  </div>

  <div class="nav">
    <button onclick="login()">Login</button>
    <button onclick="bioBreak()">Bio Break</button>
    <button onclick="openDayEnd()">Day End</button>
    <button onclick="toggleHistory()">History</button>
  </div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <div id="motivationBox" class="card motivation hidden"></div>

  <div id="tasksBox" class="card hidden">
    <h3>Assigned Tasks</h3>
    <div id="taskList"></div>
  </div>

  <div id="dayEndBox" class="card hidden"></div>
  <div id="reportBox" class="card hidden"></div>
  <div id="historyBox" class="card hidden"></div>

</div>
</div>

<script>
/* ================= DOM REFERENCES ================= */
const status = document.getElementById("status");
const tasksBox = document.getElementById("tasksBox");
const motivationBox = document.getElementById("motivationBox");
const dayEndBox = document.getElementById("dayEndBox");
const reportBox = document.getElementById("reportBox");
const historyBox = document.getElementById("historyBox");
const taskList = document.getElementById("taskList");

/* ================= TIMESTAMP ================= */
function timeStamp(){
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* ================= STORAGE ================= */
const DAY_STATUS="DAY_STATUS";
const CURRENT_TASKS="CURRENT_TASKS";
const NEXT_TASKS="NEXT_TASKS";
const SESSIONS="SESSIONS";
const REPORTS="REPORTS";

/* ================= HELPERS ================= */
function now(){return new Date()}
function mins(a,b){return Math.round((b-a)/60000)}

/* ================= LOGIN ================= */
function login(){
  const id=prompt("Enter ID");
  const pw=prompt("Enter Password");
  if(!id||!pw) return;

  if(localStorage.getItem(DAY_STATUS)==="CLOSED"){
    const next=localStorage.getItem(NEXT_TASKS);
    if(next){
      localStorage.setItem(CURRENT_TASKS,next);
      localStorage.removeItem(NEXT_TASKS);
    }
    localStorage.setItem(DAY_STATUS,"ACTIVE");
  }

  startSession();
  localStorage.setItem("LOGGED_IN","YES");

  status.innerText="Status: Logged in";
  status.innerText += " @ " + timeStamp();

  tasksBox.classList.remove("hidden");
  motivationBox.classList.remove("hidden");
  loadTasks();
}

/* ================= BIO BREAK ================= */
function bioBreak(){
  endSession();
  localStorage.removeItem("LOGGED_IN");

  if(localStorage.getItem(DAY_STATUS)==="CLOSED"){
    status.innerText="Status: Bio Break (Day Ended)";
  }else{
    status.innerText="Status: Bio Break";
  }

  status.innerText += " @ " + timeStamp();
  tasksBox.classList.add("hidden");
}

/* ================= SESSION ================= */
function startSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  s.push({start:now().toISOString(),end:null});
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}
function endSession(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  for(let i=s.length-1;i>=0;i--){
    if(!s[i].end){s[i].end=now().toISOString();break;}
  }
  localStorage.setItem(SESSIONS,JSON.stringify(s));
}

/* ================= TASKS ================= */
function loadTasks(){
  taskList.innerHTML="";
  const data=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  if(!data.length){
    taskList.innerText="No tasks assigned.";
    return;
  }
  data.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.disabled=t.done;
    cb.onchange=()=>{
      if(confirm("Confirm task done?")){
        t.done=true;
        localStorage.setItem(CURRENT_TASKS,JSON.stringify(data));
      }else cb.checked=false;
    };
    const div=document.createElement("div");
    div.className="task";
    div.appendChild(cb);
    div.append(" "+t.name);
    taskList.appendChild(div);
  });
}

/* ================= DAY END ================= */
function openDayEnd(){
  if(localStorage.getItem("LOGGED_IN")!=="YES") return;
  if(localStorage.getItem(DAY_STATUS)==="CLOSED") return;

  let html="<h3>Confirm Day End</h3>";
  html+="<p>Next Day Subjects (max 7)</p>";
  for(let i=0;i<7;i++){
    html+=`<input id="s${i}" placeholder="Subject ${i+1}"><br>`;
  }
  html+=`
    <br>Distraction Time (minutes)<br>
    <input id="dist" type="number" min="0"><br><br>
    <button onclick="confirmDayEnd()">Confirm Day End</button>
  `;
  dayEndBox.innerHTML=html;
  dayEndBox.classList.remove("hidden");
}

/* ================= CONFIRM DAY END ================= */
function confirmDayEnd(){
  let next=[];
  const cur=JSON.parse(localStorage.getItem(CURRENT_TASKS)||"[]");
  cur.filter(t=>!t.done).forEach(t=>next.push({name:t.name,done:false}));

  for(let i=0;i<7;i++){
    const v=document.getElementById("s"+i).value.trim();
    if(v) next.push({name:v,done:false});
  }

  localStorage.setItem(NEXT_TASKS,JSON.stringify(next));
  generateReport();
  localStorage.setItem(DAY_STATUS,"CLOSED");

  bioBreak();
  status.innerText += " – Thank you";
  dayEndBox.classList.add("hidden");
  reportBox.classList.remove("hidden");
}

/* ================= REPORT ================= */
function generateReport(){
  const s=JSON.parse(localStorage.getItem(SESSIONS)||"[]");
  let total=0;
  s.forEach(x=>{if(x.start&&x.end)total+=mins(new Date(x.start),new Date(x.end))});

  const dist=Number(document.getElementById("dist").value||0);
  const prod=Math.max(total-dist,0);
  const pct=total?Math.round(prod/total*100):0;

  let grade="POOR";
  if(pct>=80)grade="EXCELLENT";
  else if(pct>=60)grade="GOOD";
  else if(pct>=40)grade="AVERAGE";

  const r={date:new Date().toLocaleDateString(),pct,grade};
  const all=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  const prev=all.length?all[all.length-1]:null;
  all.push(r);
  localStorage.setItem(REPORTS,JSON.stringify(all));

  reportBox.innerHTML=`
    <h3>Report Card</h3>
    Productivity: ${pct}%
    <div class="progress"><div class="bar" style="width:${pct}%">${pct}%</div></div>
    Grade: <b>${grade}</b><br>
    ${prev?`Compared to previous day: ${pct-prev.pct>=0?"+":""}${pct-prev.pct}%`:""}
  `;
}

/* ================= HISTORY ================= */
function toggleHistory(){
  historyBox.classList.toggle("hidden");
  historyBox.innerHTML="<h3>History</h3>";
  const h=JSON.parse(localStorage.getItem(REPORTS)||"[]");
  h.forEach(x=>{
    historyBox.innerHTML+=`
      <div class="history-item">
        ${x.date} → ${x.pct}% (${x.grade})
      </div>`;
  });
}

/* ================= MOTIVATION ================= */
let img=1;
setInterval(()=>{
  if(localStorage.getItem("LOGGED_IN")==="YES"){
    motivationBox.innerHTML=`
      <img src="${img}.png">
      <p>Stay focused. One disciplined day builds your future.</p>`;
    img++; if(img>30)img=1;
  }
},60000);
</script>
</body>
</html>
