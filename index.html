<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; }
    .container {
      max-width: 720px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    .progress {
      width: 100%;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }
    .bar {
      height: 20px;
      background: #4caf50;
      color: white;
      text-align: center;
      font-size: 12px;
    }
    .report {
      background:#eef6ff;
      padding:15px;
      margin-top:20px;
      border-radius:6px;
    }
  </style>
</head>

<body onload="initPage()">
<div class="container">
  <h1>Focus Dashboard</h1>

  <p id="statusText">Status: Logged out</p>
  <p id="loginTime"></p>
  <p id="logoutTime"></p>

  <button onclick="login()">Login</button>
  <button onclick="logoutWithReason()">Logout</button>

  <hr>

  <h3>Assigned Tasks</h3>
  <div id="taskList">No tasks assigned.</div>

  <hr>

  <h3>Productivity</h3>
  Productive (minutes): <input type="number" id="prod" min="0"><br><br>
  Total (minutes): <input type="number" id="total" min="1"><br><br>

  <hr>

  <h3>Day End</h3>
  <button onclick="startDayEnd()">Day End</button>
  <div id="dayEndBox"></div>

  <div id="reportBox"></div>
</div>

<script>
/* ---------- STATE KEYS ---------- */
const CURRENT = "CURRENT_TASKS";
const NEXT = "NEXT_TASKS";
const DAY_ENDED = "DAY_ENDED";

/* ---------- LOGIN ---------- */
function login() {
  document.getElementById("statusText").innerText = "Status: Logged in";
  localStorage.setItem("loginTime", new Date().toLocaleTimeString());
  showTimes();
  activateNextDayIfNeeded();
  loadTasks();
  showReport();
}

function logoutWithReason() {
  const reason = prompt("Logout reason");
  if (!reason) return alert("Reason required");

  localStorage.setItem("logoutTime", new Date().toLocaleTimeString());
  localStorage.setItem("logoutReason", reason);
  document.getElementById("statusText").innerText = "Status: Logged out";
  showTimes();
}

/* ---------- DAY END ---------- */
function startDayEnd() {
  const n = Number(prompt("How many subjects next? (1–7)"));
  if (n < 1 || n > 7) return alert("1–7 only");

  let html = "<h4>Next Tasks</h4>";
  for (let i = 0; i < n; i++) {
    html += `<input id="s${i}" placeholder="Subject ${i+1}"><br><br>`;
  }
  html += `<button onclick="confirmDayEnd(${n})">Confirm Day End</button>`;
  dayEndBox.innerHTML = html;
}

function confirmDayEnd(n) {
  let nextTasks = [];

  // move unfinished current tasks
  const current = JSON.parse(localStorage.getItem(CURRENT) || "[]");
  current.filter(t => !t.done).forEach(t => nextTasks.push({ name: t.name, done:false }));

  // add new tasks
  for (let i = 0; i < n; i++) {
    const v = document.getElementById("s"+i).value.trim();
    if (!v) return alert("Fill all subjects");
    nextTasks.push({ name:v, done:false });
  }

  localStorage.setItem(NEXT, JSON.stringify(nextTasks));
  localStorage.removeItem(CURRENT);
  localStorage.setItem(DAY_ENDED, "true");

  generateReport();

  localStorage.setItem("logoutTime", new Date().toLocaleTimeString());
  logoutWithReason();
  location.reload();
}

/* ---------- TASK ACTIVATION ---------- */
function activateNextDayIfNeeded() {
  if (localStorage.getItem(DAY_ENDED) === "true") {
    const next = localStorage.getItem(NEXT);
    if (next) {
      localStorage.setItem(CURRENT, next);
      localStorage.removeItem(NEXT);
    }
    localStorage.removeItem(DAY_ENDED);
  }
}

/* ---------- TASK UI ---------- */
function loadTasks() {
  const box = document.getElementById("taskList");
  const data = localStorage.getItem(CURRENT);
  box.innerHTML = "";

  if (!data) {
    box.innerText = "No tasks assigned.";
    return;
  }

  const tasks = JSON.parse(data);
  tasks.forEach((t,i)=>{
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = t.done;
    cb.disabled = t.done;

    cb.onchange = () => {
      if (confirm("Confirm task done?")) {
        t.done = true;
        localStorage.setItem(CURRENT, JSON.stringify(tasks));
        loadTasks();
      } else cb.checked = false;
    };

    box.appendChild(cb);
    box.append(" " + t.name);
    box.appendChild(document.createElement("br"));
  });
}

/* ---------- REPORT CARD ---------- */
function generateReport() {
  const p = Number(document.getElementById("prod").value || 0);
  const t = Number(document.getElementById("total").value || 1);
  const prodPct = Math.round((p/t)*100);

  const tasks = JSON.parse(localStorage.getItem(CURRENT) || "[]");
  const done = tasks.filter(x=>x.done).length;
  const taskPct = tasks.length ? Math.round((done/tasks.length)*100) : 100;

  const status = prodPct>=80 ? "EXCELLENT" : prodPct>=50 ? "AVERAGE" : "POOR";

  const report = { prodPct, taskPct, status };
  localStorage.setItem("LAST_REPORT", JSON.stringify(report));
}

function showReport() {
  const r = localStorage.getItem("LAST_REPORT");
  if (!r) return;
  const d = JSON.parse(r);

  reportBox.innerHTML = `
    <div class="report">
      <h3>Last Report Card</h3>
      Productivity: ${d.prodPct}%
      <div class="progress"><div class="bar" style="width:${d.prodPct}%">${d.prodPct}%</div></div>
      Task Completion: ${d.taskPct}%
      <div class="progress"><div class="bar" style="width:${d.taskPct}%">${d.taskPct}%</div></div>
      <b>Status: ${d.status}</b>
    </div>`;
}

/* ---------- UI ---------- */
function showTimes() {
  loginTime.innerText = "Login: " + (localStorage.getItem("loginTime") || "");
  logoutTime.innerText = "Logout: " + (localStorage.getItem("logoutTime") || "");
}

function initPage() {
  showTimes();
  loadTasks();
  showReport();
}
</script>
</body>
</html>
