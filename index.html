<!DOCTYPE html>
<html>
<head>
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="loadRecord()">
  <div class="container">
    <h1>Focus Dashboard</h1>
    <p>Your personal study focus system is running.</p>

    <p class="status" id="statusText">Status: Logged out</p>

    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Daily Focus Report</h3>

    <label>Productive Time (HH : MM : SS)</label><br>
    <input type="number" id="ph"> :
    <input type="number" id="pm"> :
    <input type="number" id="ps">
    <br><br>

    <label>Distracting Time (HH : MM : SS)</label><br>
    <input type="number" id="dh"> :
    <input type="number" id="dm"> :
    <input type="number" id="ds">
    <br><br>

    <label>Total Time (HH : MM : SS)</label><br>
    <input type="number" id="th"> :
    <input type="number" id="tm"> :
    <input type="number" id="ts">
    <br><br>

    <label>Upload Proof (2–4 screenshots)</label><br>
    <input type="file" id="proof" accept="image/*" multiple>
    <br><br>

    <button onclick="submitReport()">Submit Report</button>

    <p id="result"></p>
    <p id="saved"></p>
  </div>

  <script>
    function login() {
      document.getElementById("statusText").innerText = "Status: Logged in";
    }

    function logout() {
      document.getElementById("statusText").innerText = "Status: Logged out";
    }

    function toSeconds(h, m, s) {
      return (h * 3600) + (m * 60) + s;
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function submitReport() {
      const files = document.getElementById("proof").files;

      if (!files || files.length < 2 || files.length > 4) {
        saveRecord("ABSENT", "0");
        document.getElementById("result").innerText =
          "ABSENT: Proof not valid.";
        return;
      }

      const productive = toSeconds(
        +ph.value, +pm.value, +ps.value
      );
      const distracting = toSeconds(
        +dh.value, +dm.value, +ds.value
      );
      const total = toSeconds(
        +th.value, +tm.value, +ts.value
      );

      if (productive + distracting > total || total === 0) {
        document.getElementById("result").innerText =
          "Invalid time values.";
        return;
      }

      const productivity = ((productive / total) * 100).toFixed(1);

      saveRecord("PRESENT", productivity);

      document.getElementById("result").innerText =
        "PRESENT ✔ | Productivity: " + productivity + "%";
    }

    function saveRecord(status, productivity) {
      const record = {
        date: today(),
        status: status,
        productivity: productivity
      };
      localStorage.setItem("focus-" + today(), JSON.stringify(record));
      showSaved(record);
    }

    function loadRecord() {
      const data = localStorage.getItem("focus-" + today());
      if (data) {
        showSaved(JSON.parse(data));
      }
    }

    function showSaved(record) {
      document.getElementById("saved").innerText =
        "Saved Record → " +
        record.date +
        " | " +
        record.status +
        " | Productivity: " +
        record.productivity +
        "%";
    }
  </script>
</body>
</html>
