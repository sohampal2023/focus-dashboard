<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus System</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Segoe UI,system-ui,sans-serif}
body{background:#020617;color:#e5e7eb}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{padding:20px;border-right:1px solid #1e293b}
.sidebar h2{text-align:center;color:#7dd3fc;margin-bottom:12px}
.status{padding:10px;border:1px solid #334155;border-radius:10px;text-align:center;margin-bottom:10px}
button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:10px;border:1px solid #334155;
  background:#020617;color:#e5e7eb;cursor:pointer
}
button:disabled{opacity:.4}

/* IDLE */
.idleBox{
  padding:12px;border:1px solid #38bdf8;
  border-radius:12px;text-align:center;
  margin-bottom:12px;background:#020617
}

/* MAIN */
.main{padding:24px;overflow:auto}
.card{
  background:#020617;border:1px solid #334155;
  border-radius:14px;padding:20px;margin-bottom:20px
}
.hidden{display:none}

/* SPEEDOMETER */
.speedo{
  width:300px;height:150px;border-radius:300px 300px 0 0;
  background:conic-gradient(from -90deg,
    #7f1d1d,#92400e,#a16207,#14532d,#312e81);
  position:relative;
  box-shadow:inset 0 0 0 14px #020617,inset 0 0 0 18px #1e293b
}
.needle{
  position:absolute;width:4px;height:110px;
  background:#e5e7eb;left:50%;bottom:0;
  transform-origin:bottom center;transform:rotate(-90deg);
  transition:.6s cubic-bezier(.15,.85,.2,1)
}
.cap{
  position:absolute;width:14px;height:14px;background:#e5e7eb;
  border-radius:50%;left:50%;bottom:0;
  transform:translate(-50%,50%)
}

.percent{text-align:center;font-size:36px;font-weight:800;color:#7dd3fc}
.rating{text-align:center;font-size:18px;font-weight:700}
.details{text-align:center;font-size:14px;color:#cbd5f5}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #334155;padding:6px;text-align:center}
</style>
</head>

<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>FOCUS SYSTEM</h2>

  <div id="statusBox" class="status">Logged out</div>

  <div id="idleBox" class="idleBox hidden">
    Idle Time Left:
    <b><span id="idleTime">30:00</span></b><br><br>
    <button onclick="resetIdle()">I am studying</button>
  </div>

  <button id="loginBtn" onclick="login()">Login</button>
  <button id="bioBtn" onclick="bioBreak()" disabled>Bio Break</button>
  <button id="dayBtn" onclick="openDayEnd()" disabled>Day End</button>
</div>

<!-- MAIN -->
<div class="main">

<div id="taskBox" class="card hidden">
  <div style="display:grid;grid-template-columns:1fr 320px;gap:20px">

    <div>
      <h3>Assigned Tasks</h3>
      <div id="taskList"></div>
      <hr>
      <h4>Extra Work</h4>
      <div id="extraList"></div>
      <button onclick="addExtra()">+ Add Extra Work</button>
    </div>

    <div>
      <h3 style="text-align:center">Live Progress</h3>
      <div class="speedo">
        <div id="needle" class="needle"></div>
        <div class="cap"></div>
      </div>
      <div id="livePercent" class="percent">0%</div>
      <div id="liveRating" class="rating">Poor</div>
      <div id="liveDetails" class="details"></div>
    </div>

  </div>
</div>

<div id="logBox" class="card hidden">
  <h3>Login / Logout Log</h3>
  <table>
    <thead>
      <tr><th>Login</th><th>Logout</th><th>Reason</th></tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<div id="nextDayBox" class="card hidden"></div>
<div id="reportBox" class="card hidden"></div>

</div>
</div>

<script>
/* ================= AUDIO UNLOCK ================= */
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

/* Beep */
function playBeep(){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = 880;
  gain.gain.value = 0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),300);
}

/* ================= IDLE (TAB SAFE) ================= */
const IDLE_LIMIT = 30 * 60 * 1000;   // 30 min
const WARNING_AT = 60 * 1000;        // 1 min

let idleTimer = null;
let lastActive = null;
let warningPlayed = false;

function startIdle(){
  clearInterval(idleTimer);
  lastActive = Date.now();
  warningPlayed = false;
  idleBox.classList.remove("hidden");
  idleTimer = setInterval(checkIdle, 1000);
}

function checkIdle(){
  const now = Date.now();
  const remaining = IDLE_LIMIT - (now - lastActive);

  if(remaining <= 0){
    autoLogout();
    return;
  }

  const m = Math.floor(remaining/60000);
  const s = Math.floor((remaining%60000)/1000);
  idleTime.innerText = `${m}:${String(s).padStart(2,"0")}`;

  if(remaining <= WARNING_AT && !warningPlayed){
    playBeep();
    warningPlayed = true;
  }
}

function resetIdle(){
  unlockAudio();           // user gesture → audio allowed
  lastActive = Date.now();
  warningPlayed = false;
}

/* ================= CORE ================= */
let UID=null;
const nowStr=()=>new Date().toLocaleString();
const key=k=>UID+"_"+k;

function autoLogout(){
  clearInterval(idleTimer);
  idleBox.classList.add("hidden");
  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||[]);
  logs[logs.length-1].logout = nowStr();
  logs[logs.length-1].reason = "Idle timeout";
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));
  location.reload();
}

function login(){
  unlockAudio();           // 🔑 unlock sound here
  UID=prompt("Email");
  if(!UID) return;

  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||[]);
  logs.push({login:nowStr(),logout:"-",reason:"-"});
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));

  statusBox.innerText="Logged in";
  loginBtn.disabled=true;
  bioBtn.disabled=false;
  dayBtn.disabled=false;

  startIdle();
  setupTasks();
  loadTasks();
  renderLogs();
}

function bioBreak(){
  clearInterval(idleTimer);
  const logs=JSON.parse(localStorage.getItem(key("LOGS")));
  logs[logs.length-1].logout = nowStr();
  logs[logs.length-1].reason = "Bio break";
  localStorage.setItem(key("LOGS"),JSON.stringify(logs));
  location.reload();
}

/* ================= TASKS (unchanged) ================= */
function setupTasks(){
  if(!localStorage.getItem(key("TASKS"))){
    localStorage.setItem(key("TASKS"),JSON.stringify([
      {name:"Study",done:false},
      {name:"Revise",done:false},
      {name:"Practice",done:false}
    ]));
  }
  localStorage.setItem(key("EXTRA"),JSON.stringify([]));
  taskBox.classList.remove("hidden");
  logBox.classList.remove("hidden");
}

function loadTasks(){
  taskList.innerHTML="";
  extraList.innerHTML="";
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));

  tasks.forEach(t=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=t.done;
    cb.onchange=()=>{
      if(!confirm("Confirm task completion?")){
        cb.checked=!cb.checked;return;
      }
      t.done=cb.checked;
      save(tasks,extras);
    };
    taskList.append(cb," "+t.name,document.createElement("br"));
  });

  extras.forEach(e=>{
    const cb=document.createElement("input");
    cb.type="checkbox";
    cb.checked=e.done;
    cb.onchange=()=>{
      if(!confirm("Confirm extra work completion?")){
        cb.checked=!cb.checked;return;
      }
      e.done=cb.checked;
      save(tasks,extras);
    };
    extraList.append(cb," "+e.name,document.createElement("br"));
  });
}

function addExtra(){
  const name=prompt("Extra work?");
  if(!name)return;
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));
  extras.push({name,done:false});
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  loadTasks();
}

function save(tasks,extras){
  localStorage.setItem(key("TASKS"),JSON.stringify(tasks));
  localStorage.setItem(key("EXTRA"),JSON.stringify(extras));
  updateProgress();
}

/* ================= PROGRESS ================= */
function calculate(){
  const tasks=JSON.parse(localStorage.getItem(key("TASKS")));
  const extras=JSON.parse(localStorage.getItem(key("EXTRA")));
  const done=tasks.filter(t=>t.done).length+extras.filter(e=>e.done).length;
  const percent=Math.round((done/tasks.length)*100);
  return percent;
}
function updateProgress(){
  const p=calculate();
  needle.style.transform=`rotate(${(Math.min(p,300)/300)*180-90}deg)`;
  livePercent.innerText=p+"%";
  liveRating.innerText=p<=100?"Excellent":"Fabulous";
}

/* ================= LOG TABLE ================= */
function renderLogs(){
  const logs=JSON.parse(localStorage.getItem(key("LOGS"))||[]);
  logTable.innerHTML="";
  logs.forEach(l=>{
    logTable.innerHTML+=
      `<tr><td>${l.login}</td><td>${l.logout}</td><td>${l.reason}</td></tr>`;
  });
}
</script>
</body>
</html>
